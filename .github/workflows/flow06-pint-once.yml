name: Flow 06 Pint Once

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/flow06-pint-once.yml'

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pint Flow 06 files
        run: |
          vendor/bin/pint \
            Modules/Warehouse/app/Services/AlignedOutboundStockService.php \
            Modules/Warehouse/app/Http/Controllers/AlignedOutboundFlowController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedOutboundDocumentController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedImportMatchReportController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedLabelLogReportController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedWarrantyReportController.php \
            Modules/Warehouse/app/Providers/Flow06AlignmentServiceProvider.php \
            Modules/Warehouse/database/migrations/2026_08_15_140000_align_packing_label_to_outbound_document.php \
            tests/Feature/Flow06PackingLabelAlignmentTest.php \
            tests/Feature/Flow06WarrantyReportAlignmentTest.php \
            tests/Feature/DocumentationBaselineContractTest.php
      - name: Syntax verification
        run: |
          for file in \
            Modules/Warehouse/app/Services/AlignedOutboundStockService.php \
            Modules/Warehouse/app/Http/Controllers/AlignedOutboundFlowController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedOutboundDocumentController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedImportMatchReportController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedLabelLogReportController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedWarrantyReportController.php \
            Modules/Warehouse/app/Providers/Flow06AlignmentServiceProvider.php \
            Modules/Warehouse/database/migrations/2026_08_15_140000_align_packing_label_to_outbound_document.php \
            tests/Feature/Flow06PackingLabelAlignmentTest.php \
            tests/Feature/Flow06WarrantyReportAlignmentTest.php \
            tests/Feature/DocumentationBaselineContractTest.php; do
            php -l "$file"
          done
          git diff --check
      - name: Commit Pint changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already Pint-clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Modules/Warehouse/app/Services/AlignedOutboundStockService.php \
            Modules/Warehouse/app/Http/Controllers/AlignedOutboundFlowController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedOutboundDocumentController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedImportMatchReportController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedLabelLogReportController.php \
            Modules/Warehouse/app/Http/Controllers/AlignedWarrantyReportController.php \
            Modules/Warehouse/app/Providers/Flow06AlignmentServiceProvider.php \
            Modules/Warehouse/database/migrations/2026_08_15_140000_align_packing_label_to_outbound_document.php \
            tests/Feature/Flow06PackingLabelAlignmentTest.php \
            tests/Feature/Flow06WarrantyReportAlignmentTest.php \
            tests/Feature/DocumentationBaselineContractTest.php
          git commit -m 'style(flow06): chuẩn hóa Pint'
          git push origin HEAD:m1

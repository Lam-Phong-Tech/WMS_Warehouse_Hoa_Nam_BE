name: Seed Replay Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/database/seeders/**'
      - 'Modules/Auth/app/Support/SeedEnvironment.php'
      - 'Modules/Auth/database/seeders/**'
      - 'app/Console/Commands/SeedPreflightCommand.php'
      - 'config/deployment_safety.php'
      - 'tests/Feature/SeedReplay*Test.php'
      - 'tests/Feature/SeedPreflightTest.php'
      - 'scripts/test-seed-replay-*.php'
      - 'docs/contracts/seed-replay-safety-v1.json'
      - 'composer.lock'
      - '.github/workflows/seed-replay-contract.yml'
permissions:
  contents: read
concurrency:
  group: seed-replay-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '${{ github.run_id }}-seed-replay-only'
          POSTGRES_DB: p12_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p12_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_DATABASE: p12_contract_test
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: '${{ github.run_id }}-seed-replay-only'
      DB_SSLMODE: disable
      DB_URL: ''
      WMS_PROTECT_DEPLOYMENT_DATABASE: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
      HN_DAILY_COVERAGE_DAYS: '0'
      P19_COMMAND_RECOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact source and preserved handoff ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor eaa8fd2fd4ffb4013e6b72da0fa1384e80ef0154 HEAD
          git rev-parse HEAD
          sha256sum composer.lock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, sqlite3, pdo_sqlite, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Prepare disposable runtime with locked dependencies
        run: |
          cp .env.example .env
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "WMS_FIXTURE_PASSWORD=$secret" >> "$GITHUB_ENV"
          composer install --no-interaction --prefer-dist --no-progress > /tmp/seed-composer.log 2>&1 || { tail -40 /tmp/seed-composer.log; exit 1; }
          git diff --exit-code -- composer.lock
          php artisan key:generate
          php artisan config:clear
          PGPASSWORD="$DB_PASSWORD" createdb -h 127.0.0.1 -U postgres component_issue_seeder_test
      - name: Style syntax and contract validation without source rewriting
        run: |
          vendor/bin/pint --test Modules/Warehouse/database/seeders/InventoryStockStatusMixSeeder.php Modules/Warehouse/database/seeders/WarehouseOperationsCoverageSeeder.php scripts/test-seed-replay-contract.php tests/Feature/SeedReplayFixtureContractTest.php
          php -l Modules/Warehouse/database/seeders/InventoryStockStatusMixSeeder.php
          php -l Modules/Warehouse/database/seeders/WarehouseOperationsCoverageSeeder.php
          php -l scripts/test-seed-replay-contract.php
          php -l tests/Feature/SeedReplayFixtureContractTest.php
          python3 -m json.tool docs/contracts/seed-replay-safety-v1.json > /dev/null
      - name: PostgreSQL repeat rollback and immutable backfill assertions
        env:
          DB_DATABASE: component_issue_seeder_test
        run: |
          php scripts/test-seed-replay-contract.php
          php scripts/test-component-issue-seeder-immutability.php
      - name: Migrated PostgreSQL fixture login preflight P12 P13 tests
        run: php artisan test tests/Feature/SeedReplayFixtureContractTest.php tests/Feature/SeedPreflightTest.php tests/Feature/P12ReadRevision2Test.php tests/Feature/P13NotificationRevision2Test.php --log-junit seed-pgsql.xml
      - name: Migrated SQLite fixture login preflight P12 P13 tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test tests/Feature/SeedReplayFixtureContractTest.php tests/Feature/SeedPreflightTest.php tests/Feature/P12ReadRevision2Test.php tests/Feature/P13NotificationRevision2Test.php --log-junit seed-sqlite.xml
      - name: Locked dependency audit
        run: composer audit --locked --no-interaction
      - name: Require nonempty evidence and publish scoped summary
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          import xml.etree.ElementTree as ET
          lines = ['## Seed replay scoped validation', 'Source: '+os.environ['GITHUB_SHA'],
              'Not full-chain seed, deployed-overlay validation, live seed authorization or production approval.']
          invalid = []
          for filename in ['seed-pgsql.xml','seed-sqlite.xml']:
              path = Path(filename)
              if not path.is_file() or not path.stat().st_size:
                  invalid.append(filename+': missing report')
                  continue
              root = ET.parse(path).getroot()
              suites = root.findall('./testsuite')
              if not suites or not list(root.iter('testcase')):
                  invalid.append(filename+': empty report')
              for suite in suites:
                  counts = {k:int(suite.get(k,'0')) for k in ['tests','assertions','errors','failures','skipped']}
                  lines.append(filename+' '+json.dumps(counts,sort_keys=True))
                  if counts['tests'] == 0 or counts['assertions'] == 0 or any(counts[k] for k in ['errors','failures','skipped']):
                      invalid.append(filename+': unsuccessful suite')
              lines.append('REPORT_SHA256 '+filename+' '+hashlib.sha256(path.read_bytes()).hexdigest())
          for filename in ['composer.lock','Modules/Warehouse/database/seeders/InventoryStockStatusMixSeeder.php','Modules/Warehouse/database/seeders/WarehouseOperationsCoverageSeeder.php','scripts/test-seed-replay-contract.php','tests/Feature/SeedReplayFixtureContractTest.php']:
              path = Path(filename)
              lines.append('SOURCE_SHA256 '+filename+' '+hashlib.sha256(path.read_bytes()).hexdigest())
          report = '\n\n'.join(lines)+'\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output: output.write(report)
          if invalid: raise SystemExit('; '.join(invalid))
          PY

name: WWHN-172 Apply Verified Payload

on:
  push:
    branches: [m1]
    paths:
      - '.github/wwhn172-staging/**'
      - '.github/workflows/wwhn-172-apply-payload.yml'

permissions:
  contents: write

concurrency:
  group: wwhn-172-apply-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout m1
        uses: actions/checkout@v4
        with:
          ref: m1
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/wwhn172-staging/payload.b64.part-* | tr -d '\r\n' | base64 --decode > /tmp/wwhn172.tar.gz
          echo '99ee6bcce1909921880e52250ec1f7ec8693b61d25fa8b15be37df282b49badb  /tmp/wwhn172.tar.gz' | sha256sum --check
          tar -tzf /tmp/wwhn172.tar.gz > /tmp/wwhn172-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/wwhn172-files.txt; then
            echo 'Unsafe path detected in payload' >&2
            exit 1
          fi
          test "$(wc -l < /tmp/wwhn172-files.txt)" -eq 19

      - name: Apply payload and remove staging transport
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/wwhn172.tar.gz -C .
          rm -rf .github/wwhn172-staging
          rm -f .github/workflows/wwhn-172-apply-payload.yml

      - name: Pre-commit contract validation
        shell: bash
        run: |
          set -euo pipefail
          php -l Modules/Warehouse/app/Http/Controllers/WarrantyController.php
          php -l Modules/Warehouse/app/Services/WarrantyService.php
          php -l Modules/Warehouse/app/Models/WarrantyCase.php
          php -l Modules/Warehouse/app/Models/WarrantyEvent.php
          php -l Modules/Warehouse/app/Models/InventorySerial.php
          php -l Modules/Warehouse/database/migrations/2026_08_03_000200_harden_wwhn172_warranty_contract.php
          php -l Modules/Auth/database/seeders/AuthDatabaseSeeder.php
          php -l Modules/Warehouse/routes/api.php
          php -l tests/Feature/WarrantyStatusOnlyContractTest.php
          php -l scripts/prepare-wwhn172-postman-fixture.php
          php -l scripts/snapshot-wwhn172-stock.php
          php -l scripts/verify-wwhn172-warranty-contract.php
          php scripts/verify-wwhn172-warranty-contract.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('docs/docs_task_jira/WWHN-172-source-register.json'),
              Path('docs/postman/WWHN-172 Warranty CI.postman_environment.json'),
              Path('docs/postman/WWHN-172 Warranty Contract.postman_collection.json'),
              Path('docs/testing/WWHN-172-warranty-test-cases.json'),
          ]:
              json.loads(path.read_text())
          PY
          git diff --check

      - name: Commit implementation to m1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(WWHN-172): implement complete warranty lifecycle contract'
          git push origin HEAD:m1

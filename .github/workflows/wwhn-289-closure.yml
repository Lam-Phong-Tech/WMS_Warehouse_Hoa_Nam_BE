name: WWHN-289 Exact SHA Closure

# DEV289-P1-02R — vòng review 73/100 bác bỏ CHUỖI BẰNG CHỨNG, không bác bỏ nội dung fix.
# Ba thay đổi cốt lõi so với bản trước:
#   1. Xoá `build/evidence/wwhn-289/*.json` TRƯỚC khi chạy test và bắt buộc chúng xuất hiện
#      lại sau đó. Bản trước copy hai file ĐÃ COMMIT rồi đọc `reconcile.mismatch_count`
#      trong đó, nên cổng tự xác nhận bằng một artifact tĩnh — nó xanh kể cả khi test không
#      ghi được gì (và trên thực tế test chưa từng ghi được: xem docblock
#      Wwhn289StockInvariantProofTest::tearDownAfterClass).
#   2. Kiểm đủ BẢY chiều stock + SÁU nhóm security theo register mới, không chỉ mismatch=0.
#   3. (bổ sung ở closure revision) chạy scripts/verify-wwhn289-closure.mjs để pin/digest/
#      supersession được máy kiểm — bước đó chỉ có nghĩa khi PINS đã trỏ vào run xanh này.

on:
  push:
    branches: [m1]
    paths:
      - 'docs/evidence/WWHN-289/**'
      - 'scripts/verify-wwhn289-closure.mjs'
      - 'tests/Feature/Wwhn289StockInvariantProofTest.php'
      - 'tests/Feature/Wwhn289SecurityRegressionProofTest.php'
      - 'tests/Feature/Wwhn289ClosureEvidenceTest.php'
      - 'app/Support/IdempotencyStore.php'
      - 'app/Support/RateLimitResponse.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'config/rate_limit.php'
      - 'Modules/Auth/app/Http/Controllers/AuthController.php'
      - 'Modules/Auth/routes/api.php'
      - 'Modules/Warehouse/app/Http/Middleware/**'
      - 'Modules/Warehouse/routes/api.php'
      - 'Modules/Warehouse/database/migrations/2026_08_19_000050_repair_erd_mirror_projection_casts.php'
      - '.github/workflows/wwhn-289-closure.yml'
  pull_request:
    branches: [m1]
    paths:
      - 'docs/evidence/WWHN-289/**'
      - 'scripts/verify-wwhn289-closure.mjs'
      - 'tests/Feature/Wwhn289StockInvariantProofTest.php'
      - 'tests/Feature/Wwhn289SecurityRegressionProofTest.php'
      - 'tests/Feature/Wwhn289ClosureEvidenceTest.php'
      - 'app/Support/IdempotencyStore.php'
      - 'app/Support/RateLimitResponse.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'config/rate_limit.php'
      - 'Modules/Auth/app/Http/Controllers/AuthController.php'
      - 'Modules/Auth/routes/api.php'
      - 'Modules/Warehouse/app/Http/Middleware/**'
      - 'Modules/Warehouse/routes/api.php'
      - 'Modules/Warehouse/database/migrations/2026_08_19_000050_repair_erd_mirror_projection_casts.php'
      - '.github/workflows/wwhn-289-closure.yml'

permissions:
  contents: read

jobs:
  closure:
    name: Stock invariant / security regression closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoanam_wwhn289
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoanam_wwhn289"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_WRITE_POLICY: outbox_required
      CI_DEMO_PASSWORD: WWHN289-CI-Only-2026
      # HS256 đòi khoá >= 256 bit. Giá trị cũ dài 29 ký tự = 232 bit nên lcobucci ném
      # "Key provided is shorter than 256 bits" ngay ở JWTGuard::attempt(), kéo theo toàn
      # bộ test auth/RBAC. Lỗi này nằm im qua ba run đầu vì cả ba chết sớm hơn, ở bước
      # migrate. Giữ >= 32 ký tự.
      JWT_SECRET: WWHN289-CI-JWT-Exact-SHA-Closure-Gate-2026-0819
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: hoanam_wwhn289
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # Verifier cần lịch sử để kiểm range invariant (final là ancestor của HEAD) và
          # "không commit nào sau final chạm code WWHN-289". Shallow clone làm cả hai phép
          # đo đó im lặng trả sai.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, bcmath
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Style check on WWHN-289 sources
        run: >-
          vendor/bin/pint --test
          tests/Feature/Wwhn289StockInvariantProofTest.php
          tests/Feature/Wwhn289SecurityRegressionProofTest.php
          tests/Feature/Wwhn289ClosureEvidenceTest.php
          app/Support/RateLimitResponse.php
          app/Support/IdempotencyStore.php
          app/Providers/AppServiceProvider.php
          config/rate_limit.php
          Modules/Warehouse/app/Http/Middleware/EnforceInboundWarehouseScope.php
          Modules/Warehouse/database/migrations/2026_08_19_000050_repair_erd_mirror_projection_casts.php

      - name: Fail-closed evidence markers
        run: |
          set -euo pipefail
          register='docs/evidence/WWHN-289/WWHN-289_DEFECT_FIX_REGISTER.md'
          test -s "$register"
          for marker in DEV289-P1-01R DEV289-P1-02R DEV289-P1-03R DEV289-P1-04R DEV289-P1-05R DEV289-P1-06R DEV289-P2-01 SEC289-01 SEC289-02 SEC289-03; do
            grep -Fq "$marker" "$register"
          done
          grep -Fq 'FAIL-CLOSED / NEEDS OWNER DISPOSITION' "$register"
          test -s 'docs/evidence/WWHN-289/WWHN-289_PINS.json'

      - name: Assert canonical 409 idempotency contract is not regressed
        run: |
          set -euo pipefail
          # §8.2 + AC-GWT-IDEMP-001: mã ngoài contract không được quay lại.
          if grep -rn "'IDEMPOTENCY_ERROR'" app/ Modules/ tests/ --include='*.php'; then
            echo "IDEMPOTENCY_ERROR không còn là mã hợp lệ theo SRS §8.2" >&2
            exit 1
          fi

      - name: Prepare runtime
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Migrate and seed PostgreSQL
        # Bước này từng đỏ ở cả ba run trước vì write-bridge ERD không cast text->uuid;
        # migration 2026_08_19_000050 sửa gốc chuyện đó.
        run: php artisan migrate:fresh --seed --force

      - name: Discard committed proof artifacts so the run must regenerate them
        run: |
          set -euo pipefail
          rm -f build/evidence/wwhn-289/stock-invariant-proof.json
          rm -f build/evidence/wwhn-289/security-regression-proof.json
          echo "Đã xoá artifact đã commit — từ đây cổng chỉ đọc thứ do lần chạy này sinh ra."

      - name: WWHN-289 focused regression suite
        run: >-
          php artisan test --filter
          '/(Wwhn289StockInvariantProofTest|Wwhn289SecurityRegressionProofTest|Wwhn289ClosureEvidenceTest|Wwhn201PostIssueAtomicNonNegativeStockTest|Wwhn199ReservationConcurrencyGuardTest|Wwhn180IdempotencyAtomicityTest|StockDocumentIdempotencyTest|StockDocumentConcurrencyGuardTest|InventoryReconciliationIntegrityTest|Wwhn211InventoryScopeTest|SecurityRbacAuditNegativeTest|AuthRbacAuditHardeningTest|AuthorizationTest|Wwhn172SkuContainerTransactionTest|WarrantyStatusOnlyContractTest)/'

      - name: Assert proof artifacts came from THIS run
        run: |
          set -euo pipefail
          for artifact in stock-invariant-proof security-regression-proof; do
            path="build/evidence/wwhn-289/${artifact}.json"
            if [ ! -s "$path" ]; then
              echo "$path không được lần chạy này sinh ra — cổng không có gì để xác nhận" >&2
              exit 1
            fi
          done
          php -r '
            $stock = json_decode(file_get_contents("build/evidence/wwhn-289/stock-invariant-proof.json"), true, 512, JSON_THROW_ON_ERROR);
            $security = json_decode(file_get_contents("build/evidence/wwhn-289/security-regression-proof.json"), true, 512, JSON_THROW_ON_ERROR);
            $problems = [];
            foreach (["retry","idempotency_conflict","rollback","negative_stock","true_concurrency","reversal","reconcile"] as $dimension) {
                if (! isset($stock[$dimension])) { $problems[] = "thieu chieu stock: $dimension"; continue; }
                if (($stock[$dimension]["verdict"] ?? null) !== "PASS") { $problems[] = "chieu stock khong PASS: $dimension"; }
            }
            foreach (["unauthorized_anonymous","unauthorized_underprivileged","rbac_matrix","data_scope","replay","rate_limit_login","rate_limit_public_pv","rate_limit_threshold_contract","secret"] as $group) {
                if (! isset($security[$group])) { $problems[] = "thieu nhom security: $group"; }
            }
            if ((int) ($stock["reconcile"]["mismatch_count"] ?? -1) !== 0) { $problems[] = "reconcile mismatch != 0"; }
            if (($stock["reconcile"]["report_status"] ?? null) !== "PASS") { $problems[] = "reconcile status != PASS"; }
            if (($stock["meta"]["driver"] ?? null) !== "pgsql") { $problems[] = "artifact khong sinh tren pgsql: ".($stock["meta"]["driver"] ?? "-"); }
            if (($stock["negative_stock"]["negative_observed"] ?? true) !== false) { $problems[] = "quan sat thay ton am"; }
            if (($stock["true_concurrency"]["lease_loser"]["error_code"] ?? null) !== "CONCURRENCY_CONFLICT") { $problems[] = "nguoi thua lease khong tra CONCURRENCY_CONFLICT"; }
            if (($security["rbac_matrix"]["cross_operation_bleed"] ?? true) !== false) { $problems[] = "ma tran RBAC co ro quyen cheo"; }
            if ($problems !== []) { fwrite(STDERR, "FAIL:\n - ".implode("\n - ", $problems)."\n"); exit(1); }
            echo "Bay chieu stock + sau nhom security deu do lan chay nay sinh ra va deu PASS\n";
          '

      - name: Verify pin / digest / supersession chain
        # Chỉ có nghĩa từ closure revision trở đi: PINS phải đã trỏ vào một run XANH có
        # thật. Bước này canh pin rot (final còn là ancestor, không ai sửa code sau final),
        # digest 5 tài liệu tĩnh, và bản ghi supersession của DEV289-P2-01.
        run: node scripts/verify-wwhn289-closure.mjs

      - name: Exact SHA evidence summary
        run: |
          set -euo pipefail
          mkdir -p artifacts/wwhn-289
          cp build/evidence/wwhn-289/stock-invariant-proof.json artifacts/wwhn-289/
          cp build/evidence/wwhn-289/security-regression-proof.json artifacts/wwhn-289/
          node scripts/verify-wwhn289-closure.mjs --json > artifacts/wwhn-289/verifier.json
          mismatch="$(php -r '$d=json_decode(file_get_contents("artifacts/wwhn-289/stock-invariant-proof.json"), true, 512, JSON_THROW_ON_ERROR); echo (int) $d["reconcile"]["mismatch_count"];')"
          cat > artifacts/wwhn-289/manifest.txt <<EOF
          jira=WWHN-289
          branch=${GITHUB_REF_NAME}
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          db=postgres16
          artifact_origin=regenerated_by_this_run
          stock_dimensions=7
          security_groups=6
          reconcile_mismatch=${mismatch}
          result=PASS
          qa1_signoff=NOT_CLAIMED_BY_DEV
          EOF
          sha256sum artifacts/wwhn-289/* > artifacts/wwhn-289/SHA256SUMS
          cat artifacts/wwhn-289/manifest.txt
          cat artifacts/wwhn-289/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: wwhn-289-exact-sha-${{ github.sha }}
          path: artifacts/wwhn-289
          if-no-files-found: error
          retention-days: 30

name: P11-P24 Backlog Integration
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: p11-p24-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    uses: ./.github/workflows/backlog-isolated-run.yml
    with:
      scope: focused
  contract:
    needs: focused
    uses: ./.github/workflows/backlog-isolated-run.yml
    with:
      scope: complete

name: HN DEVOPS CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_uat:
        description: Deploy the verified artifact to UAT
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_uat_seed:
        description: Run UAT seed after migration. Use only with approved seed policy.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      runner_labels:
        description: JSON runner labels for CI. Use ["self-hosted","Linux","X64","hoa-nam-uat"] when hosted runners are unavailable.
        required: false
        default: '["self-hosted","Linux","X64","hoa-nam-uat"]'
        type: string
      uat_runner_labels:
        description: JSON runner labels for UAT deploy. Use ["self-hosted","Linux","X64","hoa-nam-uat"] when hosted runners are unavailable.
        required: false
        default: '["self-hosted","Linux","X64","hoa-nam-uat"]'
        type: string
  push:
    branches:
      - dev
      - m1
      - main
  pull_request:
    branches:
      - dev
      - m1
      - main

# WWHN-SEC-09: workflow chạy cả trên pull_request nên GITHUB_TOKEN phải ở mức
# tối thiểu — job nào cũng chỉ cần đọc code (deploy dùng secrets riêng, không
# dùng GITHUB_TOKEN).
permissions:
  contents: read

env:
  IMAGE_NAME: hoa-nam-backend-backend
  IMAGE_TAR: hoa-nam-backend-backend.tar
  CI_APP_URL: ${{ vars.CI_APP_URL || 'http://127.0.0.1:8000' }}
  CI_DB_HOST: ${{ vars.CI_DB_HOST || '127.0.0.1' }}
  CI_DB_PORT: ${{ vars.CI_DB_PORT || '55432' }}
  CI_DB_DATABASE: ${{ vars.CI_DB_DATABASE || 'wms_hoanam' }}
  CI_DB_USERNAME: ${{ vars.CI_DB_USERNAME || 'postgres' }}
  CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
  CI_REDIS_HOST: ${{ vars.CI_REDIS_HOST || '127.0.0.1' }}
  CI_REDIS_PORT: ${{ vars.CI_REDIS_PORT || '56379' }}
  CI_SERVER_HOST: ${{ vars.CI_SERVER_HOST || '127.0.0.1' }}
  CI_SERVER_PORT: ${{ vars.CI_SERVER_PORT || '8000' }}

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ vars.CI_DB_DATABASE || 'wms_hoanam' }}
          POSTGRES_USER: ${{ vars.CI_DB_USERNAME || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: ${{ vars.CI_APP_URL || 'http://127.0.0.1:8000' }}
      DB_CONNECTION: pgsql
      DB_HOST: ${{ vars.CI_DB_HOST || '127.0.0.1' }}
      DB_PORT: ${{ vars.CI_DB_PORT || '55432' }}
      DB_DATABASE: ${{ vars.CI_DB_DATABASE || 'wms_hoanam' }}
      DB_USERNAME: ${{ vars.CI_DB_USERNAME || 'postgres' }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: ${{ vars.CI_REDIS_HOST || '127.0.0.1' }}
      REDIS_PORT: ${{ vars.CI_REDIS_PORT || '56379' }}
      L5_SWAGGER_CONST_HOST: ${{ vars.CI_APP_URL || 'http://127.0.0.1:8000' }}

    steps:
      - uses: actions/checkout@v4

      # P0 bảo mật 10/09/2026 — cổng CỨNG chặn mật khẩu đã lộ và khoá bí mật quay lại
      # repo (seeder, annotation OpenAPI, Postman, tài liệu bàn giao, script đo tải đều
      # từng chứa). Chạy trên máy runner chứ không trong container: bộ quét đọc đúng
      # danh sách `git ls-files` của bản checkout. --self-test chạy TRƯỚC để một bộ luật
      # bị sửa hỏng (không còn bắt được gì) không thể trả về PASS rỗng. Đặt đầu job để
      # đỏ sớm, trước khi tốn thời gian build image.
      - name: Setup Node for host-side gates
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Known-credential and secret scan (hard)
        run: |
          node scripts/check-known-credentials.mjs --self-test
          node scripts/check-known-credentials.mjs

      - name: Build PHP runtime image
        run: docker build -f docker/php/Dockerfile -t "$IMAGE_NAME:${GITHUB_SHA}" .

      - name: Prepare Laravel environment
        run: |
          set -euo pipefail
          # Seeder không còn mật khẩu mặc định (P0 bảo mật 10/09/2026): `db:seed` và
          # `migrate:fresh --seed` ở APP_ENV=testing BẮT BUỘC có WMS_FIXTURE_PASSWORD.
          # Sinh mới cho MỖI lần chạy, che trong log bằng ::add-mask:: trước mọi lần
          # dùng, không bao giờ in giá trị. The fixed suffix guarantees every
          # character group; no # character can be truncated by phpdotenv.
          fixture_password="$(openssl rand -hex 24)aA1!"
          test "${#fixture_password}" -eq 52
          echo "::add-mask::${fixture_password}"
          # Bước smoke dùng lại đúng giá trị này cho probe hộp đen (truyền vào container
          # bằng `-e WMS_FIXTURE_PASSWORD` — chỉ tên biến, giá trị không nằm trên dòng
          # lệnh docker).
          printf 'WMS_FIXTURE_PASSWORD=%s\n' "${fixture_password}" >> "$GITHUB_ENV"
          cp .env.example .env
          {
            echo "APP_ENV=testing"
            echo "APP_DEBUG=false"
            echo "APP_URL=$CI_APP_URL"
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=$CI_DB_PORT"
            echo "DB_DATABASE=$CI_DB_DATABASE"
            echo "DB_USERNAME=$CI_DB_USERNAME"
            echo "DB_PASSWORD=$CI_DB_PASSWORD"
            # SEC-05 để .env.example ghim DB_SSLMODE=require (an toàn cho môi
            # trường thật); postgres service của CI không bật TLS nên phải nói
            # rõ disable — nếu không libpq fail-closed đúng thiết kế và mọi
            # bước artisan chết từ migrate trở đi.
            echo "DB_SSLMODE=disable"
            echo "CACHE_STORE=redis"
            echo "QUEUE_CONNECTION=redis"
            echo "SESSION_DRIVER=redis"
            echo "REDIS_CLIENT=predis"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=$CI_REDIS_PORT"
            # Pipeline này KHÔNG dựng Reverb (không có service nào nghe :6001),
            # trong khi .env.example để BROADCAST_CONNECTION=reverb. Seeder
            # thông báo phát sự kiện realtime -> PusherBroadcaster ném
            # "cURL error 7: Failed to connect to localhost:6001" -> `db:seed`
            # thoát khác 0 -> job ci đỏ -> deploy-uat bị skip. CI không cần
            # broadcast thật; ghi ra log là đủ và vẫn chạy qua đúng code path.
            echo "BROADCAST_CONNECTION=log"
            echo "L5_SWAGGER_CONST_HOST=$CI_APP_URL"
            # WWHN-295: artifact chạy trong pipeline này phải tự khai đúng commit
            # đã build, để reviewer/QA đọc SHA từ GET /api/v1/health (data.build)
            # thay vì tin lời khai trong mô tả deploy.
            echo "APP_BUILD_SHA=$GITHUB_SHA"
            echo "APP_BUILD_REF=$GITHUB_REF_NAME"
            echo "APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Mật khẩu fixture cho `db:seed` (bước dưới) và `migrate:fresh --seed`
            # (smoke). PHPUnit không dùng giá trị này: phpunit.xml ép
            # WMS_FIXTURE_PASSWORD bằng force="true".
            printf 'WMS_FIXTURE_PASSWORD=%s\n' "${fixture_password}"
          } >> .env

      - name: Install PHP dependencies
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD:/var/www/html" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'composer install --no-interaction --prefer-dist --optimize-autoloader'

      # WWHN-SEC-09: quét advisory cho dependency PHP theo composer.lock (trước
      # đây chỉ có npm audit offline, PHP không có lớp quét nào). Bước này FAIL
      # khi còn advisory chưa xử lý — đúng vai trò cổng chặn, không chỉ báo cáo.
      - name: Composer security audit
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD:/var/www/html" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'composer audit --locked --no-interaction'

      # Cổng style theo RATCHET: mọi tệp PHP mà sự kiện này THÊM/SỬA phải sạch
      # `pint --test`. Toàn repo chưa từng sạch pint nên chạy toàn cục là chặn vô
      # hạn; ratchet giữ code mới sạch mà không đòi viết lại lịch sử. Khoảng so sánh:
      #  - pull_request: checkout là merge commit refs/pull/N/merge, cha thứ nhất là
      #    đầu nhánh đích lúc merge -> HEAD^1..HEAD đúng bằng thay đổi của PR;
      #  - push: github.event.before..github.sha (mọi commit của lần push);
      #  - push tạo nhánh mới (before = 40 số 0) hoặc workflow_dispatch: sự kiện không
      #    có khoảng thay đổi -> kiểm commit đầu (HEAD^1..HEAD; commit gốc thì so với
      #    cây rỗng).
      # Giới hạn đã biết: push/PR mang `[skip ci]` không chạy workflow nên thay đổi
      # của nó không đi qua cổng này.
      - name: PHP style gate on changed files (pint --test, ratchet)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero_sha" ]; then
            if ! git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"; then
              echo "::error::Không tải được commit before=${PUSH_BEFORE} (force-push?). Cổng không tự thu hẹp khoảng kiểm; push thêm một commit để có khoảng mới."
              exit 1
            fi
            base="$PUSH_BEFORE"
          else
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            if git rev-parse --verify --quiet "${GITHUB_SHA}^1" > /dev/null; then
              base="$(git rev-parse "${GITHUB_SHA}^1")"
            else
              base="$(git hash-object -t tree /dev/null)"
            fi
          fi
          list="${RUNNER_TEMP}/pint-changed-php-files"
          git diff --name-only -z --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.php' > "$list"
          count="$(tr -cd '\0' < "$list" | wc -c | tr -d ' ')"
          echo "Khoảng kiểm (${EVENT_NAME}): ${base}..${GITHUB_SHA} — ${count} tệp PHP thêm/sửa."
          if [ "$count" -eq 0 ]; then
            echo "Không có tệp PHP nào được thêm/sửa — không có gì để kiểm."
          else
            tr '\0' '\n' < "$list"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -v "$PWD:/var/www/html" \
              -v "$list:/tmp/pint-changed-php-files:ro" \
              --entrypoint sh \
              "$IMAGE_NAME:${GITHUB_SHA}" \
              -lc 'xargs -0 vendor/bin/pint --test < /tmp/pint-changed-php-files'
          fi

      - name: Install Node dependencies
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:22-alpine \
            sh -lc 'npm ci --ignore-scripts'

      - name: Build frontend assets
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:22-alpine \
            sh -lc 'npm run build'

      # Quét advisory THẬT cho npm (cần mạng tới registry). `npm audit --offline` cũ
      # không có dữ liệu advisory nên luôn báo 0 lỗ hổng — một cổng giả (đo 10/09/2026:
      # offline 0; online 8 high + 2 moderate). Hai ngưỡng, cả hai CỨNG:
      #  - dependency runtime (--omit=dev), chặn từ high. Repo hiện không có dependency
      #    runtime nào (newman đã về devDependencies), nên cổng này chặn việc thêm mới
      #    một package runtime mang lỗ hổng;
      #  - toàn bộ cây, gồm công cụ build/test chạy ngay trong CI, chặn critical. Chuỗi
      #    newman / openapi-to-postmanv2 -> postman-collection -> @faker-js/faker còn
      #    advisory high chưa có bản vá cùng major nên chưa chặn ở high được; thay hay
      #    bỏ bộ công cụ Postman là quyết định của chủ dự án.
      - name: npm dependency audit (online, hard)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:22-alpine \
            sh -lc 'npm audit --omit=dev --audit-level=high && npm audit --audit-level=critical'

      - name: Prepare Laravel runtime secrets
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/var/www/html" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'php artisan key:generate --force && php artisan jwt:secret --force > /dev/null'

      - name: Warranty report seed rollback and replay on disposable PostgreSQL
        env:
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$CI_DB_HOST" = 127.0.0.1 && test "$CI_DB_PORT" = 55432
          test -n "$CI_POSTGRES_SERVICE_ID"
          test "$(docker inspect -f '{{.State.Running}}' "$CI_POSTGRES_SERVICE_ID")" = true
          test "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$CI_POSTGRES_SERVICE_ID")" = 55432
          docker exec "$CI_POSTGRES_SERVICE_ID" createdb -U "$CI_DB_USERNAME" wms_warranty_seed_test
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e APP_ENV=testing -e DB_CONNECTION=pgsql -e DB_URL= \
            -e DB_HOST=127.0.0.1 -e DB_PORT=55432 -e DB_SSLMODE=disable \
            -e DB_DATABASE=wms_warranty_seed_test -e DB_USERNAME="$CI_DB_USERNAME" -e DB_PASSWORD="$CI_DB_PASSWORD" \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            -e BROADCAST_CONNECTION=null -e MAIL_MAILER=array \
            -v "$PWD:/var/www/html" --entrypoint sh "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'php artisan test tests/Feature/WarrantyReportRangeSeederTest.php --log-junit warranty-seed-pgsql.xml'

      # Nâng memory_limit qua PHP_INI_SCAN_DIR chứ KHÔNG qua `php -d`:
      # `artisan test` spawn một tiến trình con, nên `-d` của tiến trình cha không
      # truyền xuống và test đọc .xlsx chết ở 128M mặc định ("Allowed memory size
      # exhausted" trong PhpSpreadsheet — run 33975888469). Biến môi trường thì
      # tiến trình con kế thừa, nên cả hai tầng cùng có 1G.
      #
      # Vẫn giữ `artisan test` chứ không gọi thẳng vendor/bin/phpunit: thử gọi
      # thẳng thì PHPUnit 12 báo hàng loạt "did not remove its own error handlers"
      # cho các handler mà Laravel cố ý đăng ký — Collision (artisan test) cấu
      # hình khác nên không dính. Đổi runner là đổi thêm một biến, trong khi việc
      # cần sửa ở đây chỉ là giới hạn bộ nhớ.
      #
      # Cổng CỨNG cho deploy: các suite bảo mật phải xanh tuyệt đối và chạy TRƯỚC
      # suite đầy đủ, để một hồi quy bảo mật đỏ ở bước riêng, đọc được ngay:
      #  - tầng dữ liệu: SEC-05 transport (sslmode coercion + predis v3
      #    scheme/context), SEC-06 mã hoá PII;
      #  - xác thực & phiên: bootstrap SUPER_ADMIN, refresh token chỉ ở cookie
      #    HttpOnly, seed an toàn cho production (WWHN-300), hợp đồng login, phiên
      #    bền, MFA (SEC-08);
      #  - phân quyền: RBAC/audit âm tính, chống leo thang quyền, Authorization,
      #    SEC-09, bằng chứng hồi quy WWHN-289, vô hiệu hoá cache RBAC.
      # Filter NEO `\b(...)::` — chỉ khớp đúng tên class đứng ngay trước `::`; chuỗi
      # con trần "AuthorizationTest" còn kéo SkuAuthorizationTest vào cổng.
      #
      # Driver: bước này và suite đầy đủ bên dưới chạy trên SQLite in-memory, KHÔNG
      # phải service pgsql. Container test không nhận biến DB_* nào (env của job
      # không đi vào `docker run`), `artisan test` gỡ các biến nạp từ .env trước khi
      # spawn PHPUnit, và phpunit.xml đặt DB_CONNECTION=sqlite, DB_DATABASE=:memory:.
      # Hành vi riêng PostgreSQL + nhiều tiến trình PHP (khoá hàng khi xoay vòng
      # refresh token) được kiểm bằng probe runtime ở bước smoke.
      - name: Run deploy-gate tests (hard)
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/var/www/html" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'mkdir -p /tmp/phpini && echo memory_limit=1G > /tmp/phpini/zz-memory.ini && PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/tmp/phpini php artisan test --filter "\b(WwhnSec05DataTransportTest|WwhnSec06PiiEncryptionTest|WwhnSecSuperAdminBootstrapTest|WwhnSecRefreshTokenTransportTest|Wwhn300ProductionSafeSeedingTest|AuthLoginContractSecurityTest|AuthSessionPersistenceTest|SecurityRbacAuditNegativeTest|PrivilegeEscalationGuardTest|WwhnSec08MfaTest|WwhnSec09HardeningTest|AuthorizationTest|Wwhn289SecurityRegressionProofTest|RbacCacheInvalidationTest)::"'

      # Cùng các suite bảo mật, chạy lại trên PostgreSQL 16 thật. Trên pgsql `app_user`,
      # `user_role`, `role`… là VIEW của ERD, còn SQLite coi view như bảng: 10/09/2026 lỗi
      # `Schema::hasTable()` mù view làm `wms:bootstrap-super-admin` từ chối chạy trên MỌI
      # CSDL thật mà bước SQLite ở trên vẫn xanh. CSDL dùng một lần, mạng docker nội bộ,
      # không publish cổng (trust auth chỉ trong mạng đó); phpunit.pgsql.xml ép host
      # `postgres` và tên CSDL chứa "test" theo guard của TestCase.
      - name: Run security suites on PostgreSQL (hard)
        run: |
          set -euo pipefail
          net="wms-pg-sec-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create --internal "$net" > /dev/null
          trap 'docker rm -f "wms-pg-sec-${GITHUB_RUN_ID}" > /dev/null 2>&1; docker network rm "$net" > /dev/null 2>&1' EXIT
          docker run -d --name "wms-pg-sec-${GITHUB_RUN_ID}" --network "$net" --network-alias postgres \
            -e POSTGRES_DB=wms_hoanam_testing -e POSTGRES_USER=postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-alpine > /dev/null
          ready=0
          for _ in $(seq 1 60); do
            if docker exec "wms-pg-sec-${GITHUB_RUN_ID}" pg_isready -U postgres -d wms_hoanam_testing > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::PostgreSQL dùng một lần không sẵn sàng sau 60s."
            exit 1
          fi
          docker run --rm --network "$net" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/var/www/html" \
            -v "$PWD/phpunit.pgsql.xml:/var/www/html/phpunit.xml:ro" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'mkdir -p /tmp/phpini && echo memory_limit=1G > /tmp/phpini/zz-memory.ini && PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/tmp/phpini php artisan test --filter "\b(WwhnSec05DataTransportTest|WwhnSec06PiiEncryptionTest|WwhnSecSuperAdminBootstrapTest|WwhnSecRefreshTokenTransportTest|Wwhn300ProductionSafeSeedingTest|AuthLoginContractSecurityTest|AuthSessionPersistenceTest|SecurityRbacAuditNegativeTest|PrivilegeEscalationGuardTest|WwhnSec08MfaTest|WwhnSec09HardeningTest|AuthorizationTest|Wwhn289SecurityRegressionProofTest|RbacCacheInvalidationTest|IdempotencyMirrorScopeKeyRegressionTest)::"'

      # Suite đầy đủ là cổng CỨNG (quyết định chủ dự án 10/09/2026: không còn chạy
      # advisory). Mốc nền đỏ đang được sửa trên các nhánh sec/be-red-*;
      # nhánh bật cổng này merge sau cùng. Chạy trên SQLite in-memory như bước trên
      # (xem đoạn "Driver") — log CI xác nhận: các test gắn driver pgsql bị skip
      # (Wwhn198OutboundReservationRuntimeRaceTest,
      # Wwhn219PostingEventOperationLengthTest). Đỏ là chặn artifact và deploy.
      - name: Run full test suite (hard)
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/var/www/html" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'mkdir -p /tmp/phpini && echo memory_limit=1G > /tmp/phpini/zz-memory.ini && PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/tmp/phpini php artisan test'

      # The suites above own their disposable databases and do not need full
      # fixtures. Keep their hard failures ahead of expensive fourteen-day seed.
      # `db:seed` reads the per-run masked fixture secret prepared in .env.
      - name: Prepare Laravel database and OpenAPI
        env:
          HN_DAILY_COVERAGE_DAYS: "14"
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Only the PostgreSQL service created for this CI job may receive fixtures.
          test "$APP_ENV" = testing
          test "$CI_DB_HOST" = 127.0.0.1
          test "$CI_DB_PORT" = 55432
          test -n "$CI_POSTGRES_SERVICE_ID"
          test "$(docker inspect -f '{{.State.Running}}' "$CI_POSTGRES_SERVICE_ID")" = true
          test "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$CI_POSTGRES_SERVICE_ID")" = 55432
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e HN_DAILY_COVERAGE_DAYS \
            -e APP_ENV=testing -e DB_CONNECTION=pgsql -e DB_URL= \
            -e DB_HOST=127.0.0.1 -e DB_PORT=55432 \
            -e DB_DATABASE="$CI_DB_DATABASE" -e DB_USERNAME="$CI_DB_USERNAME" -e DB_PASSWORD="$CI_DB_PASSWORD" \
            -v "$PWD:/var/www/html" \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'php artisan optimize:clear && php artisan migrate --force && php artisan db:seed --force --no-interaction && php artisan db:seed --force --no-interaction && php artisan l5-swagger:generate'

      # Cổng CỨNG: seed thật xong mới bật server rồi chờ health có giới hạn —
      # bản một dòng cũ để `sleep 5 && health` chạy đua với seed 10 phút nên
      # đỏ "Connection refused" ngay lần đầu pipeline sống tới đây (run
      # 34337763564). Sau health, probe hộp đen hợp đồng refresh token
      # (scripts/sec-p1-refresh-runtime-probe.php) chạy qua HTTP thật trên pgsql
      # thật với 4 worker PHP: cookie HttpOnly, chặn CSRF/login-CSRF, xoay vòng,
      # replay thu hồi cả họ token, race refresh song song, CORS, logout thu hồi
      # token, header bảo mật. Probe exit khác 0 làm đỏ bước. Logic nằm ở
      # docker/ci/local-smoke.sh; mọi biến của probe được truyền tường minh, mật
      # khẩu fixture chỉ đi bằng tên biến (`-e WMS_FIXTURE_PASSWORD`).
      - name: Run local smoke
        # Explicit fourteen-day fixture coverage in disposable CI only, never a
        # production/default seeder policy. Keep the runtime-required guard intact.
        env:
          HN_DAILY_COVERAGE_DAYS: "14"
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Only the PostgreSQL service created for this CI job may receive fixtures.
          test "$APP_ENV" = testing
          test "$CI_DB_HOST" = 127.0.0.1
          test "$CI_DB_PORT" = 55432
          test -n "$CI_POSTGRES_SERVICE_ID"
          test "$(docker inspect -f '{{.State.Running}}' "$CI_POSTGRES_SERVICE_ID")" = true
          test "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$CI_POSTGRES_SERVICE_ID")" = 55432
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e HN_DAILY_COVERAGE_DAYS \
            -e APP_ENV=testing -e DB_CONNECTION=pgsql -e DB_URL= \
            -e DB_HOST=127.0.0.1 -e DB_PORT=55432 \
            -e DB_DATABASE="$CI_DB_DATABASE" -e DB_USERNAME="$CI_DB_USERNAME" -e DB_PASSWORD="$CI_DB_PASSWORD" \
            -v "$PWD:/var/www/html" \
            -e CI_SERVER_HOST="$CI_SERVER_HOST" \
            -e CI_SERVER_PORT="$CI_SERVER_PORT" \
            -e CI_APP_URL="$CI_APP_URL" \
            -e SEC_PROBE_ORIGIN="http://localhost:5173" \
            -e SEC_PROBE_EMAIL="warehouse-staff-01@gmail.com" \
            -e WMS_FIXTURE_PASSWORD \
            --entrypoint sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -lc 'sh docker/ci/local-smoke.sh'

      - name: Build immutable Docker artifact
        run: |
          docker save "$IMAGE_NAME:${GITHUB_SHA}" -o "$IMAGE_TAR"
          sha256sum "$IMAGE_TAR" > "$IMAGE_TAR.sha256"
          docker image inspect "$IMAGE_NAME:${GITHUB_SHA}" > image-inspect.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hn-backend-${{ github.sha }}
          path: |
            ${{ env.IMAGE_TAR }}
            ${{ env.IMAGE_TAR }}.sha256
            image-inspect.json
            storage/api-docs/api-docs.json
          retention-days: 14

  deploy-uat:
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_uat == 'true'
    runs-on: ${{ fromJSON(inputs.uat_runner_labels || vars.UAT_RUNNER_LABELS || '["ubuntu-latest"]') }}
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hn-backend-${{ github.sha }}
          path: artifact

      - name: Copy artifact to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          password: ${{ secrets.UAT_SSH_PASSWORD }}
          source: "artifact/*"
          target: "${{ vars.UAT_ARTIFACT_ROOT || '/tmp' }}/hn-${{ github.sha }}"
          strip_components: 1

      - name: Deploy exact artifact to UAT
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_UAT_SEED: ${{ inputs.run_uat_seed }}
          RELEASE_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAR: ${{ env.IMAGE_TAR }}
          UAT_APP_PATH: ${{ vars.UAT_APP_PATH || '/opt/hoa-nam-backend' }}
          UAT_ARTIFACT_ROOT: ${{ vars.UAT_ARTIFACT_ROOT || '/tmp' }}
          UAT_BACKUP_DIR: ${{ vars.UAT_BACKUP_DIR || '/tmp' }}
          UAT_DB_USERNAME: ${{ secrets.UAT_DB_USERNAME || vars.UAT_DB_USERNAME || 'wms_app' }}
          UAT_DB_DATABASE: ${{ secrets.UAT_DB_DATABASE || vars.UAT_DB_DATABASE || 'wms_hoanam' }}
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          password: ${{ secrets.UAT_SSH_PASSWORD }}
          envs: RUN_UAT_SEED,RELEASE_SHA,IMAGE_NAME,IMAGE_TAR,UAT_APP_PATH,UAT_ARTIFACT_ROOT,UAT_BACKUP_DIR,UAT_DB_USERNAME,UAT_DB_DATABASE
          script: |
            set -euo pipefail
            cd "$UAT_APP_PATH"
            ts=$(date +%Y%m%d%H%M%S)
            backup_path="${UAT_BACKUP_DIR}/wms_hoanam_predeploy_${ts}.sql"
            docker compose exec -T postgres pg_dump -U "$UAT_DB_USERNAME" -d "$UAT_DB_DATABASE" --clean --if-exists > "$backup_path"
            sha256sum "$backup_path" > "${backup_path}.sha256"
            cd "${UAT_ARTIFACT_ROOT}/hn-${RELEASE_SHA}"
            sha256sum -c "${IMAGE_TAR}.sha256"
            docker load -i "${IMAGE_TAR}"
            docker tag "${IMAGE_NAME}:${RELEASE_SHA}" "${IMAGE_NAME}:uat-${RELEASE_SHA}"
            docker tag "${IMAGE_NAME}:${RELEASE_SHA}" "${IMAGE_NAME}:latest"
            cd "$UAT_APP_PATH"
            docker compose up -d postgres valkey minio mailpit minio-init nginx
            # queue + scheduler PHẢI được kéo lên cùng backend: export báo cáo
            # (GenerateReportExportJob) đi qua Redis queue, không có worker thì
            # job PENDING vĩnh viễn — đúng hiện tượng UAT TC_FUNC_03/04/06/07/08
            # ("Xuất XLSX/PDF tạo job 200 nhưng download_url mãi null").
            # scheduler chạy schedule:work cho purge export/error-file hằng ngày.
            docker compose up -d --no-build backend queue scheduler nginx
            # Artisan phải chạy bằng `www-data` — đúng user mà php-fpm phục vụ
            # request. Chạy bằng root thì bootstrap/cache/*.php và
            # storage/logs/laravel.log vừa sinh ra là root:root, php-fpm mất
            # quyền ghi và login trả 500 (Monolog UnexpectedValueException).
            # Entrypoint đã chuẩn hoá quyền lúc container khởi động; ràng buộc
            # này chặn nốt đường tái phát từ chính script deploy.
            docker compose exec -T -u www-data backend php artisan optimize:clear
            docker compose exec -T -u www-data backend php artisan migrate --force
            if [ "${RUN_UAT_SEED}" = "true" ]; then
              docker compose exec -T -u www-data backend php artisan db:seed --force
            fi
            # Rebuild config/route/event cache against the code+config that
            # was just deployed. Without this the app re-parses .env and
            # re-registers every route on every request (measurable overhead
            # under load); optimize:clear above only ever wiped the cache,
            # nothing rebuilt it afterwards. Failure here aborts the script
            # (set -euo pipefail) before the restart below, so a bad cache
            # build never reaches traffic -- the previous containers keep
            # serving until this is fixed and re-run.
            docker compose exec -T -u www-data backend php artisan optimize
            # Restart cả queue/scheduler để worker nạp đúng code + config cache
            # vừa build (worker giữ tiến trình PHP sống lâu, không tự thấy code mới).
            docker compose restart backend queue scheduler nginx
            # Chốt acceptance quyền ghi runtime: storage/logs/laravel.log và
            # bootstrap/cache phải thuộc www-data sau khi container khởi động
            # lại. Nếu một lệnh root nào đó lỡ chiếm ownership thì deploy đỏ ở
            # đây, thay vì để người dùng phát hiện bằng login 500.
            docker compose exec -T backend sh -lc 'stat -c "%U:%G %a %n" storage/logs/laravel.log bootstrap/cache && [ "$(stat -c %U storage/logs/laravel.log)" = www-data ] && [ "$(stat -c %U bootstrap/cache)" = www-data ]'

      - name: UAT smoke
        env:
          UAT_APP_URL: ${{ vars.UAT_APP_URL || secrets.UAT_APP_URL }}
          # Đăng nhập chỉ nhận email từ 07/09/2026. UAT_SMOKE_USERNAME là tên secret
          # cũ, chỉ còn là đường lùi khi chưa tạo UAT_SMOKE_EMAIL — giá trị của nó cũng
          # phải là email.
          UAT_SMOKE_EMAIL: ${{ secrets.UAT_SMOKE_EMAIL || secrets.UAT_SMOKE_USERNAME }}
          UAT_SMOKE_PASSWORD: ${{ secrets.UAT_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail "$UAT_APP_URL/api/v1/health"

          case "$UAT_SMOKE_EMAIL" in
            ?*@?*) ;;
            *)
              echo "::error::UAT_SMOKE_EMAIL (hoặc secret cũ UAT_SMOKE_USERNAME) phải là email: đăng nhập chỉ nhận email từ 07/09/2026."
              exit 1
              ;;
          esac
          if [ -z "$UAT_SMOKE_PASSWORD" ]; then
            echo "::error::Thiếu secret UAT_SMOKE_PASSWORD."
            exit 1
          fi

          # Body đăng nhập dựng bằng `jq -n --arg` (không nội suy chuỗi: dấu " hay \
          # trong mật khẩu không phá được JSON) và đi vào curl qua stdin, không nằm
          # trên dòng lệnh. Response (chứa access token) và header Authorization chỉ
          # nằm trong thư mục tạm quyền 700 của runner, xoá khi bước kết thúc; không
          # in body hay token ra log.
          umask 077
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/uat-smoke.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          login_status() {
            jq -n --arg email "$UAT_SMOKE_EMAIL" --arg password "$UAT_SMOKE_PASSWORD" \
              '{email: $email, password: $password}' |
              curl -sS -o "$work/login-body.json" -w '%{http_code}' \
                -X POST "$UAT_APP_URL/api/v1/auth/login" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                --data-binary @-
          }

          # Login smoke chạy HAI LẦN liên tiếp: lần đầu có thể là lần tạo
          # storage/logs/laravel.log, chỉ lần hai mới lộ ownership sai (file
          # root:root do lệnh artisan chạy bằng root -> Monolog
          # UnexpectedValueException -> 500). Chỉ kiểm HTTP 200 + success=true.
          for attempt in 1 2; do
            status="$(login_status)"
            if [ "$status" != "200" ] || [ "$(jq -r '.success' "$work/login-body.json")" != "true" ]; then
              echo "::error::login smoke lan ${attempt} that bai: HTTP ${status} error_code=$(jq -r '.error.code // .error_code // "?"' "$work/login-body.json")"
              exit 1
            fi
          done

          token="$(jq -r '.data.access_token // empty' "$work/login-body.json")"
          rm -f "$work/login-body.json"
          if [ -z "$token" ]; then
            echo "::error::login smoke: HTTP 200 nhưng response không có data.access_token."
            exit 1
          fi
          echo "::add-mask::${token}"
          printf 'Authorization: Bearer %s\n' "$token" > "$work/auth-header"

          curl --fail -sS -o /dev/null -H @"$work/auth-header" "$UAT_APP_URL/api/v1/warehouses?keyword=KHO-TONG-HN"

      - name: Purge Cloudflare cache for staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          UAT_APP_URL: ${{ vars.UAT_APP_URL || secrets.UAT_APP_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ZONE_ID"
          host="${UAT_APP_URL#*://}"
          host="${host%%/*}"
          payload="$(printf '{"hosts":["%s"]}' "$host")"
          curl --fail -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload"

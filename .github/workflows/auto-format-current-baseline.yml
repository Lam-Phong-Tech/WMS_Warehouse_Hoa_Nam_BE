name: Auto-format current baseline migrations

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/auto-format-current-baseline.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout m1
        uses: actions/checkout@v4
        with:
          ref: m1
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format baseline files with Pint
        shell: bash
        run: |
          set -euo pipefail
          ./vendor/bin/pint \
            Modules/Warehouse/database/migrations/2026_08_10_000660_finalize_current_baseline_contract.php \
            Modules/Warehouse/database/migrations/2026_08_10_000665_backfill_legacy_container_physical_code_targets.php \
            Modules/Warehouse/database/migrations/2026_08_10_000670_align_identity_container_and_scan_lifecycle.php \
            Modules/Warehouse/database/migrations/2026_08_10_000680_align_putaway_and_container_compatibility.php \
            Modules/Warehouse/database/migrations/2026_08_10_000690_complete_component_issue_storage_contract.php \
            Modules/Warehouse/database/migrations/2026_08_10_000710_enforce_cross_aggregate_business_guards.php \
            Modules/Warehouse/database/migrations/2026_08_10_000720_enforce_all_documented_quantities_bigint.php \
            Modules/Warehouse/database/migrations/2026_08_10_000740_verify_mutable_aggregate_version_contract.php \
            Modules/Warehouse/database/migrations/2026_08_10_000750_materialize_erd_1_0_physical_objects.php \
            Modules/Warehouse/database/migrations/2026_08_10_000760_align_erd_1_0_fields_types_and_data.php \
            Modules/Warehouse/database/migrations/2026_08_10_0007695_prepare_all_canonical_erd_keys.php \
            Modules/Warehouse/database/migrations/2026_08_10_000770_enforce_erd_1_0_keys_relationships_and_constraints.php \
            Modules/Warehouse/database/migrations/2026_08_10_000772_promote_documented_canonical_primary_keys.php \
            Modules/Warehouse/app/Http/Controllers/Concerns/InteractsWithStockDocuments.php

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Modules/Warehouse/database/migrations Modules/Warehouse/app/Http/Controllers/Concerns/InteractsWithStockDocuments.php
          git commit -m 'style(baseline): format exact-SHA contract files'
          git push origin HEAD:m1

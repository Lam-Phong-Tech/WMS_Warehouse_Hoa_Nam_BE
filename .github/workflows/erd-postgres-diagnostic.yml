name: Hoa Nam ERD PostgreSQL Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoanam_erd_diag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoanam_erd_diag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_WRITE_POLICY: outbox_required
      CI_DEMO_PASSWORD: Baseline-CI-Only-2026
      WWHN180_PASSWORD: Baseline-CI-Only-2026
      WWHN180_NO_PERMISSION_PASSWORD: Baseline-CI-Only-2026
      JWT_SECRET: Baseline-CI-JWT-Only-2026-Exact-SHA
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: hoanam_erd_diag
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, bcmath
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: PostgreSQL migrate fresh and seed with exact annotation
        shell: bash
        run: |
          set -o pipefail
          if php artisan migrate:fresh --seed --force 2>&1 | tee /tmp/erd-pg-migrate.log; then
            exit 0
          fi
          msg="$(tail -n 140 /tmp/erd-pg-migrate.log)"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          msg="${msg//$'\r'/'%0D'}"
          echo "::error title=PostgreSQL migrate fresh seed failed::$msg"
          exit 1
      - name: PostgreSQL strict ERD contracts with exact annotation
        shell: bash
        run: |
          set -o pipefail
          if php artisan test --filter '/(DocumentationBaselineContractTest|CurrentBaselineFlowContractSourceTest|ErdPhysicalSchemaParityTest|ErdRuntimeMirrorParityTest|ErdBusinessInvariantParityTest|ErdCompilerSourcePinTest|StockDocumentCanonicalFlowTest|StockDocumentIdempotencyTest|StockDocumentConcurrencyGuardTest|SwaggerRouteSyncTest|LatestErdBaselineSchemaTest)/' 2>&1 | tee /tmp/erd-pg-tests.log; then
            php artisan l5-swagger:generate
            exit 0
          fi
          msg="$(tail -n 240 /tmp/erd-pg-tests.log)"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          msg="${msg//$'\r'/'%0D'}"
          echo "::error title=PostgreSQL strict ERD contracts failed::$msg"
          exit 1

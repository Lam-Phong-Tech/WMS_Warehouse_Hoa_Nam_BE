name: P12 Documents Read Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'tests/Feature/P12*Test.php'
      - 'tests/Unit/P12*Test.php'
      - 'tests/Feature/P04InboundContractTest.php'
      - 'tests/Feature/P05OutboundContractTest.php'
      - 'tests/Feature/P23ReadContractTest.php'
      - 'docs/contracts/p12-read-v2.json'
      - 'composer.lock'
      - '.github/workflows/p12-documents-contract.yml'
permissions:
  contents: read
concurrency:
  group: p12-documents-read-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p12-disposable-ci-only
          POSTGRES_DB: p12_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p12_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p12-disposable-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p12-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify handoff ancestry and source identity
        run: |
          git merge-base --is-ancestor 4113826a7179a1d54ff2231c88a8cd3477279aa8 HEAD
          git rev-parse HEAD
          sha256sum composer.lock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p12-composer.log 2>&1 || { tail -60 /tmp/p12-composer.log; exit 1; }
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Style and syntax check P12 integration files
        run: |
          vendor/bin/pint --test -v Modules/Warehouse/app/Support/P12DocumentReadContract.php Modules/Warehouse/app/Support/P12DocumentPresentation.php Modules/Warehouse/app/Http/Middleware/P12DocumentReadMetadata.php Modules/Warehouse/app/Providers/RouteServiceProvider.php Modules/Warehouse/app/Http/Controllers/MiniAppInboundController.php Modules/Warehouse/app/Http/Controllers/MiniAppOutboundController.php Modules/Warehouse/app/Http/Controllers/P04InboundController.php Modules/Warehouse/app/Http/Controllers/DocumentAttachmentController.php tests/Feature/P04InboundContractTest.php tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P12ReadRevision2Test.php tests/Unit/P12DocumentPresentationTest.php
          find Modules/Warehouse tests -name '*P12*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite P12 and owner P04 P05 and P09-P23 read regressions
        if: success() || failure()
        run: |
          php artisan test tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P12ReadRevision2Test.php tests/Unit/P12DocumentPresentationTest.php tests/Feature/P04InboundContractTest.php tests/Feature/P05OutboundContractTest.php tests/Feature/P23ReadContractTest.php --log-junit p12-sqlite.xml
      - name: PostgreSQL P12 and owner P04 P05 and P09-P23 read regressions
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p12_contract_test
        run: |
          php artisan test tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P12ReadRevision2Test.php tests/Unit/P12DocumentPresentationTest.php tests/Feature/P04InboundContractTest.php tests/Feature/P05OutboundContractTest.php tests/Feature/P23ReadContractTest.php --log-junit p12-pgsql.xml
      - name: Cached route P12 regressions in disposable SQLite
        if: success() || failure()
        run: |
          trap 'php artisan route:clear' EXIT
          php artisan route:cache
          php artisan test tests/Feature/P12ReadRevision2Test.php --log-junit p12-route-cache.xml
      - name: Composer locked dependency audit
        if: success() || failure()
        run: composer audit --locked --no-interaction
      - name: Publish isolated test counts and source hashes without artifact quota dependency
        if: always()
        run: |
          echo "P12_ISOLATED_SOURCE=$GITHUB_SHA; no deployment or live approval"
          sha256sum composer.lock Modules/Warehouse/app/Support/P12DocumentReadContract.php Modules/Warehouse/app/Support/P12DocumentPresentation.php Modules/Warehouse/app/Http/Middleware/P12DocumentReadMetadata.php tests/Feature/P12ReadRevision2Test.php
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('p12-*.xml'):
              if not path.stat().st_size: continue
              root = ET.parse(path).getroot()
              for suite in root.findall('./testsuite'): print('P12_SUITE '+path.name+' '+str(suite.attrib))
              for tag in ['failure', 'error']:
                  for node in root.iter(tag): print('P12_ISOLATED_TEST_FAILURE '+(node.text or '')[:6000])
          PY
  security_lock_candidate:
    # Single-use candidate preparation, reviewed before a separate branch update.
    # This job never updates refs or commits; its only write is an unreferenced blob.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/dev' && startsWith(github.event.head_commit.message, 'ci(p12): prepare a bounded audited dependency lock candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p12-disposable-ci-only
          POSTGRES_DB: p12_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p12_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p12-disposable-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p12-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Assert exact reviewed parent before any dependency change
        run: test "$(git rev-parse HEAD^)" = '5a18f391798ff556492c11a6902bbe506c7a5f22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Resolve only the three affected packages at patched versions
        run: |
          cp composer.lock /tmp/p12-before.lock
          composer update laravel/framework:13.30.0 league/commonmark:2.10.2 league/flysystem:3.35.3 --with-all-dependencies --minimal-changes --no-scripts --no-interaction --no-progress
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          old=json.loads(Path('/tmp/p12-before.lock').read_text())
          new=json.loads(Path('composer.lock').read_text())
          def packages(lock): return {p['name']:p for group in ['packages','packages-dev'] for p in lock[group]}
          before=packages(old); after=packages(new)
          changed={k for k in set(before)|set(after) if before.get(k)!=after.get(k)}
          expected={'laravel/framework':'v13.30.0','league/commonmark':'2.10.2','league/flysystem':'3.35.3'}
          assert changed==set(expected), f'Unexpected dependency change set: {sorted(changed)}'
          assert old['content-hash']==new['content-hash'], 'Root dependency manifest changed'
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['composer.lock']
          for name, version in expected.items():
              assert after[name]['version'].lstrip('v')==version.lstrip('v')
              print('P12_PATCH_PACKAGE '+name+' '+before[name]['version']+' -> '+after[name]['version'])
          PY
      - name: Audit the candidate lock without suppressing findings
        run: composer audit --locked --no-interaction
      - name: Prepare disposable test application only
        run: |
          cp .env.example .env
          php artisan package:discover
          php artisan key:generate
          php artisan config:clear
      - name: SQLite candidate regressions
        run: php artisan test tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P12ReadRevision2Test.php tests/Unit/P12DocumentPresentationTest.php tests/Feature/P04InboundContractTest.php tests/Feature/P05OutboundContractTest.php tests/Feature/P23ReadContractTest.php
      - name: PostgreSQL candidate regressions
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p12_contract_test
        run: php artisan test tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P12ReadRevision2Test.php tests/Unit/P12DocumentPresentationTest.php tests/Feature/P04InboundContractTest.php tests/Feature/P05OutboundContractTest.php tests/Feature/P23ReadContractTest.php
      - name: Publish verified lock blob only, not a commit or ref update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_BE'
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['composer.lock']
          raw=Path('composer.lock').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          req=urllib.request.Request(url, data=json.dumps({'encoding':'utf-8','content':raw.decode()}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req, timeout=30) as response: result=json.load(response)
          assert result['sha']==blob
          print('P12_VERIFIED_LOCK_BLOB='+blob)
          print('P12_VERIFIED_LOCK_SHA256='+hashlib.sha256(raw).hexdigest())
          print('P12_CANDIDATE_TESTED_SOURCE='+os.environ['GITHUB_SHA'])
          PY

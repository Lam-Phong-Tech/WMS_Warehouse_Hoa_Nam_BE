name: P12 Documents Read Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'tests/Feature/P12*Test.php'
      - '.ci/p12-*.py'
      - '.github/workflows/p12-documents-contract.yml'
permissions:
  contents: write
concurrency:
  group: p12-documents-guarded-repair
  cancel-in-progress: false
jobs:
  contract:
    if: ${{ !contains(github.event.head_commit.message, '[p12-verified]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p12-disposable-ci-only
          POSTGRES_DB: p12_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p12_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p12-disposable-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p12-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Apply exact-blob guarded P12 fixes
        run: python3 .ci/p12-complete-read-contract.py
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p12-composer.log 2>&1 || { tail -60 /tmp/p12-composer.log; exit 1; }
      - name: Format and syntax check only changed PHP files
        run: |
          vendor/bin/pint Modules/Warehouse/app/Support/P12DocumentReadContract.php Modules/Warehouse/app/Http/Controllers/MiniAppInboundController.php Modules/Warehouse/app/Http/Controllers/MiniAppOutboundController.php Modules/Warehouse/app/Http/Controllers/P04InboundController.php Modules/Warehouse/app/Http/Controllers/DocumentAttachmentController.php tests/Feature/P04InboundContractTest.php tests/Feature/P12DocumentsReadContractTest.php
          for file in Modules/Warehouse/app/Support/P12DocumentReadContract.php Modules/Warehouse/app/Http/Controllers/{MiniAppInboundController,MiniAppOutboundController,P04InboundController,DocumentAttachmentController}.php tests/Feature/{P04InboundContractTest,P12DocumentsReadContractTest}.php; do php -l "$file"; done
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P12 and owner P04 P05 regressions
        run: php artisan test tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P04InboundContractTest.php tests/Feature/P05OutboundContractTest.php --log-junit p12-sqlite.xml
      - name: PostgreSQL P12 and owner P04 P05 regressions
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p12_contract_test
        run: php artisan test tests/Feature/P12DocumentsReadContractTest.php tests/Feature/P04InboundContractTest.php tests/Feature/P05OutboundContractTest.php --log-junit p12-pgsql.xml
      - name: Publish counts and sanitized isolated failures to logs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('p12-*.xml'):
              if not path.stat().st_size: continue
              root = ET.parse(path).getroot()
              print('P12_TEST_COUNTS '+path.name+' '+str(root.attrib))
              for suite in root.findall('./testsuite'): print('P12_SUITE '+str(suite.attrib))
              for tag in ['failure', 'error']:
                  for node in root.iter(tag): print('P12_TEST_FAILURE '+(node.text or '')[:6000])
          PY
      - name: Push verified changes without overwriting concurrent dev work
        if: success()
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'dev moved; refuse to overwrite. Rebase after review.'; exit 1; }
          git add Modules/Warehouse/app/Support/P12DocumentReadContract.php Modules/Warehouse/app/Http/Controllers/MiniAppInboundController.php Modules/Warehouse/app/Http/Controllers/MiniAppOutboundController.php Modules/Warehouse/app/Http/Controllers/P04InboundController.php Modules/Warehouse/app/Http/Controllers/DocumentAttachmentController.php tests/Feature/P04InboundContractTest.php tests/Feature/P12DocumentsReadContractTest.php
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p12): verified document reads and GLOBAL suppliers [p12-verified]'
          git push origin HEAD:dev
          echo "P12_VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"

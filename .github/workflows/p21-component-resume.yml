name: P21 Component Resume Contract
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-isolated-p21
          POSTGRES_DB: p21_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p21_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'p21_contract_test' }}
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-isolated-p21
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Guard exact SHA and disposable database
        run: |
          test "$APP_ENV" = testing && test "$DB_HOST" = 127.0.0.1 && test -z "$DB_URL"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$DB_DATABASE" in ':memory:'|p21_contract_test) ;; *) exit 1 ;; esac
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          c=json.load(open('contracts/p21/component-resume-v1.json'))
          assert c['production_activation'] is False and c['new_routes']==[] and c['new_migrations']==[]
          assert all(r['method']=='GET' for r in c['read_requests'])
          PY
      - name: Prepare isolated runtime from locked dependencies
        id: runtime
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress > /tmp/p21-install.log 2>&1 || { tail -40 /tmp/p21-install.log; exit 1; }
          php artisan key:generate
          php artisan config:clear
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = Illuminate\Support\Facades\DB::connection();
          $isolated = $db->getDriverName() === 'sqlite' ? $db->getDatabaseName() === ':memory:'
              : $db->getDriverName() === 'pgsql' && $db->getDatabaseName() === 'p21_contract_test' && $db->getConfig('host') === '127.0.0.1';
          if (! $app->environment('testing') || ! $isolated || getenv('DB_URL') !== '') {
              fwrite(STDERR, 'Non-isolated database rejected.'); exit(1);
          }
          echo 'Disposable database verified; no live seed, Post or credentials.'.PHP_EOL;
          PHP
      - name: Syntax and style
        run: |
          paths=(Modules/Warehouse/app/Services/P21ComponentResume.php Modules/Warehouse/app/Http/Middleware/P21ResumeRead.php Modules/Warehouse/routes/p03_drafts.php tests/Feature/P21ComponentResumeTest.php)
          for path in "${paths[@]}"; do php -l "$path"; done
          vendor/bin/pint --test "${paths[@]}"
      - name: Owner timestamp and null semantics
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          config(['app.timezone' => 'Asia/Ho_Chi_Minh']);
          $service = new Modules\Warehouse\Services\P21ComponentResume;
          $method = new ReflectionMethod($service, 'instant');
          $cases = [
              [null, null],
              ['2026-10-10 08:30:00', '2026-10-10T01:30:00.000000Z'],
              ['2026-10-10T01:30:00.123456Z', '2026-10-10T01:30:00.123456Z'],
              ['2026-10-10T08:30:00+07:00', '2026-10-10T01:30:00.000000Z'],
          ];
          foreach ($cases as [$input, $expected]) {
              if ($method->invoke($service, $input) !== $expected) {
                  throw new RuntimeException('P21 timestamp normalization failed.');
              }
          }
          echo 'P21_TIME_CASES=4 PASS; no database write or live request.'.PHP_EOL;
          PHP
      - name: P21 and unchanged P03 P19 P20 owner regressions
        if: success() || (failure() && steps.runtime.outcome == 'success')
        run: |
          files=(tests/Feature/P21ComponentResumeTest.php tests/Feature/P03DraftContractTest.php tests/Feature/P03DraftJsonShapeTest.php tests/Feature/P19LinkedComponentIssueTest.php tests/Feature/P20ComponentHistoryTest.php tests/Feature/WarrantyWarehouseScopeTest.php)
          for path in "${files[@]}"; do test -f "$path"; done
          php artisan test "${files[@]}" --log-junit p21-${{ matrix.database }}.xml
      - name: Route cached P21 regression
        if: success()
        run: |
          php artisan route:cache
          php artisan test tests/Feature/P21ComponentResumeTest.php --log-junit p21-cached-${{ matrix.database }}.xml
          php artisan route:clear
      - name: Exact test counts and retained source hashes
        if: always()
        run: |
          python3 - <<'PY'
          import os,json,pathlib,hashlib,xml.etree.ElementTree as E
          good=True
          for prefix in ['p21-', 'p21-cached-']:
              p=pathlib.Path(prefix+os.environ['DB_CONNECTION']+'.xml')
              if not p.exists(): print('Missing report '+p.name); good=False; continue
              root=E.parse(p).getroot(); cases=list(root.iter('testcase'))
              counts={'tests':len(cases),'assertions':sum(int(c.get('assertions','0')) for c in cases),**{k:len(list(root.iter(k))) for k in ['failure','error','skipped']}}
              own=sum('P21ComponentResumeTest' in (c.get('class','')+c.get('classname','')) for c in cases)
              report={'sha':os.environ['GITHUB_SHA'],'database':os.environ['DB_CONNECTION'],'suite':prefix,'p21_tests':own,'counts':counts,'report_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'live_verified':False,'full_release_verified':False}
              print(json.dumps(report,sort_keys=True))
              for c in cases:
                  for e in c:
                      if e.tag in ['failure','error']: print(c.get('name','')+'\n'+(e.text or '')[:3000])
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
              good=good and own>=15 and not any(counts[k] for k in ['failure','error','skipped'])
          if not good: raise SystemExit('Missing or failed P21 evidence')
          PY
      - name: Tests do not rewrite source
        if: success()
        run: git diff --exit-code

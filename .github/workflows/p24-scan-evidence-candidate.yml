name: P24 Exact Scan Evidence Candidate
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/p24-scan-evidence-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p24-candidate-disposable
          POSTGRES_DB: p24_candidate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p24_candidate"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p24-candidate-disposable
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p24-candidate-test-only-not-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
      P19_COMMAND_RECOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Assert the exact reviewed source
        run: |
          test "$(git rev-parse HEAD^)" = '31f1d238079b343a14b434ca7efaf999db53d6de'
          test "$(git diff HEAD^ HEAD --name-only)" = '.github/workflows/p24-scan-evidence-candidate.yml'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Apply four reviewed exact edits in the disposable workspace only
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('Modules/Warehouse/app')
          controller = root/'Http/Controllers/CurrentBaselineComponentFlowController.php'
          service = root/'Services/P19ComponentCommand.php'
          tests = Path('tests/Feature/P24ScannerOwnerContractTest.php')
          contract = Path('docs/contracts/p24-scanner-owner-v1.json')
          def replace(path, old, new):
              text = path.read_text()
              assert text.count(old) == 1, f'Non-unique reviewed edit in {path}: {old[:80]}'
              path.write_text(text.replace(old, new))
          replace(controller,
              "            DB::table('component_issue_items')->insert([\n                'id' => (string) Str::uuid(),",
              "            $scanEntryId = (string) Str::uuid();\n            DB::table('component_issue_items')->insert([\n                'id' => $scanEntryId,")
          replace(controller,
              "                'line_id' => (string) $line->id,\n                'scan_event_id' => $scanEventId,",
              "                'line_id' => (string) $line->id,\n                'scan_entry_id' => $scanEntryId,\n                'scan_event_id' => $scanEventId,")
          replace(service,
              "            $eventId = data_get($body, 'data.scan_event_id');\n            if (! is_string($eventId) || ! Str::isUuid($eventId)",
              "            $entryId = data_get($body, 'data.scan_entry_id');\n            $eventId = data_get($body, 'data.scan_event_id');\n            // The inserted canonical entry is mandatory; a missing event remains null.\n            if (! is_string($entryId) || ! Str::isUuid($entryId)\n                || ($eventId !== null && (! is_string($eventId) || ! Str::isUuid($eventId)))")
          replace(service,
              "                ->where('i.scan_event_id', $eventId)->where('i.status', 'ACTIVE')->limit(2)",
              "                ->where('i.id', $entryId)->where('i.status', 'ACTIVE')->limit(2)")
          replace(service,
              "            if ($entries->count() !== 1 || $entry->quantity === null || (int) $entry->quantity !== (int) $command['quantity']",
              "            if ($entries->count() !== 1 || $entry->scan_event_id !== $eventId\n                || $entry->quantity === null || (int) $entry->quantity !== (int) $command['quantity']")
          replace(service,
              "            $result['scan']['quantity'] = (int) $entry->quantity;",
              "            $result['scan']['quantity'] = (int) $entry->quantity;\n            $result['scan']['id_source'] = 'component_issue_items.id';\n            $result['scan']['event_status'] = $eventId === null ? 'NOT_RECORDED' : 'SOURCE_EVENT';")
          replace(service,
              "            // The opt-in scanner contract requires real input for a unique owner\n            // scan_event. Never identify a new scan via an older NULL event row.",
              "            // The opt-in scanner contract requires real input and the exact inserted\n            // entry ID. Never identify a new scan via an older NULL event row.")
          replace(tests,
              "        $this->assertTrue(Str::isUuid($a->json('data.receipt.result.scan.scan_event_id')));\n        $this->assertTrue(Str::isUuid($b->json('data.receipt.result.scan.scan_event_id')));",
              "        $this->assertTrue(Str::isUuid($a->json('data.receipt.result.scan.id')));\n        $this->assertTrue(Str::isUuid($b->json('data.receipt.result.scan.id')));\n        foreach ([$a, $b] as $response) {\n            $scan = $response->json('data.receipt.result.scan');\n            $stored = DB::table('component_issue_items')->where('id', $scan['id'])->first();\n            $this->assertSame($stored->scan_event_id, $scan['scan_event_id']);\n            $this->assertSame($scan['scan_event_id'] === null ? 'NOT_RECORDED' : 'SOURCE_EVENT', $scan['event_status']);\n            $this->assertSame('component_issue_items.id', $scan['id_source']);\n        }")
          replace(tests,
              "        $this->assertNotSame($a->json('data.receipt.result.scan.scan_event_id'), $b->json('data.receipt.result.scan.scan_event_id'));",
              "        $this->assertSame(1, (int) DB::table('component_issue_items')->where('id', $a->json('data.receipt.result.scan.id'))->value('quantity'));\n        $this->assertSame(2, (int) DB::table('component_issue_items')->where('id', $b->json('data.receipt.result.scan.id'))->value('quantity'));")
          data = json.loads(contract.read_text())
          data['p19_commands']['scan_evidence'] = ('The canonical SCAN response adds scan_entry_id: the UUID of the entry inserted by that operation. The receipt verifies this exact entry against parent, line, quantity, target and nullable scan_event_id. An event ID is never synthesized. result.scan.id_source is component_issue_items.id; event_status is NOT_RECORDED when the owner has no event, otherwise SOURCE_EVENT. Missing or mismatched entry identity rolls back the write and stays UNKNOWN; an older NULL-event row is never used as proof. This does not fabricate raw-code/timeline evidence for P20.')
          contract.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          paths = sorted(str(p) for p in [controller, service, tests, contract])
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == paths
          Path('/tmp/p24-candidate-paths.json').write_text(json.dumps(paths))
          PY
      - name: Install locked dependencies and prepare isolated application
        run: |
          composer install --no-interaction --prefer-dist --no-progress > /tmp/p24-install.log 2>&1 || { tail -50 /tmp/p24-install.log; exit 1; }
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php -l Modules/Warehouse/app/Http/Controllers/CurrentBaselineComponentFlowController.php
          php -l Modules/Warehouse/app/Services/P19ComponentCommand.php
      - name: SQLite exact-entry and canonical-owner tests
        run: php artisan test tests/Feature/P24ScannerOwnerContractTest.php tests/Feature/MiniAppComponentIssueStagingTest.php tests/Feature/ComponentIssueCompositeQrScanTest.php --log-junit p24-candidate-sqlite.xml
      - name: PostgreSQL exact-entry and canonical-owner tests
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p24_candidate
        run: php artisan test tests/Feature/P24ScannerOwnerContractTest.php tests/Feature/MiniAppComponentIssueStagingTest.php tests/Feature/ComponentIssueCompositeQrScanTest.php --log-junit p24-candidate-pgsql.xml
      - name: Locked dependency audit
        run: composer audit --locked --no-interaction
      - name: Publish verified blobs only; never update commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          paths = json.loads(Path('/tmp/p24-candidate-paths.json').read_text())
          assert os.environ['GITHUB_REPOSITORY'] == 'Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_BE'
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == paths
          for path in paths:
              raw = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',
                  data=json.dumps({'encoding':'utf-8','content':raw.decode()}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response: result = json.load(response)
              assert result['sha'] == expected
              print('P24_VERIFIED_BLOB '+path+' '+expected+' SHA256='+hashlib.sha256(raw).hexdigest())
          print('P24_CANDIDATE_SOURCE='+os.environ['GITHUB_SHA']+'; no branch update or deployment')
          PY

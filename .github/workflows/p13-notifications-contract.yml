name: P13 Notifications Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Notification/**'
      - 'Modules/Auth/**'
      - 'tests/Feature/P13*Test.php'
      - '.github/workflows/p13-notifications-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p13-disposable-ci-only
          POSTGRES_DB: p13_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p13_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p13-disposable-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p13-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P13 contract
        run: php artisan test tests/Feature/P13NotificationContractTest.php --log-junit p13-sqlite.xml
      - name: PostgreSQL P13 contract
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p13_contract_test
        run: php artisan test tests/Feature/P13NotificationContractTest.php --log-junit p13-pgsql.xml
      - name: P13 style check
        if: success() || failure()
        run: vendor/bin/pint --test Modules/Notification/app/Http/Controllers/NotificationController.php Modules/Notification/app/Support/P13NotificationCursor.php tests/Feature/P13NotificationContractTest.php
      - name: Publish required CI evidence to log and job summary
        if: always()
        run: |
          python3 - <<'PY_REPORT'
          from pathlib import Path
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          lines = ['## P13 isolated contract evidence',
                   'Build: `' + os.environ['GITHUB_SHA'] + '`',
                   'LIVE_DEV_SMOKE=false; DEPLOYMENT=false',
                   'Required evidence: this log and job summary. XML download is an optional copy.']
          missing = []
          for filename in ['p13-sqlite.xml', 'p13-pgsql.xml']:
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  missing.append(filename)
                  lines.append('MISSING REPORT: ' + filename)
                  continue
              content = path.read_bytes()
              root = ET.fromstring(content)
              suites = [root] if root.tag == 'testsuite' else root.findall('./testsuite')
              cases = list(root.iter('testcase'))
              if not suites or not cases:
                  missing.append(filename + ': empty test report')
              lines.append('### ' + filename)
              lines.append('SHA256: `' + hashlib.sha256(content).hexdigest() + '`')
              for suite in suites:
                  counts = {key: suite.get(key, '0') for key in ['tests', 'assertions', 'errors', 'failures', 'skipped']}
                  lines.append(json.dumps(counts, sort_keys=True))
              for case in cases:
                  status = 'PASS'
                  for tag in ['failure', 'error', 'skipped']:
                      if case.find(tag) is not None:
                          status = tag.upper()
                          break
                  lines.append(status + ' ' + case.get('classname', '') + '::' + case.get('name', ''))
          report = '\n\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(report)
          if missing:
              raise SystemExit('Required CI evidence missing: ' + ', '.join(missing))
          PY_REPORT
      - name: Optional XML artifact copy
        id: xml_artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: p13-contract-${{ github.sha }}
          path: p13-*.xml
          if-no-files-found: error
          retention-days: 7
      - name: Report artifact availability separately
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.xml_artifact.outcome }}
        run: |
          echo "XML_ARTIFACT_OUTCOME=$ARTIFACT_OUTCOME"
          echo "XML artifact copy: **$ARTIFACT_OUTCOME**. Test/style gates are independent; see required evidence above." >> "$GITHUB_STEP_SUMMARY"
          if [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "::warning::XML artifact copy unavailable; inspect the upload error. Required counts and per-test results remain in the log and job summary."
          fi

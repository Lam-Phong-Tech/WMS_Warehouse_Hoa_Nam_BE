name: P13 Notifications Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Notification/**'
      - 'Modules/Auth/**'
      - 'tests/Feature/P13*Test.php'
      - '.github/workflows/p13-notifications-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p13-disposable-ci-only
          POSTGRES_DB: p13_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p13_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p13-disposable-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p13-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P13 contract
        run: php artisan test tests/Feature/P13NotificationContractTest.php --log-junit p13-sqlite.xml
      - name: PostgreSQL P13 contract
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p13_contract_test
        run: php artisan test tests/Feature/P13NotificationContractTest.php --log-junit p13-pgsql.xml
      - name: P13 style check
        if: success() || failure()
        run: vendor/bin/pint --test Modules/Notification/app/Http/Controllers/NotificationController.php Modules/Notification/app/Support/P13NotificationCursor.php tests/Feature/P13NotificationContractTest.php
      - name: Report isolated counts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          print('P13_BUILD_SHA=' + os.environ['GITHUB_SHA'])
          print('LIVE_DEV_SMOKE=false; DEPLOYMENT=false')
          for path in sorted(Path('.').glob('p13-*.xml')):
              root = ET.parse(path).getroot()
              for suite in root.findall('./testsuite'):
                  print(path.name, suite.attrib)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13-contract-${{ github.sha }}
          path: p13-*.xml
          retention-days: 7

name: Warranty Warehouse Contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect warranty ownership integration points
        run: |
          python3 - <<'PY'
          import pathlib, re
          roots = [pathlib.Path('Modules/Warehouse'), pathlib.Path('app')]
          for root in roots:
              for p in sorted(root.rglob('*.php')):
                  if '/Database/Seeders/' in str(p):
                      continue
                  lines = p.read_text().splitlines()
                  hits = [i for i,l in enumerate(lines) if re.search(r"(?:DB::table\(['\"]warranty_case|warranty-cases|temp-only|function (?:tempOnly|createWarrantyCase|warrantyDefects|summary|casePayload|caseEnvelope)|warranty_case.*(?:warehouse|where)|warranty.*pending)", l)]
                  if not hits:
                      continue
                  print('\nFILE', p)
                  shown = set()
                  for i in hits:
                      for j in range(max(0, i-3), min(len(lines), i+12)):
                          if j not in shown:
                              print(f'{j+1}: {lines[j]}')
                              shown.add(j)
          print('\nSCHEMA')
          for p in sorted(pathlib.Path('database/migrations').glob('*.php')):
              if 'warranty' in p.name or 'mini_app_work_shift' in p.name:
                  print(p)
                  if 'mini_app_work_shift' in p.name:
                      print(p.read_text())
          print('\nTEST_FILES')
          print('\n'.join(str(p) for p in pathlib.Path('tests').rglob('*Warranty*')))
          for name in ['tests/Feature/P02ReadContractTest.php', '.github/workflows/mini-app-work-shifts.yml']:
              print('\nFULL', name)
              print(pathlib.Path(name).read_text())
          PY

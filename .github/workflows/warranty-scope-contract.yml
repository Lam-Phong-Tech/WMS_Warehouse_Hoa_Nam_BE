name: Warranty Warehouse Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/warranty-scope-contract.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect warranty ownership integration points
        run: |
          python3 - <<'PY'
          import pathlib, re
          for root in [pathlib.Path('Modules/Warehouse'), pathlib.Path('app')]:
              for p in sorted(root.rglob('*.php')):
                  if '/Database/Seeders/' in str(p):
                      continue
                  lines = p.read_text().splitlines()
                  hits = [i for i,l in enumerate(lines) if re.search(r"(?:DB::table\(['\"]warranty_case|warranty-cases|temp-only|function (?:tempOnly|createWarrantyCase|warrantyDefects|summary|casePayload|caseEnvelope))", l)]
                  if not hits:
                      continue
                  print('\nFILE', p)
                  shown = set()
                  for i in hits:
                      for j in range(max(0, i-2), min(len(lines), i+8)):
                          if j not in shown:
                              print(f'{j+1}: {lines[j]}')
                              shown.add(j)
          for name in ['tests/Feature/P02ReadContractTest.php', '.github/workflows/mini-app-work-shifts.yml']:
              print('\nFULL', name)
              print(pathlib.Path(name).read_text())
          print('\nTEST_FILES')
          print('\n'.join(str(p) for p in pathlib.Path('tests').rglob('*Warranty*')))
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Package source for isolated review
        run: |
          git archive HEAD -o source.tar
          tar --append --file=source.tar vendor
          gzip source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: warranty-scope-review-source
          path: source.tar.gz
          retention-days: 1

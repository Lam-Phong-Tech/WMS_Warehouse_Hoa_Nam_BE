name: Seed P08 P10 safety regression
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/seed-p08-p10-blockers.yml']
permissions:
  contents: write
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-isolated-blockers
          POSTGRES_DB: p08_p10_seed_regression_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p08_p10_seed_regression_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'p08_p10_seed_regression_test' }}
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-isolated-blockers
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
      CANDIDATE_SHA: 5b4fac122987ca5f5b2b76e601e2c4976e8c923c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Guard disposable database and prepare runtime
        run: |
          test "$APP_ENV" = testing && test "$DB_HOST" = 127.0.0.1 && test -z "$DB_URL"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          case "$DB_DATABASE" in ':memory:'|p08_p10_seed_regression_test) ;; *) exit 1 ;; esac
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress > /tmp/blockers-install.log 2>&1 || { tail -40 /tmp/blockers-install.log; exit 1; }
          php artisan key:generate
          php artisan config:clear
          sudo apt-get update -qq > /tmp/blockers-apt.log 2>&1
          sudo apt-get install -y nginx >> /tmp/blockers-apt.log 2>&1
      - name: Reproduce old source failures on synthetic isolated rows
        run: |
          set +e
          php artisan test tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php --filter='retirement_preserves_two|document_records_summary' --log-junit baseline-${{ matrix.database }}.xml > /tmp/blockers-baseline.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import os,xml.etree.ElementTree as E
          root=E.parse('baseline-'+os.environ['DB_CONNECTION']+'.xml').getroot()
          cases=list(root.iter('testcase'))
          for c in cases:
              print('BASELINE '+c.get('name',''))
              for e in list(c):
                  if e.tag in ['failure','error']: print((e.text or '')[:3000])
          assert len(cases)==2 and len(list(root.iter('failure')))==2 and not list(root.iter('error')), 'Baseline must reproduce the two assertion failures, not a broken fixture'
          PY
      - name: Construct reviewed candidate changes
        run: |
          python3 scripts/apply-seed-p08-p10-candidate.py
          vendor/bin/pint Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php database/seeders/DatabaseSeeder.php Modules/Warehouse/app/Support/P08HistoryReadModel.php tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php
          php -l Modules/Auth/app/Http/Controllers/P10ProfileController.php
          vendor/bin/pint --test Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php database/seeders/DatabaseSeeder.php Modules/Warehouse/app/Support/P08HistoryReadModel.php tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Modules/Auth/app/Http/Controllers/P10ProfileController.php').read_text()
          p=s[s.index('private function profile('):s.index('private function passwordTime(')]
          assert 'private, no-store, no-transform' in p
          PY
      - name: Candidate application and existing owner regressions
        run: php artisan test tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php tests/Feature/P08HistoryContractTest.php tests/Unit/P08HistoryReadContractTest.php tests/Feature/P10ProfileContractTest.php tests/Feature/P10Revision2MetadataTest.php tests/Unit/DockerNginxBackendUnavailableTest.php --log-junit blockers-${{ matrix.database }}.xml
      - name: Real nginx compression regression on both templates
        run: python3 scripts/test-p10-nginx-etag.py
      - name: Print exact candidate and outcome counts
        if: always()
        run: |
          python3 - <<'PY'
          import os,json,pathlib,xml.etree.ElementTree as E
          p=pathlib.Path('blockers-'+os.environ['DB_CONNECTION']+'.xml')
          if not p.exists(): raise SystemExit('Missing test evidence')
          root=E.parse(p).getroot(); cases=list(root.iter('testcase'))
          counts={'tests':len(cases),'assertions':sum(int(x.get('assertions','0')) for x in cases),**{k:len(list(root.iter(k))) for k in ['failure','error','skipped']}}
          report={'candidate_sha':os.environ['CANDIDATE_SHA'],'workflow_sha':os.environ['GITHUB_SHA'],'database':os.environ['DB_CONNECTION'],'counts':counts,'live_verified':False,'full_seed_run':False}
          print(json.dumps(report,sort_keys=True))
          for c in cases:
              for e in list(c):
                  if e.tag in ['failure','error']: print(c.get('name','')+'\n'+(e.text or '')[:4000])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
          if not cases or any(counts[k] for k in ['failure','error','skipped']): raise SystemExit('Test failure')
          PY
      - name: Publish verified source tree without updating any branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; assert repo=='Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_BE'
          paths=['Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php','database/seeders/DatabaseSeeder.php','Modules/Warehouse/app/Support/P08HistoryReadModel.php','Modules/Auth/app/Http/Controllers/P10ProfileController.php','docker/nginx/default.conf.template','docker/nginx/perf/default.conf.template','tests/Feature/CatalogRetirementSafetyTest.php','tests/Feature/P08DocumentHistoryTest.php','scripts/test-p10-nginx-etag.py']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<=set(paths), changed
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          nodes=[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in paths]
          nodes.append({'path':'scripts/apply-seed-p08-p10-candidate.py','mode':'100644','type':'blob','sha':None})
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees',data=json.dumps({'base_tree':base,'tree':nodes}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r: tree=json.load(r)['sha']
          print('VERIFIED_BLOCKERS_TREE='+tree)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Verified tree: `'+tree+'`; no branch/ref changed.\n')
          PY

name: Seed P08 P10 safety regression
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php'
      - 'database/seeders/DatabaseSeeder.php'
      - 'Modules/Warehouse/app/Support/P08HistoryReadModel.php'
      - 'Modules/Warehouse/app/Http/Controllers/P08HistoryController.php'
      - 'Modules/Auth/app/Http/Controllers/P10ProfileController.php'
      - 'docker/nginx/**'
      - 'tests/Feature/CatalogRetirementSafetyTest.php'
      - 'tests/Feature/P08DocumentHistoryTest.php'
      - 'tests/Feature/P08HistoryContractTest.php'
      - 'tests/Feature/P10*Test.php'
      - 'scripts/test-p10-nginx-etag.py'
      - '.github/workflows/seed-p08-p10-blockers.yml'
  pull_request:
    paths:
      - 'Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php'
      - 'database/seeders/DatabaseSeeder.php'
      - 'Modules/Warehouse/app/Support/P08HistoryReadModel.php'
      - 'Modules/Warehouse/app/Http/Controllers/P08HistoryController.php'
      - 'Modules/Auth/app/Http/Controllers/P10ProfileController.php'
      - 'docker/nginx/**'
      - 'tests/Feature/CatalogRetirementSafetyTest.php'
      - 'tests/Feature/P08DocumentHistoryTest.php'
      - 'tests/Feature/P08HistoryContractTest.php'
      - 'tests/Feature/P10*Test.php'
      - 'scripts/test-p10-nginx-etag.py'
      - '.github/workflows/seed-p08-p10-blockers.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-isolated-blockers
          POSTGRES_DB: p08_p10_seed_regression_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p08_p10_seed_regression_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'p08_p10_seed_regression_test' }}
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-isolated-blockers
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Prepare exact-commit disposable runtime
        run: |
          test "$APP_ENV" = testing && test "$DB_HOST" = 127.0.0.1 && test -z "$DB_URL"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$DB_DATABASE" in ':memory:'|p08_p10_seed_regression_test) ;; *) exit 1 ;; esac
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress > /tmp/blockers-install.log 2>&1 || { tail -40 /tmp/blockers-install.log; exit 1; }
          php artisan key:generate
          php artisan config:clear
          sudo apt-get update -qq > /tmp/blockers-apt.log 2>&1
          sudo apt-get install -y nginx >> /tmp/blockers-apt.log 2>&1
      - name: Verify resolved connection before any test database writes
        run: |
          php <<'PHP'
          <?php
          try {
              require 'vendor/autoload.php';
              $app = require 'bootstrap/app.php';
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $db = Illuminate\Support\Facades\DB::connection();
              $driver = $db->getDriverName();
              $isolated = $driver === 'sqlite'
                  ? $db->getDatabaseName() === ':memory:'
                  : $driver === 'pgsql' && $db->getDatabaseName() === 'p08_p10_seed_regression_test'
                      && $db->getConfig('host') === '127.0.0.1';
              if (! $app->environment('testing') || ! $isolated || getenv('DB_URL') !== '') {
                  throw new RuntimeException('Non-isolated target rejected');
              }
              echo 'Verified disposable '.$driver.' target; no live seed authorized.'.PHP_EOL;
          } catch (Throwable $e) {
              fwrite(STDERR, 'Isolation check failed; no database test may run.'.PHP_EOL);
              exit(1);
          }
          PHP
      - name: Syntax and scoped PHP style
        run: |
          for path in Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php database/seeders/DatabaseSeeder.php Modules/Warehouse/app/Support/P08HistoryReadModel.php Modules/Auth/app/Http/Controllers/P10ProfileController.php tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php; do php -l "$path"; done
          vendor/bin/pint --test Modules/Warehouse/database/seeders/RetireDemoCatalogSeeder.php database/seeders/DatabaseSeeder.php Modules/Warehouse/app/Support/P08HistoryReadModel.php tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php
          python3 - <<'PY'
          from pathlib import Path
          text=Path('Modules/Auth/app/Http/Controllers/P10ProfileController.php').read_text()
          profile=text[text.index('private function profile('):text.index('private function passwordTime(')]
          assert 'private, no-store, no-transform' in profile
          PY
      - name: Exact source owner and data-preservation regressions
        run: |
          php artisan test tests/Feature/CatalogRetirementSafetyTest.php tests/Feature/P08DocumentHistoryTest.php tests/Feature/P08HistoryContractTest.php tests/Unit/P08HistoryReadContractTest.php tests/Feature/P10ProfileContractTest.php tests/Feature/P10Revision2MetadataTest.php tests/Unit/DockerNginxBackendUnavailableTest.php --log-junit blockers-${{ matrix.database }}.xml
      - name: Real nginx compression regression on both templates
        run: python3 scripts/test-p10-nginx-etag.py
      - name: Publish redacted exact-commit test counts
        if: always()
        run: |
          python3 - <<'PY'
          import os,json,pathlib,xml.etree.ElementTree as E
          path=pathlib.Path('blockers-'+os.environ['DB_CONNECTION']+'.xml')
          if not path.is_file(): raise SystemExit('Missing test evidence')
          root=E.parse(path).getroot(); cases=list(root.iter('testcase'))
          counts={'tests':len(cases),'assertions':sum(int(c.get('assertions','0')) for c in cases),**{k:len(list(root.iter(k))) for k in ['failure','error','skipped']}}
          report={'sha':os.environ['GITHUB_SHA'],'database':os.environ['DB_CONNECTION'],'counts':counts,'catalog_preservation_tested':True,'live_verified':False,'full_seed_run':False,'deployment_authorized':False}
          print(json.dumps(report,sort_keys=True))
          for c in cases:
              for e in list(c):
                  if e.tag in ['failure','error']: print(c.get('name','')+'\n'+(e.text or '')[:3000])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
          if len(cases)<38 or any(counts[k] for k in ['failure','error','skipped']): raise SystemExit('Regression failed or cases missing')
          PY
      - name: Assert verification did not rewrite source
        run: git diff --exit-code

name: P19 Linked Component Issue
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-isolated-p19
          POSTGRES_DB: p19_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p19_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'p19_contract_test' }}
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-isolated-p19
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Verify isolated database and mask signing material
        run: |
          python3 - <<'PY'
          import os, subprocess, json
          assert os.environ['APP_ENV']=='testing' and os.environ['DB_HOST']=='127.0.0.1' and os.environ['DB_URL']==''
          assert os.environ['DB_DATABASE'] in [':memory:', 'p19_contract_test']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          contract=json.load(open('contracts/p19/component-issue-linked-v1.json'))
          assert contract['production_activation'] is False and contract['new_routes']==[] and contract['new_migrations']==[]
          PY
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress > /tmp/p19-install.log 2>&1 || { tail -60 /tmp/p19-install.log; exit 1; }
          php artisan key:generate
          php artisan config:clear
      - name: Syntax and style
        run: |
          php -l Modules/Warehouse/app/Services/P19LinkedComponentIssue.php
          php -l Modules/Warehouse/app/Http/Middleware/MiniAppDraftHandoff.php
          php -l tests/Feature/P19LinkedComponentIssueTest.php
          php -l tests/Feature/MiniAppComponentIssueStagingTest.php
          vendor/bin/pint --test Modules/Warehouse/app/Services/P19LinkedComponentIssue.php Modules/Warehouse/app/Http/Middleware/MiniAppDraftHandoff.php tests/Feature/P19LinkedComponentIssueTest.php tests/Feature/MiniAppComponentIssueStagingTest.php
      - name: P19 and owner regressions
        if: success() || failure()
        run: php artisan test tests/Feature/P19LinkedComponentIssueTest.php tests/Feature/MiniAppComponentIssueStagingTest.php tests/Feature/P03DraftContractTest.php tests/Feature/P03DraftJsonShapeTest.php tests/Feature/WarrantyWarehouseScopeTest.php tests/Feature/AuthWarehouseContextTest.php --log-junit p19-${{ matrix.database }}.xml
      - name: Publish exact SHA and test outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import os, json, pathlib, hashlib, xml.etree.ElementTree as E
          path=pathlib.Path('p19-'+os.environ['DB_CONNECTION']+'.xml')
          if not path.is_file(): raise SystemExit('Missing P19 test evidence')
          root=E.parse(path).getroot(); cases=list(root.iter('testcase'))
          counts={'tests':len(cases),'assertions':sum(int(x.get('assertions','0')) for x in cases),**{k:len(list(root.iter(k))) for k in ['failure','error','skipped']}}
          own=sum('P19LinkedComponentIssueTest' in (x.get('class','')+x.get('classname','')) for x in cases)
          report={'sha':os.environ['GITHUB_SHA'],'database':os.environ['DB_CONNECTION'],'counts':counts,'p19_tests':own,'report_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'live_verified':False,'production_activation':False}
          print(json.dumps(report,sort_keys=True))
          for case in cases:
              failure=case.find('failure'); error=case.find('error')
              if failure is not None or error is not None:
                  print('FAILED_CASE '+case.get('name',''))
                  element=failure if failure is not None else error
                  text=(element.text or '')[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title=P19 assertion::'+text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
          if own!=16 or any(counts[k] for k in ['failure','error','skipped']): raise SystemExit('P19 or owner regressions failed')
          PY

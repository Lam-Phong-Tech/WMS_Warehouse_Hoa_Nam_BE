name: WWHN-273 Backend Release Sign-off

on:
  push:
    branches: [m1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-release-signoff:
    name: Exact-SHA migration/rollback/health/auth/RBAC/OpenAPI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoanam_wwhn273
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoanam_wwhn273"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: hoanam_wwhn273
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: WWHN273-CI-JWT-Exact-SHA-2026
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
      REFRESH_TOKEN_COOKIE_SAME_SITE: lax
      # The runtime identity this gate signs off is the checked-out commit, so
      # the readiness check reads it from configuration instead of trusting a
      # deploy description. Trusted proxies are pinned here so the check is
      # deterministic on the runner and not dependent on .env.example drift.
      TRUSTED_PROXIES: 127.0.0.1,::1
      APP_BUILD_SHA: ${{ github.sha }}
      APP_BUILD_REF: ${{ github.ref }}
      SMOKE_HOST: 127.0.0.1
      SMOKE_PORT: '8000'
      # Ephemeral credential for the CI-only seeded database, same class as the
      # JWT secret above. The seeded admin identity is asserted by
      # BackendMigrationSeedHealthTest, so the release smoke can log in as it.
      CI_DEMO_PASSWORD: WWHN273-CI-Demo-Login-2026
      SMOKE_LOGIN_EMAIL: admin@gmail.com

    steps:
      - name: Checkout exact m1 SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, bcmath
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Guard release workflow branch and canonical health route
        run: |
          set -euo pipefail
          workflow='.github/workflows/hn-devops-ci-cd.yml'
          grep -Fq -- '- m1' "$workflow"
          grep -Fq '/api/v1/health' "$workflow"
          if grep -Fq '/api/health' "$workflow"; then
            echo 'Legacy /api/health is forbidden in the release workflow.' >&2
            exit 1
          fi
          grep -Fq "Route::get('health'" routes/api.php

      - name: Prepare Laravel runtime
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          mkdir -p artifacts/wwhn-273

      - name: Migration and seed exact-SHA gate
        run: php artisan migrate:fresh --seed --force

      # WWHN-72 asks for a rehearsed rollback, so the backend half of that
      # rehearsal runs here: unwind the whole chain the deploy just applied,
      # roll forward again and re-seed. This catches a migration whose down()
      # leaves the schema unusable, and it is also what catches an ERD-document
      # edit that silently changes what the ERD-driven migrations build, because
      # HoaNamErdSchema::parse() reads docs/HoaNam_ERD_Moi_Nhat.md at migration
      # runtime.
      - name: Rollback drill and forward re-migration
        run: |
          set -euo pipefail
          php artisan migrate:reset --force
          php artisan migrate --force
          php artisan db:seed --force

      - name: Backend GoLive readiness check
        run: php artisan wms:golive-check --json=artifacts/wwhn-273/golive-check.json

      - name: Focused release regression suite
        run: |
          php artisan test \
            tests/Feature/BackendMigrationSeedHealthTest.php \
            tests/Feature/AuthSessionPersistenceTest.php \
            tests/Feature/AuthorizationTest.php \
            tests/Feature/SwaggerRouteSyncTest.php \
            tests/Feature/Wwhn273ReleaseSignoffContractTest.php

      # phpunit proves the health contract in-process. Beta/UAT polls it over
      # HTTP, so the release gate also proves the served runtime: the canonical
      # probe answers, the legacy unversioned probe does not exist, a protected
      # endpoint still fails closed without a token, and the auth/master/inbound/
      # outbound/inventory smoke WWHN-72 asks for actually returns 200 against
      # the migrated and seeded database.
      - name: Served runtime smoke (canonical health, legacy 404, default deny)
        run: |
          set -euo pipefail
          php artisan serve --host="$SMOKE_HOST" --port="$SMOKE_PORT" > artifacts/wwhn-273/serve.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://$SMOKE_HOST:$SMOKE_PORT/api/v1/health" > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://$SMOKE_HOST:$SMOKE_PORT/api/v1/health" | tee artifacts/wwhn-273/health.json
          grep -Fq '"status":"ok"' artifacts/wwhn-273/health.json
          legacy_code="$(curl -s -o /dev/null -w '%{http_code}' "http://$SMOKE_HOST:$SMOKE_PORT/api/health")"
          if [ "$legacy_code" != '404' ]; then
            echo "Legacy /api/health must not be served, got HTTP $legacy_code" >&2
            exit 1
          fi
          protected_code="$(curl -s -o /dev/null -w '%{http_code}' "http://$SMOKE_HOST:$SMOKE_PORT/api/v1/skus")"
          if [ "$protected_code" != '401' ]; then
            echo "Protected /api/v1/skus must fail closed with 401, got HTTP $protected_code" >&2
            exit 1
          fi
          printf 'legacy_health_http=%s\nprotected_no_token_http=%s\n' "$legacy_code" "$protected_code" > artifacts/wwhn-273/served-smoke.txt
          token="$(curl -s -X POST "http://$SMOKE_HOST:$SMOKE_PORT/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_LOGIN_EMAIL\",\"password\":\"$CI_DEMO_PASSWORD\"}" \
            | php -r 'echo json_decode(stream_get_contents(STDIN), true)["data"]["access_token"] ?? "";')"
          if [ -z "$token" ]; then
            echo 'Release smoke failed: /api/v1/auth/login returned no access token' >&2
            exit 1
          fi
          echo 'auth_login=200' >> artifacts/wwhn-273/served-smoke.txt
          for path in /api/v1/skus /api/v1/inbound-documents /api/v1/outbound-documents /api/v1/inventory/balances /api/v1/reports/hub; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "http://$SMOKE_HOST:$SMOKE_PORT$path")"
            if [ "$code" != '200' ]; then
              echo "Release smoke failed: GET $path returned HTTP $code" >&2
              exit 1
            fi
            printf 'smoke%s=%s\n' "$path" "$code" >> artifacts/wwhn-273/served-smoke.txt
          done
          cat artifacts/wwhn-273/served-smoke.txt

      - name: Regenerate OpenAPI
        run: php artisan l5-swagger:generate

      - name: Build exact-SHA evidence manifest
        run: |
          set -euo pipefail
          mkdir -p artifacts/wwhn-273
          openapi_sha256="$(sha256sum storage/api-docs/api-docs.json | awk '{print $1}')"
          golive_overall="$(php -r 'echo json_decode(file_get_contents("artifacts/wwhn-273/golive-check.json"), true)["overall"] ?? "unknown";')"
          cat > artifacts/wwhn-273/release-signoff.txt <<EOF
          jira=WWHN-273
          parent=WWHN-72
          branch=${GITHUB_REF_NAME}
          sha=${GITHUB_SHA}
          db=postgres16
          migrate_fresh_seed=PASS
          rollback_drill=migrate:reset+migrate+db:seed:PASS
          golive_check=${golive_overall}
          health=/api/v1/health
          legacy_health=/api/health:REJECTED
          served_smoke=health200+legacy404+protected401+auth_master_inbound_outbound_inventory200
          openapi_sha256=${openapi_sha256}
          result=SOURCE_CONTROLLED_PASS_IF_JOB_GREEN
          qa1_signoff=NOT_CLAIMED_BY_BE
          devops_deploy_backup_rollback=NOT_CLAIMED_BY_BE
          EOF
          sha256sum artifacts/wwhn-273/release-signoff.txt > artifacts/wwhn-273/SHA256SUMS
          cat artifacts/wwhn-273/release-signoff.txt

      - name: Upload WWHN-273 backend release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-273-backend-release-signoff-${{ github.sha }}
          path: artifacts/wwhn-273
          if-no-files-found: error
          retention-days: 30

      - name: Truth-boundary summary
        if: always()
        run: |
          echo '### WWHN-273 backend release sign-off' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Coverage: PostgreSQL migration/seed, rollback drill (reset + re-migrate + re-seed), GoLive readiness check, served /api/v1/health, cookie session, authorization and Swagger route sync.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Boundary: backend source-controlled evidence only; QA1 and DevOps deployment/backup/rollback remain independent role-owned gates.' >> "$GITHUB_STEP_SUMMARY"

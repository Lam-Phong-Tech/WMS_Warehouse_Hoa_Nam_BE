name: Fix Global Migration Builtins Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite invalid global built-in imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Modules/Warehouse/database/migrations')
          changed = []
          for path in sorted(root.glob('*.php')):
              text = path.read_text()
              original = text
              text = text.replace('use RuntimeException;\n', '')
              text = text.replace('use Throwable;\n', '')
              text = text.replace('new RuntimeException(', 'new \\RuntimeException(')
              text = text.replace('catch (Throwable ', 'catch (\\Throwable ')
              text = text.replace('catch (Throwable)', 'catch (\\Throwable)')
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
          git diff --check
      - name: Commit rewritten migrations
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No invalid built-in imports remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Modules/Warehouse/database/migrations
          git commit -m 'fix: qualify built-in exceptions in global migrations'
          git push origin HEAD:m1

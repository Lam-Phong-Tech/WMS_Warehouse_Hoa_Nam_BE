name: P06 Read-only Catalog Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'Modules/Auth/**'
      - 'tests/Feature/P06*Test.php'
      - 'tests/Feature/P05OutboundContractTest.php'
      - 'tests/Feature/P03Draft*Test.php'
      - 'tests/Feature/P04*Test.php'
      - 'tests/Feature/AuthWarehouseContextTest.php'
      - 'tests/Feature/WarrantyWarehouseScopeTest.php'
      - '.github/workflows/p06-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p06-disposable-ci-only
          POSTGRES_DB: p06_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p06_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p06-disposable-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p06-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p06-composer.log 2>&1 || { tail -60 /tmp/p06-composer.log; exit 1; }
      - name: P06 syntax validation
        run: |
          php -l Modules/Warehouse/app/Http/Controllers/P06CatalogController.php
          php -l Modules/Warehouse/app/Support/P06CatalogReadModel.php
          php -l Modules/Warehouse/app/Support/P06ReadSnapshot.php
          php -l Modules/Warehouse/routes/p06_catalog.php
          php -l tests/Feature/P06CatalogContractTest.php
          php -l tests/Feature/P06SnapshotTransactionTest.php
          php -l tests/Feature/WarrantyWarehouseScopeTest.php
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P06 and related regressions
        run: php artisan test tests/Feature/P06*Test.php tests/Feature/P05OutboundContractTest.php tests/Feature/P03Draft*Test.php tests/Feature/P04*Test.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/WarrantyWarehouseScopeTest.php --log-junit p06-sqlite.xml
      - name: PostgreSQL P06 and related regressions
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p06_contract_test
        run: php artisan test tests/Feature/P06*Test.php tests/Feature/P05OutboundContractTest.php tests/Feature/P03Draft*Test.php tests/Feature/P04*Test.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/WarrantyWarehouseScopeTest.php --log-junit p06-pgsql.xml
      - name: Read-only P06 style check
        if: success() || failure()
        run: vendor/bin/pint --test Modules/Warehouse/app/Http/Controllers/P06CatalogController.php Modules/Warehouse/app/Support/P06CatalogReadModel.php Modules/Warehouse/app/Support/P06ReadSnapshot.php Modules/Warehouse/routes/p06_catalog.php tests/Feature/P06CatalogContractTest.php tests/Feature/P06SnapshotTransactionTest.php
      - name: Publish isolated test evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').glob('p06-*.xml'):
              if not p.stat().st_size: continue
              root = ET.parse(p).getroot()
              print('::notice title=P06 counts::'+p.name+' '+str([s.attrib for s in root.findall('./testsuite')]))
              for tag in ['failure', 'error']:
                  for e in root.iter(tag):
                      msg = (e.text or '')[:3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error title=P06 '+p.name+'::'+msg)
          PY

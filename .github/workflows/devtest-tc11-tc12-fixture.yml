name: DEVTEST TC11 TC12 fixture and live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-and-smoke:
    runs-on: [self-hosted, Linux, X64, hoa-nam-uat]
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: devtest-tc11-tc12-source
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact DEV/TEST fixture target
        env:
          HOST: ${{ secrets.UAT_SSH_HOST }}
        shell: bash
        run: test "$HOST" = 42.96.16.197
      - name: Create only the fixed TEST fixture in green DEV/TEST
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPS_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          password: ${{ secrets.UAT_SSH_PASSWORD }}
          envs: OPS_SHA
          command_timeout: 5m
          script: |
            set -eu
            source=/opt/actions-runner/hoa-nam-vps42/_work/WMS_Warehouse_Hoa_Nam_BE/WMS_Warehouse_Hoa_Nam_BE/devtest-tc11-tc12-source
            owner=$(stat -c %U "$source/.git")
            test "$owner" != UNKNOWN
            test "$(runuser -u "$owner" -- git -C "$source" rev-parse HEAD)" = "$OPS_SHA"
            test "$(readlink -f /opt/hoa-nam-green/current)" = /opt/hoa-nam-green/releases/184bd43d95804a0c6f42d47ca64dfa39db40d9ae-timeline-*
            docker exec -i -u www-data -e TC_FIXTURE_CONFIRM=DEVTEST-TC11-TC12-20261025 hoa_nam_green-backend-1 php < "$source/tools/deploy/tc11-tc12-fixture.php"
      - name: Authenticated TC11 resolve and TC12 source/detail smoke
        env:
          SMOKE_EMAIL: ${{ secrets.UAT_SMOKE_EMAIL || 'admin@gmail.com' }}
          SMOKE_PASSWORD: ${{ secrets.UAT_SMOKE_PASSWORD }}
        shell: bash
        run: node devtest-tc11-tc12-source/tools/deploy/tc11-tc12-live-smoke.mjs
      - name: Publish redacted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc11-tc12-live-smoke-${{ github.run_id }}
          path: tc11-tc12-live-evidence.json
          if-no-files-found: error
          retention-days: 14

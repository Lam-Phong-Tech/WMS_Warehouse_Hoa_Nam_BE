name: P18 Owner Attachment Receipts
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'Modules/Auth/**'
      - 'app/Support/*AttachmentScanner.php'
      - 'contracts/p18/**'
      - 'database/migrations/**'
      - 'tests/Feature/P18*Test.php'
      - 'tests/Feature/DocumentAttachmentTest.php'
      - 'tests/Feature/WarrantyFlow04ApiSurfaceTest.php'
      - 'tests/Feature/Concerns/PreparesOutboundFixtures.php'
      - 'tests/Feature/P15OwnerReadContractTest.php'
      - 'tests/Feature/P17ScanExceptionReservationTest.php'
      - 'tests/Feature/AuthWarehouseContextTest.php'
      - 'tests/Feature/AuthSessionPersistenceTest.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/p18-owner-attachments.yml'
permissions:
  contents: read
jobs:
  contract:
    name: Upload receipts (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p18-isolated-ci-only
          POSTGRES_DB: p18_upload_receipt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p18_upload_receipt_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'p18_upload_receipt_test' }}
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: p18-isolated-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=30000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p18-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Verify isolated target and contract gates before application boot
        run: |
          python3 - <<'PY'
          import json, os
          assert os.environ['APP_ENV'] == 'testing'
          assert os.environ['DB_HOST'] == '127.0.0.1' and os.environ['DB_URL'] == ''
          assert (os.environ['DB_CONNECTION'], os.environ['DB_DATABASE']) in [('sqlite', ':memory:'), ('pgsql', 'p18_upload_receipt_test')]
          contract = json.load(open('contracts/p18/owner-attachments-v1.json'))
          assert contract['production_activation'] is False and contract['live_verified'] is False
          assert contract['cancel_supported'] is False
          assert contract['handover']['structured_fields'] == 'PENDING_BA'
          assert contract['location']['breakdown'] == 'NOT_TRACKED'
          PY
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p18-composer.log 2>&1 || { tail -60 /tmp/p18-composer.log; exit 1; }
      - name: PHP syntax and read-only style gate
        run: |
          python3 - <<'PY'
          import subprocess
          paths = ['Modules/Warehouse/app/Providers/RouteServiceProvider.php', 'Modules/Warehouse/app/Http/Controllers/DocumentAttachmentController.php', 'Modules/Warehouse/app/Http/Controllers/CurrentBaselineWarrantyAttachmentController.php', 'Modules/Warehouse/app/Services/AttachmentUploadReceipts.php', 'Modules/Warehouse/routes/attachment_upload_receipts.php', 'database/migrations/2026_10_09_180000_create_attachment_upload_requests.php', 'tests/Feature/P18UploadReceiptTest.php', 'tests/Feature/Concerns/PreparesOutboundFixtures.php', 'tests/Feature/WarrantyFlow04ApiSurfaceTest.php', 'tests/Feature/DocumentAttachmentTest.php']
          for path in paths:
              subprocess.run(['php', '-l', path], check=True)
          subprocess.run(['vendor/bin/pint', '--test', *paths], check=True)
          PY
      - name: Prepare disposable application only
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: P18 and full selected attachment owner regressions
        run: |
          php artisan test tests/Feature/P18UploadReceiptTest.php tests/Feature/DocumentAttachmentTest.php tests/Feature/WarrantyFlow04ApiSurfaceTest.php tests/Feature/P15OwnerReadContractTest.php tests/Feature/P17ScanExceptionReservationTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/AuthSessionPersistenceTest.php --log-junit p18-${{ matrix.database }}.xml > /tmp/p18-tests.log 2>&1 || { tail -180 /tmp/p18-tests.log; exit 1; }
          tail -8 /tmp/p18-tests.log
      - name: Publish exact-commit evidence, not live or release acceptance
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('p18-' + os.environ['DB_CONNECTION'] + '.xml')
          if not report.is_file():
              raise SystemExit('No report; P18 is not verified.')
          cases = list(ET.parse(report).getroot().iter('testcase'))
          counts = {'tests': len(cases), 'assertions': sum(int(c.get('assertions', '0')) for c in cases), **{k: sum(len(list(c.iter(tag))) for c in cases) for k, tag in [('failures','failure'), ('errors','error'), ('skipped','skipped')]}}
          own = [c for c in cases if 'P18UploadReceiptTest' in (c.get('class', '') + c.get('classname', ''))]
          evidence = {'sha': os.environ['GITHUB_SHA'], 'database': os.environ['DB_CONNECTION'], 'counts': counts, 'p18_tests': len(own), 'live_verified': False, 'ui_verified': False, 'hardware_verified': False, 'production_activation': False, 'scope': 'P18 plus explicitly selected attachment/owner regressions; not full release CI'}
          print(json.dumps(evidence, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          if len(own) != 13 or counts['failures'] or counts['errors'] or counts['skipped']:
              raise SystemExit('P18 test evidence incomplete or failed.')
          PY

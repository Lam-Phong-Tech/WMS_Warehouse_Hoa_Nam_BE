name: Mini App Work Shifts

on:
  push:
    branches: [dev]
    paths:
      - 'Modules/Auth/**'
      - 'Modules/Warehouse/app/Support/MiniAppWorkShiftService.php'
      - 'Modules/Warehouse/app/Http/Controllers/MiniAppWorkShiftController.php'
      - 'Modules/Warehouse/app/Providers/RouteServiceProvider.php'
      - 'Modules/Warehouse/routes/work_shifts.php'
      - 'Modules/Warehouse/app/Http/Controllers/MiniAppInboundController.php'
      - 'Modules/Warehouse/app/Http/Controllers/MiniAppOutboundController.php'
      - 'Modules/Warehouse/app/Http/Controllers/AlignedOutboundDocumentController.php'
      - 'Modules/Warehouse/app/Http/Controllers/Concerns/InteractsWithStockDocuments.php'
      - 'Modules/Warehouse/app/Http/Controllers/CanonicalMvpController.php'
      - 'database/migrations/2026_10_05_000001_add_mini_app_work_shifts.php'
      - 'tests/Feature/MiniAppWorkShiftTest.php'
      - 'tests/Feature/AuthWarehouseContextTest.php'
      - 'tests/Feature/P02ReadContractTest.php'
      - 'database/migrations/2026_10_06_000001_add_auth_session_warehouse_contexts.php'
      - '.github/workflows/mini-app-work-shifts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: work_shift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d work_shift_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'work_shift_test' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: disposable-ci-only
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=10000 -c statement_timeout=60000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: work-shift-contract-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Work shift, context and P02 read regressions
        timeout-minutes: 6
        run: |
          php artisan test tests/Feature/P02ReadContractTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/AuthRbacAuditHardeningTest.php --stop-on-error --stop-on-failure --log-junit work-shift-results.xml
      - name: Verify registered endpoints
        run: |
          php artisan route:list --path=api/v1/mini-app/work-shifts
          php artisan route:list --path=api/v1/auth/switch-context
      - name: Publish test evidence without artifact storage
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          report = pathlib.Path('work-shift-results.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Work shifts, context and P02 reads — {os.environ['DB_CONNECTION']}\nCommit: `{os.environ['GITHUB_SHA']}`\n\n")
              try:
                  root = ET.parse(report).getroot()
                  for suite in root.findall('./testsuite'):
                      summary.write(str(suite.attrib) + '\n')
                      print(suite.attrib)
              except (OSError, ET.ParseError):
                  summary.write('No complete JUnit report was produced. Read the failed step log.\n')
          PYTHON

name: P03 Draft Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'Modules/Auth/**'
      - 'database/migrations/**'
      - 'tests/Feature/P03DraftContractTest.php'
      - '.github/workflows/p03-draft-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-p03-ci-only
          POSTGRES_DB: p03_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p03_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: disposable-p03-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p03-contract-disposable-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 44369d11e1c100fcba491f4f40e40651ad6944e8
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint P03 implementation
        run: |
          php -l Modules/Warehouse/app/Services/MiniAppDraftService.php
          php -l Modules/Warehouse/app/Http/Controllers/P03DraftController.php
          php -l Modules/Warehouse/app/Http/Middleware/MiniAppDraftHandoff.php
          php -l Modules/Warehouse/app/Providers/RouteServiceProvider.php
          php -l Modules/Warehouse/routes/p03_drafts.php
          php -l database/migrations/2026_10_07_000001_create_mini_app_drafts.php
          php -l tests/Feature/P03DraftContractTest.php
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P03 and existing contract regressions
        run: php artisan test tests/Feature/P03DraftContractTest.php tests/Feature/WarrantyWarehouseScopeTest.php tests/Feature/P02ReadContractTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/AuthRbacAuditHardeningTest.php --stop-on-error --stop-on-failure --log-junit p03-sqlite.xml
      - name: PostgreSQL P03 and existing contract regressions
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p03_contract_test
        run: php artisan test tests/Feature/P03DraftContractTest.php tests/Feature/WarrantyWarehouseScopeTest.php tests/Feature/P02ReadContractTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/AuthRbacAuditHardeningTest.php --stop-on-error --stop-on-failure --log-junit p03-pgsql.xml
      - name: Publish test counts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('p03-*.xml'):
              print(path, [s.attrib for s in ET.parse(path).getroot().findall('./testsuite')])
          PY

name: P03 Draft Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'Modules/Auth/**'
      - 'database/migrations/**'
      - 'tests/Feature/P03Draft*Test.php'
      - '.github/workflows/p03-draft-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-p03-ci-only
          POSTGRES_DB: p03_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p03_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: disposable-p03-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=20000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p03-contract-disposable-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p03-composer.log 2>&1 || { tail -80 /tmp/p03-composer.log; exit 1; }
      - name: P03 syntax and style
        run: |
          python3 - <<'PY'
          import subprocess
          paths = ['Modules/Warehouse/app/Services/MiniAppDraftService.php', 'Modules/Warehouse/app/Http/Controllers/P03DraftController.php', 'Modules/Warehouse/app/Http/Middleware/MiniAppDraftHandoff.php', 'Modules/Warehouse/app/Providers/RouteServiceProvider.php', 'Modules/Warehouse/routes/p03_drafts.php', 'database/migrations/2026_10_07_000001_create_mini_app_drafts.php', 'tests/Feature/P03DraftContractTest.php', 'tests/Feature/P03DraftJsonShapeTest.php', 'Modules/Warehouse/app/Http/Controllers/MiniAppInboundStagingController.php']
          for path in paths:
              subprocess.run(['php', '-l', path], check=True)
          subprocess.run(['vendor/bin/pint', '--test', *paths], check=True)
          PY
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P03 and existing contract regressions
        run: php artisan test tests/Feature/P03Draft*Test.php tests/Feature/WarrantyWarehouseScopeTest.php tests/Feature/P02ReadContractTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/AuthRbacAuditHardeningTest.php --stop-on-error --stop-on-failure --log-junit p03-sqlite.xml
      - name: PostgreSQL P03 and existing contract regressions
        if: success() || failure()
        timeout-minutes: 3
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p03_contract_test
        run: php artisan test tests/Feature/P03Draft*Test.php tests/Feature/WarrantyWarehouseScopeTest.php tests/Feature/P02ReadContractTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/AuthRbacAuditHardeningTest.php --stop-on-error --stop-on-failure --log-junit p03-pgsql.xml
      - name: Publish test counts and failure annotations
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('p03-*.xml'):
              root = ET.parse(path).getroot()
              counts = [s.attrib for s in root.findall('./testsuite')]
              print(path, counts)
              print('::notice title=P03 test counts::'+path.name+' '+str(counts))
              for tag in ['failure', 'error']:
                  for failure in root.iter(tag):
                      message = (failure.text or '')[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=P03 '+path.name+'::'+message)
          PY

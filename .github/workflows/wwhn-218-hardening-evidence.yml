name: WWHN-218 Hardening Evidence

on:
  push:
    branches:
      - m1
    paths:
      - "app/Support/IdempotencyStore.php"
      - "app/Support/IdempotencyKeyGuard.php"
      - "Modules/Auth/**"
      - "Modules/Warehouse/**"
      - "scripts/wwhn218-*.php"
      - "scripts/wwhn218-*.sh"
      - "tests/Feature/StockDocumentIdempotencyTest.php"
      - "tests/Feature/StockDocumentConcurrencyGuardTest.php"
      - "tests/Feature/CurrentBaselineIfMatchContractTest.php"
      - "tests/Feature/Wwhn180IdempotencyAtomicityTest.php"
      - "tests/Feature/Wwhn207InboundReversalFlowTest.php"
      - "tests/Feature/Wwhn211InventoryScopeTest.php"
      - "docs/evidence/WWHN-218/**"
      - ".github/workflows/wwhn-218-hardening-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-hard-gate:
    name: PostgreSQL race + RBAC + idempotency + permission catalog
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoa_nam_wwhn218
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoa_nam_wwhn218"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hoa_nam_wwhn218
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      LOG_CHANNEL: stderr
      WWHN218_EVIDENCE_DIR: storage/app/wwhn-218-evidence

    steps:
      - name: Checkout exact m1 SHA
        uses: actions/checkout@v4

      - name: Initialize immutable provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WWHN218_EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$WWHN218_EVIDENCE_DIR/EXACT_GIT_SHA"
          printf '%s\n' "$GITHUB_RUN_ID" > "$WWHN218_EVIDENCE_DIR/GITHUB_RUN_ID"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$WWHN218_EVIDENCE_DIR/GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$GITHUB_REF_NAME" > "$WWHN218_EVIDENCE_DIR/GIT_REF_NAME"
          printf '%s\n' "Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_BE" > "$WWHN218_EVIDENCE_DIR/CANONICAL_REPOSITORY"
          printf '%s\n' "m1" > "$WWHN218_EVIDENCE_DIR/CANONICAL_BRANCH"

      - name: Setup PHP 8.3 + PostgreSQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare application on PostgreSQL
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force
          php artisan migrate:fresh --seed --force

      - name: Prove PostgreSQL and Redis environment
        shell: bash
        run: |
          set -euo pipefail
          php -r 'echo json_encode(["php"=>PHP_VERSION,"pdo_drivers"=>PDO::getAvailableDrivers()], JSON_PRETTY_PRINT), PHP_EOL;' > "$WWHN218_EVIDENCE_DIR/php-environment.json"
          psql -h 127.0.0.1 -U postgres -d hoa_nam_wwhn218 -Atc "select json_build_object('version',version(),'database',current_database(),'server_addr',inet_server_addr(),'server_port',inet_server_port());" > "$WWHN218_EVIDENCE_DIR/postgres-environment.json"
          php -r '
            require "vendor/autoload.php";
            $client = new Predis\Client([
              "scheme" => "tcp",
              "host" => getenv("REDIS_HOST") ?: "127.0.0.1",
              "port" => (int) (getenv("REDIS_PORT") ?: 6379),
            ]);
            $pong = (string) $client->ping();
            $info = $client->info("server");
            $payload = ["ping" => $pong, "server" => $info];
            file_put_contents(
              getenv("WWHN218_EVIDENCE_DIR")."/redis-environment.json",
              json_encode($payload, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR).PHP_EOL
            );
            if (strtoupper($pong) !== "PONG") { fwrite(STDERR, "Redis PING failed: {$pong}\n"); exit(1); }
          '
        env:
          PGPASSWORD: postgres

      - name: Prove real PostgreSQL multi-connection execution
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$WWHN218_EVIDENCE_DIR/postgres-multiconnection-proof.json"
          PGPASSWORD=postgres PGAPPNAME=wwhn218-probe-a psql -h 127.0.0.1 -U postgres -d hoa_nam_wwhn218 -Atc "select pg_sleep(2);" >/dev/null &
          PID_A=$!
          PGPASSWORD=postgres PGAPPNAME=wwhn218-probe-b psql -h 127.0.0.1 -U postgres -d hoa_nam_wwhn218 -Atc "select pg_sleep(2);" >/dev/null &
          PID_B=$!
          sleep 0.35
          PGPASSWORD=postgres PGAPPNAME=wwhn218-monitor psql -h 127.0.0.1 -U postgres -d hoa_nam_wwhn218 -Atc "select json_build_object('captured_at',clock_timestamp(),'connection_count',count(*),'pids',json_agg(pid order by pid),'states',json_agg(state order by pid),'applications',json_agg(application_name order by pid)) from pg_stat_activity where datname=current_database() and application_name in ('wwhn218-probe-a','wwhn218-probe-b');" > "$PROOF"
          CONNECTIONS="$(jq -er '.connection_count' "$PROOF")"
          [[ "$CONNECTIONS" -eq 2 ]] || { cat "$PROOF"; echo "Expected two simultaneous PostgreSQL evidence connections" >&2; exit 1; }
          wait "$PID_A"
          wait "$PID_B"

      - name: Regenerate permission catalog and route-permission matrix from current seeded DB
        run: php scripts/wwhn218-permission-evidence.php "$WWHN218_EVIDENCE_DIR"

      - name: Run WWHN-218 scoped regression suite on exact PostgreSQL build
        run: |
          php artisan test \
            tests/Feature/StockDocumentIdempotencyTest.php \
            tests/Feature/StockDocumentConcurrencyGuardTest.php \
            tests/Feature/CurrentBaselineIfMatchContractTest.php \
            tests/Feature/Wwhn180IdempotencyAtomicityTest.php \
            tests/Feature/Wwhn207InboundReversalFlowTest.php \
            tests/Feature/Wwhn211InventoryScopeTest.php \
            --log-junit "$WWHN218_EVIDENCE_DIR/phpunit-wwhn218.xml"

      - name: Record regression scope
        shell: bash
        run: |
          cat > "$WWHN218_EVIDENCE_DIR/regression-scope.md" <<'EOF'
          # WWHN-218 regression scope

          This hard gate executes the current canonical PostgreSQL build against the WWHN-218 controls: idempotency, optimistic concurrency/If-Match, stock-document concurrency guard, atomicity, inbound reversal flow, and backend inventory warehouse scope/RBAC.

          `Wwhn211InventoryScopeTest` is included. Its fixture is isolated in `wwhn211_scoped_rows` and no longer drops or recreates canonical `stock_movements` / `inventory_balances`, so the test exercises the migrated PostgreSQL schema instead of mutating baseline physical tables.

          The HTTP gate below adds independent runtime proof for concurrent posting/reversal, idempotent replay, authoritative backend 403 responses, and DB before/after invariants.
          EOF

      - name: Start four-worker API on exact build
        shell: bash
        run: |
          set -euo pipefail
          SERVER_ROUTER="$(pwd)/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
          test -f "$SERVER_ROUTER"
          printf '%s\n' "PHP_CLI_SERVER_WORKERS=4" > "$WWHN218_EVIDENCE_DIR/server-worker-config.txt"
          (
            cd public
            exec env PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 "$SERVER_ROUTER"
          ) > "$WWHN218_EVIDENCE_DIR/laravel-server.log" 2>&1 &
          echo $! > "$WWHN218_EVIDENCE_DIR/laravel-server.pid"
          READY=0
          for _ in $(seq 1 40); do
            HTTP_CODE="$(curl -sS -o "$WWHN218_EVIDENCE_DIR/server-readiness-body.txt" -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/login || true)"
            printf '%s\n' "$HTTP_CODE" > "$WWHN218_EVIDENCE_DIR/server-readiness-status.txt"
            if [[ "$HTTP_CODE" =~ ^[234][0-9][0-9]$ ]]; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [[ "$READY" -ne 1 ]]; then
            echo "HTTP server never produced a non-5xx application response" >&2
            cat "$WWHN218_EVIDENCE_DIR/server-readiness-status.txt" >&2 || true
            cat "$WWHN218_EVIDENCE_DIR/server-readiness-body.txt" >&2 || true
            cat "$WWHN218_EVIDENCE_DIR/laravel-server.log" >&2 || true
            exit 1
          fi
          ps -ef | grep -E '[p]hp.*-S 127\.0\.0\.1:8080' > "$WWHN218_EVIDENCE_DIR/server-processes.txt" || true
          WORKER_COUNT=$(grep -Ec 'php.*-S 127\.0\.0\.1:8080' "$WWHN218_EVIDENCE_DIR/server-processes.txt" || true)
          printf '%s\n' "$WORKER_COUNT" > "$WWHN218_EVIDENCE_DIR/server-worker-count.txt"
          if [ "$WORKER_COUNT" -lt 4 ]; then
            echo "Expected at least four PHP HTTP worker/server processes for concurrency evidence; got $WORKER_COUNT" >&2
            cat "$WWHN218_EVIDENCE_DIR/server-processes.txt" >&2 || true
            cat "$WWHN218_EVIDENCE_DIR/laravel-server.log" >&2 || true
            exit 1
          fi

      - name: Run real concurrent HTTP race, replay and RBAC proof
        run: bash scripts/wwhn218-http-race.sh

      - name: Fail closed if evidence contains authentication secrets
        id: evidence_secret_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WWHN218_EVIDENCE_DIR"
          LEAKS="$WWHN218_EVIDENCE_DIR/evidence-secret-scan-leaks.txt"
          : > "$LEAKS"
          grep -RIlE \
            'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|"(access_token|refresh_token|jwt|token)"[[:space:]]*:[[:space:]]*"[^"]{12,}"' \
            "$WWHN218_EVIDENCE_DIR" > "$LEAKS" || true
          if [ -s "$LEAKS" ]; then
            echo "Authentication secret/token material detected in evidence; artifact upload is blocked." >&2
            cat "$LEAKS" >&2
            exit 1
          fi
          rm -f "$LEAKS"
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{checked_at:$checked_at,status:"PASS",authentication_secret_material_detected:false,artifact_upload_allowed:true}' \
            > "$WWHN218_EVIDENCE_DIR/evidence-security-summary.json"

      - name: Capture route source and immutable hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WWHN218_EVIDENCE_DIR"
          php artisan route:list --path=v1/inbound-documents > "$WWHN218_EVIDENCE_DIR/routes-inbound.txt" 2>&1 || true
          php artisan route:list --path=v1/outbound-documents > "$WWHN218_EVIDENCE_DIR/routes-outbound.txt" 2>&1 || true
          php artisan route:list --path=v1/reversal-documents > "$WWHN218_EVIDENCE_DIR/routes-reversal.txt" 2>&1 || true
          : > "$WWHN218_EVIDENCE_DIR/SHA256SUMS"
          for file in \
            Modules/Auth/database/seeders/AuthDatabaseSeeder.php \
            Modules/Warehouse/routes/api.php \
            Modules/Warehouse/database/migrations/2026_08_12_000001_create_scan_record_tables.php \
            Modules/Warehouse/database/migrations/2026_08_14_000001_add_catalog_report_warranty_pv_integrity_indexes.php \
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineStockFlowController.php \
            Modules/Warehouse/app/Services/CurrentBaselineStockService.php \
            Modules/Warehouse/app/Services/CurrentBaselineReversalService.php \
            app/Support/IdempotencyStore.php \
            tests/Feature/Wwhn211InventoryScopeTest.php \
            scripts/wwhn218-permission-evidence.php \
            scripts/wwhn218-fixture.php \
            scripts/wwhn218-http-race.sh \
            "$WWHN218_EVIDENCE_DIR/permission-catalog.json" \
            "$WWHN218_EVIDENCE_DIR/route-permission-matrix.json" \
            "$WWHN218_EVIDENCE_DIR/runtime-summary.json" \
            "$WWHN218_EVIDENCE_DIR/phpunit-wwhn218.xml" \
            "$WWHN218_EVIDENCE_DIR/regression-scope.md" \
            "$WWHN218_EVIDENCE_DIR/postgres-multiconnection-proof.json" \
            "$WWHN218_EVIDENCE_DIR/server-processes.txt" \
            "$WWHN218_EVIDENCE_DIR/server-readiness-status.txt" \
            "$WWHN218_EVIDENCE_DIR/redis-environment.json" \
            "$WWHN218_EVIDENCE_DIR/evidence-security-summary.json"; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> "$WWHN218_EVIDENCE_DIR/SHA256SUMS"
            fi
          done

      - name: Upload immutable WWHN-218 evidence
        if: always() && steps.evidence_secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-218-hardening-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            storage/app/wwhn-218-evidence/**

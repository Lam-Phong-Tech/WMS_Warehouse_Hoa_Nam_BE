name: Hoa Nam Backend Pint Autoformat All Once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify exact strict-gate scope
        run: |
          set -euo pipefail
          ./vendor/bin/pint --test app Modules tests config database routes
          git diff --check

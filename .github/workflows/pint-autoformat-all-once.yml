name: Hoa Nam ERD Pint Autoformat All Once

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/pint-autoformat-all-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint to complete strict-gate scope
        shell: bash
        run: |
          set -euo pipefail
          ./vendor/bin/pint \
            app/Support/HoaNamErdSchema.php \
            Modules/Warehouse/app/Http/Controllers/CurrentBaseline*.php \
            Modules/Warehouse/app/Services/CurrentBaselineReversalService.php \
            Modules/Warehouse/app/Services/ComponentContainerSubledgerService.php \
            Modules/Warehouse/database/migrations/2026_08_10_000*.php \
            Modules/Warehouse/routes/api.php \
            tests/Feature/DocumentationBaselineContractTest.php \
            tests/Feature/CurrentBaselineFlowContractSourceTest.php \
            tests/Feature/Erd*.php \
            tests/Feature/StockDocumentCanonicalFlowTest.php \
            tests/Feature/StockDocumentIdempotencyTest.php \
            tests/Feature/StockDocumentConcurrencyGuardTest.php
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Pint changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app Modules tests
          git commit -m 'style: apply Pint to complete ERD gate scope'
          git push origin HEAD:m1

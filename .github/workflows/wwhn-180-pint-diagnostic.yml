name: WWHN-180 Pint Diagnostic
on:
  push:
    branches: [m1]
permissions:
  contents: read
jobs:
  pint-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Print exact Pint patch
        shell: bash
        run: |
          ./vendor/bin/pint Modules/Warehouse/app/Services/ImportService.php app/Support/Wwhn172MigrationInspector.php
          git diff -- Modules/Warehouse/app/Services/ImportService.php app/Support/Wwhn172MigrationInspector.php
          test -z "$(git status --porcelain -- Modules/Warehouse/app/Services/ImportService.php app/Support/Wwhn172MigrationInspector.php)"

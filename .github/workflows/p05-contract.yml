name: P05 Outbound Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'Modules/Auth/**'
      - 'tests/Feature/P05*Test.php'
      - 'tests/Feature/MiniAppOutbound*Test.php'
      - '.github/workflows/p05-contract.yml'
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-p05-ci-only
          POSTGRES_DB: p05_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p05_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: disposable-p05-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=20000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p05-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: c8d6b88f56785a5b036c17c952f654dae6d55e7b
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p05-composer.log 2>&1 || { tail -60 /tmp/p05-composer.log; exit 1; }
      - name: Correct test helper collision and format reviewed P05 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          paths = ['Modules/Warehouse/app/Http/Controllers/P05OutboundController.php', 'Modules/Warehouse/app/Http/Middleware/P05OutboundSource.php', 'Modules/Warehouse/app/Http/Middleware/MiniAppDraftHandoff.php', 'Modules/Warehouse/app/Providers/RouteServiceProvider.php', 'Modules/Warehouse/routes/p05_outbound.php', 'tests/Feature/P05OutboundContractTest.php']
          p = Path(paths[-1]); text = p.read_text()
          assert text.count('private function session(): array') == 1
          p.write_text(text.replace('$this->session()', '$this->actorSession()').replace('private function session(): array', 'private function actorSession(): array'))
          for path in paths:
              subprocess.run(['php', '-l', path], check=True)
          subprocess.run(['vendor/bin/pint', *paths], check=True)
          Path('/tmp/p05-reviewed-paths.json').write_text(json.dumps(paths))
          PY
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite P05 and related regressions
        run: php artisan test tests/Feature/P05*Test.php tests/Feature/P03Draft*Test.php tests/Feature/P04*Test.php tests/Feature/MiniAppOutboundStagingTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/AuthSessionPersistenceTest.php --log-junit p05-sqlite.xml
      - name: PostgreSQL P05 and related regressions
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p05_contract_test
        run: php artisan test tests/Feature/P05*Test.php tests/Feature/P03Draft*Test.php tests/Feature/P04*Test.php tests/Feature/MiniAppOutboundStagingTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/AuthSessionPersistenceTest.php --log-junit p05-pgsql.xml
      - name: Publish isolated test evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').glob('p05-*.xml'):
              if not p.stat().st_size: continue
              root = ET.parse(p).getroot()
              counts = [s.attrib for s in root.findall('./testsuite')]
              print('::notice title=P05 counts::'+p.name+' '+str(counts))
              for tag in ['failure', 'error']:
                  for e in root.iter(tag):
                      msg = (e.text or '')[:3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error title=P05 '+p.name+'::'+msg)
          PY
      - name: Publish verified source tree without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, pathlib, subprocess, urllib.request
          import xml.etree.ElementTree as ET
          for filename in ['p05-sqlite.xml', 'p05-pgsql.xml']:
              root = ET.parse(filename).getroot()
              assert not list(root.iter('failure')) and not list(root.iter('error'))
              assert int(root.find('./testsuite').attrib['tests']) >= 95
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_BE'
          paths = json.load(open('/tmp/p05-reviewed-paths.json'))
          nodes = [{'path':p, 'mode':'100644', 'type':'blob', 'content':pathlib.Path(p).read_text()} for p in paths]
          base = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          req = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees', method='POST', data=json.dumps({'base_tree':base, 'tree':nodes}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as response: tree = json.load(response)['sha']
          print('::notice title=Verified P05 source tree::'+tree)
          PY

name: P10 Profile Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Auth/**'
      - 'tests/Feature/P10ProfileContractTest.php'
      - 'scripts/verify-p10-profile-contract.php'
      - '.github/workflows/p10-profile-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-isolated-p10
          POSTGRES_DB: p10_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p10_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'p10_contract_test' }}
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-isolated-p10
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Generate isolated signing material
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          php artisan config:clear
      - name: Validate profile contract policy
        run: php scripts/verify-p10-profile-contract.php
      - name: Isolated HTTP and database contract tests
        run: php artisan test tests/Feature/P10ProfileContractTest.php --log-junit p10-${{ matrix.database }}.xml
      - name: Verify cached routes use the same policy
        run: |
          php artisan route:cache
          php artisan test tests/Feature/P10ProfileContractTest.php --filter=test_existing_routes_use_p10
          php artisan route:clear
      - name: Publish isolated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-contract-${{ matrix.database }}
          path: p10-*.xml
          if-no-files-found: ignore
          retention-days: 7

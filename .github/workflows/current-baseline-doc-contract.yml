name: Hoa Nam Three-Doc Baseline Exact-SHA Gate

on:
  workflow_dispatch:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/current-baseline-doc-contract.yml'
      - 'app/**'
      - 'Modules/Auth/**'
      - 'Modules/Warehouse/**'
      - 'Modules/AuditLog/**'
      - 'routes/**'
      - 'tests/**'
      - 'docs/HoaNam_ERD_Moi_Nhat.md'
      - 'docs/HoaNam_Tai_lieu_tong_hop_Moi_Nhat.md'
      - 'docs/WMS_Hoa_Nam_Techstack_Architecture_Dev_Guide.md'
      - 'docs/contracts/HoaNam_Current_Baseline_Contract.json'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: hoanam-three-doc-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify-current-baseline:
    name: lint, SQLite full suite, PostgreSQL ERD contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoanam_baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoanam_baseline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_WRITE_POLICY: outbox_required
      CI_DEMO_PASSWORD: Baseline-CI-Only-2026
      WWHN180_PASSWORD: Baseline-CI-Only-2026
      WWHN180_NO_PERMISSION_PASSWORD: Baseline-CI-Only-2026
      JWT_SECRET: Baseline-CI-JWT-Only-2026-Exact-SHA

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pgsql, pdo_pgsql, bcmath
          coverage: none
          tools: composer:v2

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/hoanam-baseline.sqlite
          touch /tmp/hoanam-baseline.sqlite

      - name: PHP syntax and formatting gate
        shell: bash
        run: |
          set -euo pipefail
          files=(
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineDocumentController.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineImportController.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineStockFlowController.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineComponentFlowController.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineContainerFlowController.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselinePhysicalCodeController.php
            Modules/Warehouse/app/Services/CurrentBaselineReversalService.php
            Modules/Warehouse/app/Services/ComponentContainerSubledgerService.php
            Modules/Warehouse/database/migrations/2026_08_10_000660_finalize_current_baseline_contract.php
            Modules/Warehouse/database/migrations/2026_08_10_000670_align_identity_container_and_scan_lifecycle.php
            Modules/Warehouse/database/migrations/2026_08_10_000680_align_putaway_and_container_compatibility.php
            Modules/Warehouse/database/migrations/2026_08_10_000690_complete_component_issue_storage_contract.php
            Modules/Warehouse/database/migrations/2026_08_10_000700_enforce_scan_evidence_storage_invariants.php
            Modules/Warehouse/database/migrations/2026_08_10_000710_enforce_cross_aggregate_business_guards.php
            tests/Feature/DocumentationBaselineContractTest.php
            tests/Feature/CurrentBaselineFlowContractSourceTest.php
            tests/Feature/StockDocumentCanonicalFlowTest.php
            tests/Feature/StockDocumentIdempotencyTest.php
            tests/Feature/StockDocumentConcurrencyGuardTest.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          ./vendor/bin/pint --test "${files[@]}"
          python3 -m json.tool docs/contracts/HoaNam_Current_Baseline_Contract.json >/dev/null
          git diff --check HEAD^ HEAD

      - name: SQLite migrate seed focused baseline tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/hoanam-baseline.sqlite
        shell: bash
        run: |
          set -euo pipefail
          php artisan config:clear
          php artisan migrate:fresh --seed --force
          php artisan test --filter '/(DocumentationBaselineContractTest|CurrentBaselineFlowContractSourceTest|StockDocumentCanonicalFlowTest|StockDocumentIdempotencyTest|StockDocumentConcurrencyGuardTest|SwaggerRouteSyncTest|LatestErdBaselineSchemaTest)/'

      - name: SQLite full regression suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/hoanam-baseline.sqlite
        run: php artisan test

      - name: PostgreSQL migrate seed and ERD contract
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: hoanam_baseline
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          php artisan config:clear
          php artisan migrate:fresh --seed --force
          php artisan test --filter '/(DocumentationBaselineContractTest|CurrentBaselineFlowContractSourceTest|StockDocumentCanonicalFlowTest|StockDocumentIdempotencyTest|StockDocumentConcurrencyGuardTest|SwaggerRouteSyncTest|LatestErdBaselineSchemaTest)/'
          php artisan l5-swagger:generate

      - name: Exact SHA summary
        if: always()
        shell: bash
        run: |
          echo '## Hoa Nam three-doc exact-SHA baseline' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Sources: HN-WMS-ERD-DD-001 / HN-BA-MASTER-DEVTEST-001 / HN-WMS-TECH-GUIDE-001' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gate: PHP lint + Pint + contract JSON + SQLite full PHPUnit + PostgreSQL ERD/FK/BIGINT/Swagger' >> "$GITHUB_STEP_SUMMARY"

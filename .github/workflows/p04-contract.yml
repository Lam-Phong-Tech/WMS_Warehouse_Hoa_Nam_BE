name: P04 Inbound Contract
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Modules/Warehouse/**'
      - 'Modules/Auth/**'
      - 'tests/Feature/P04*Test.php'
      - 'tests/Feature/MiniAppInbound*Test.php'
      - 'database/migrations/**'
      - '.github/workflows/p04-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-p04-ci-only
          POSTGRES_DB: p04_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d p04_contract_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: disposable-p04-ci-only
      DB_SSLMODE: disable
      DB_URL: ''
      PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=20000'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
      JWT_SECRET: p04-isolated-ci-only-not-a-production-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_SUPPORTS_CREDENTIALS: 'true'
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_pgsql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress > /tmp/p04-composer.log 2>&1 || { tail -60 /tmp/p04-composer.log; exit 1; }
      - name: Syntax validation
        run: |
          php -l Modules/Warehouse/app/Http/Controllers/P04InboundController.php
          php -l Modules/Warehouse/routes/p04_inbound.php
          php -l database/migrations/2026_10_07_000002_add_p04_inbound_directory.php
          php -l tests/Feature/P04InboundContractTest.php
          php -l tests/Feature/MiniAppInboundStagingTest.php
          php -l Modules/Warehouse/app/Services/BaM1StockService.php
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: SQLite inbound and auth regressions
        run: php artisan test tests/Feature/P04*Test.php tests/Feature/P03Draft*Test.php tests/Feature/MiniAppInboundStagingTest.php tests/Feature/MiniAppInboundNewSkuHandoffTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/P02ReadContractTest.php tests/Feature/WarrantyWarehouseScopeTest.php --log-junit p04-sqlite.xml
      - name: PostgreSQL inbound and auth regressions
        if: success() || failure()
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: p04_contract_test
        run: php artisan test tests/Feature/P04*Test.php tests/Feature/P03Draft*Test.php tests/Feature/MiniAppInboundStagingTest.php tests/Feature/MiniAppInboundNewSkuHandoffTest.php tests/Feature/AuthWarehouseContextTest.php tests/Feature/MiniAppWorkShiftTest.php tests/Feature/AuthSessionPersistenceTest.php tests/Feature/P02ReadContractTest.php tests/Feature/WarrantyWarehouseScopeTest.php --log-junit p04-pgsql.xml
      - name: Publish evidence without artifact storage
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').glob('p04-*.xml'):
              root = ET.parse(p).getroot()
              counts = [s.attrib for s in root.findall('./testsuite')]
              print('::notice title=P04 counts::'+p.name+' '+str(counts))
              for tag in ['failure', 'error']:
                  for e in root.iter(tag):
                      msg = (e.text or '')[:2500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error title=P04 '+p.name+'::'+msg)
          PY

name: Auth RBAC Audit Contract Gate

on:
  pull_request:
    branches: [m1]
  push:
    branches: [fix/wwhn-auth-rbac-audit-hardening, fix/wwhn-r2-inventory-decision-hardening, fix/wwhn-180-api-data-evidence-gate, m1]

permissions:
  contents: read

concurrency:
  group: auth-rbac-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch /tmp/wms-ci.sqlite
          echo "JWT_SECRET=ci-jwt-secret-auth-rbac-audit-contract" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=/tmp/wms-ci.sqlite" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "AUDIT_WRITE_POLICY=outbox_required" >> .env

      - name: PHP syntax and scoped formatting gate
        run: |
          find app Modules tests config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
          git fetch origin m1 --depth=1
          mapfile -t changed_php < <(git diff --name-only origin/m1...HEAD -- '*.php')
          if [ ${#changed_php[@]} -gt 0 ]; then
            ./vendor/bin/pint "${changed_php[@]}"
            if ! git diff --exit-code -- "${changed_php[@]}"; then
              echo "Pint đã phát hiện thay đổi định dạng bắt buộc; áp dụng diff trên vào source."
              exit 1
            fi
          fi

      - name: Collect immutable API and data evidence
        run: bash scripts/collect-api-data-evidence.sh

      - name: Lint OpenAPI contract
        run: npx redocly lint build/evidence/api-data/openapi.json

      - name: Validate Postman artifacts
        run: node -e "const fs=require('fs');for(const p of ['build/evidence/api-data/postman.collection.json','build/evidence/api-data/postman.environment.json']){const c=JSON.parse(fs.readFileSync(p,'utf8'));if(!c)throw new Error('Invalid '+p)}"

      - name: Frontend asset and baseline build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Upload immutable API data evidence
        uses: actions/upload-artifact@v4
        with:
          name: api-data-evidence-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: error
          retention-days: 30

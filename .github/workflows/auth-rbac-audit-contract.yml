name: Auth RBAC Audit Stocktake Contract Gate

on:
  pull_request:
    branches: [m1]
  push:
    branches: [m1]

permissions:
  contents: read

concurrency:
  group: auth-rbac-stocktake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/wms-ci.sqlite
          touch /tmp/wms-ci.sqlite
          echo "JWT_SECRET=ci-jwt-secret-auth-rbac-stocktake" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=/tmp/wms-ci.sqlite" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "AUDIT_WRITE_POLICY=outbox_required" >> .env

      - name: PHP syntax and full formatting gate
        shell: bash
        run: |
          set -euo pipefail
          find app Modules tests config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          ./vendor/bin/pint --test app Modules tests config database routes

      - name: Collect immutable API data and stocktake evidence
        run: bash scripts/collect-api-data-evidence.sh

      - name: Lint OpenAPI contract
        run: npx redocly lint build/evidence/api-data/openapi.json

      - name: Validate evidence manifest and structured results
        run: |
          test -s build/evidence/api-data/SHA256SUMS
          (cd build/evidence/api-data && sha256sum --check SHA256SUMS)
          node -e "const fs=require('fs');for(const p of ['postman.collection.json','postman.environment.json','newman.result.json','contract-verification.json','stocktake.postman.collection.json','stocktake.postman.environment.json','stocktake-newman.result.json','stocktake-contract-verification.json','stocktake-test-cases.json','stocktake-source-register.json','db-before.json','db-after.json','build-metadata.json']){JSON.parse(fs.readFileSync('build/evidence/api-data/'+p,'utf8'));}"
          node -e "const r=require('./build/evidence/api-data/stocktake-contract-verification.json');if(r.summary.failed!==0||r.summary.status!=='PASS')process.exit(1)"

      - name: Frontend asset and baseline build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Upload immutable API data and stocktake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocktake-evidence-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: error
          retention-days: 30

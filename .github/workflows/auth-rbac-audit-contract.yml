name: WWHN-150 API RBAC Stocktake Scan Evidence Gate

on:
  pull_request:
    branches: [m1]
  push:
    branches: [m1]

permissions:
  contents: read

concurrency:
  group: wwhn-150-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/wms-ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_WRITE_POLICY: outbox_required

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/wms-ci.sqlite
          touch /tmp/wms-ci.sqlite
          echo "JWT_SECRET=ci-jwt-secret-wwhn150" >> .env
          ci_password="$(openssl rand -hex 24)"
          echo "::add-mask::$ci_password"
          echo "CI_DEMO_PASSWORD=$ci_password" >> "$GITHUB_ENV"
          echo "WWHN150_PASSWORD=$ci_password" >> "$GITHUB_ENV"
          echo "WWHN150_NO_PERMISSION_PASSWORD=$ci_password" >> "$GITHUB_ENV"

      - name: PHP syntax and formatting gate
        shell: bash
        run: |
          set -euo pipefail
          find app Modules tests config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          ./vendor/bin/pint --test app Modules tests config database routes

      - name: Collect immutable WWHN-150 evidence
        run: bash scripts/collect-api-data-evidence.sh

      - name: Lint generated and WWHN-150 OpenAPI
        run: |
          npx redocly lint build/evidence/api-data/openapi.json
          npx redocly lint build/evidence/api-data/wwhn150-openapi.yaml

      - name: Validate evidence manifest and structured results
        shell: bash
        run: |
          set -euo pipefail
          test -s build/evidence/api-data/SHA256SUMS
          (cd build/evidence/api-data && sha256sum --check SHA256SUMS)
          (cd build/evidence/api-data && sha256sum --check SHA256SUMS.sha256)
          node - <<'NODE'
          const fs = require('fs');
          const jsonFiles = [
            'postman.collection.json',
            'postman.environment.json',
            'newman.result.json',
            'contract-verification.json',
            'stocktake.postman.collection.json',
            'stocktake.postman.environment.json',
            'stocktake-newman.result.json',
            'stocktake-contract-verification.json',
            'stocktake-test-cases.json',
            'stocktake-source-register.json',
            'wwhn150.postman.collection.json',
            'wwhn150.postman.environment.json',
            'wwhn150-newman.result.json',
            'wwhn150-concurrent-scan.json',
            'wwhn150-contract-verification.json',
            'wwhn150-test-cases.json',
            'wwhn150-source-register.json',
            'permission-catalog.json',
            'permission-catalog.repository.json',
            'permission-seed-diff.json',
            'stock-writer-boundary.json',
            'scan-db-before.json',
            'scan-db-after.json',
            'scan-readonly-comparison.json',
            'db-before.json',
            'db-after.json',
            'reconciliation-report.json',
            'build-metadata.json'
          ];
          for (const file of jsonFiles) {
            JSON.parse(fs.readFileSync(`build/evidence/api-data/${file}`, 'utf8'));
          }
          const metadata = JSON.parse(fs.readFileSync('build/evidence/api-data/build-metadata.json', 'utf8'));
          if (metadata.commit_sha !== process.env.GITHUB_SHA) throw new Error('build metadata is not exact-SHA bound');
          if (metadata.artifact_name !== `wwhn-150-evidence-${process.env.GITHUB_SHA}`) throw new Error('artifact name is not exact-SHA bound');
          const passFiles = [
            'contract-verification.json',
            'stocktake-contract-verification.json',
            'wwhn150-contract-verification.json',
            'scan-readonly-comparison.json',
            'reconciliation-report.json',
            'wwhn150-concurrent-scan.json',
            'stock-writer-boundary.json'
          ];
          for (const file of passFiles) {
            const result = JSON.parse(fs.readFileSync(`build/evidence/api-data/${file}`, 'utf8'));
            if (result.summary?.failed !== 0 || result.summary?.status === 'FAIL') {
              throw new Error(`${file} is not PASS`);
            }
          }
          const catalog = JSON.parse(fs.readFileSync('build/evidence/api-data/permission-catalog.json', 'utf8'));
          if (catalog.integrity?.status !== 'PASS') throw new Error('permission-catalog integrity is not PASS');
          const seedDiff = JSON.parse(fs.readFileSync('build/evidence/api-data/permission-seed-diff.json', 'utf8'));
          if (seedDiff.status !== 'PASS') throw new Error('permission seed diff is not PASS');
          NODE

      - name: Frontend asset and baseline build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Upload immutable WWHN-150 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-150-evidence-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: error
          retention-days: 30

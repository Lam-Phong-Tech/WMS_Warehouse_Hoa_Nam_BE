name: Repair component seeder safely (one-time)
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/repair-component-seeder-once.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_BE'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '${{ github.run_id }}-seed-regression-only'
          POSTGRES_DB: component_issue_seeder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d component_issue_seeder_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_DATABASE: component_issue_seeder_test
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: '${{ github.run_id }}-seed-regression-only'
      DB_SSLMODE: disable
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
      - name: Apply exactly the reviewed source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('Modules/Warehouse/database/seeders')
          expected = {
              'WarehouseOperationsCoverageSeeder.php': '537711cdb1fd3478d76238caec273404c39974d8',
              'DisplayFieldCoverageSeeder.php': 'c63351960b09f65e9ad022042cd8ae0221be54e8',
          }
          for filename, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', str(root / filename)], text=True).strip()
              if actual != blob:
                  raise SystemExit('Source changed; stop rather than overwrite: ' + filename)
          path = root / 'WarehouseOperationsCoverageSeeder.php'
          text = path.read_text()
          start = text.index('        // 5. Ghi chú phiếu xuất linh kiện')
          end = text.index('\n    }\n', start)
          old = text[start:end]
          assert old.count("DB::table('component_issue_documents')") == 1
          assert 'catch (Throwable $e)' in old
          new = '''        // 5. Chỉ điền ghi chú khi phiếu còn DRAFT. POSTED/CANCELLED là lịch sử,
                  //    không được sửa để lấp ô trống. Điều kiện nằm ngay trong UPDATE.
                  //    Savepoint bảo vệ outer transaction; lỗi SQL phải nổi lên, không nuốt.
                  DB::transaction(function (): void {
                      DB::table('component_issue_documents')
                          ->where('status', 'DRAFT')
                          ->whereNull('note')
                          ->update([
                              'note' => DB::raw("'Xuất linh kiện thay thế cho hồ sơ bảo hành — phiếu ' || component_issue_no"),
                              'updated_at' => now(),
                          ]);
                  });'''
          text = text[:start] + new + text[end:]
          text = text.replace('không ghi đè giá trị đã có, và bỏ qua an toàn nếu bảng bị guard immutable.',
                              'không ghi đè giá trị đã có; không lấp dữ liệu lịch sử đã bất biến.')
          path.write_text(text)
          path = root / 'DisplayFieldCoverageSeeder.php'
          text = path.read_text()
          old = """            'component_issue_lines' => [
                          'Linh kiện thay theo kết quả kiểm tra bảo hành',
                          'Lấy từ hộp linh kiện đang mở, còn dư trả lại kho',
                          'Thay cả cụm theo khuyến cáo hãng',
                      ],
          """
          assert text.count(old) == 1, 'Expected component line note block exactly once'
          text = text.replace(old, '            // Component-issue line notes belong to initial DRAFT creation.\n'
                                   '            // Never backfill historical lines; their POSTED parent is immutable.\n', 1)
          path.write_text(text)
          PY
          git diff --check
          git diff --stat
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, sqlite3, pdo_sqlite, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - name: Prepare isolated runtime (no server credentials)
        run: |
          cp .env.example .env
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          composer install --no-interaction --prefer-dist --no-progress > /tmp/seed-composer.log 2>&1 || { tail -40 /tmp/seed-composer.log; exit 1; }
          php artisan key:generate
          php artisan config:clear
      - name: Syntax and guarded PostgreSQL backfill regression
        run: |
          php -l Modules/Warehouse/database/seeders/WarehouseOperationsCoverageSeeder.php
          php -l Modules/Warehouse/database/seeders/DisplayFieldCoverageSeeder.php
          php -l scripts/test-component-issue-seeder-immutability.php
          php scripts/test-component-issue-seeder-immutability.php
      - name: Commit only the two tested seeder changes; never force-push
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA" || { echo 'dev changed concurrently; abort'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Modules/Warehouse/database/seeders/WarehouseOperationsCoverageSeeder.php Modules/Warehouse/database/seeders/DisplayFieldCoverageSeeder.php
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'fix(seed): preserve posted component documents and historical line notes' -m 'Filter document note backfills to DRAFT within a rollback-safe transaction. Remove historical component-line note backfills. Keep append-only triggers unchanged. PostgreSQL isolated backfill regression passed; no live database seed, restore or deployment performed.'
          git push origin HEAD:refs/heads/dev
          echo "Seeder fix commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

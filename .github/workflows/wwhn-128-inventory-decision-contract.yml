name: WWHN-128 Inventory Decision Exact-SHA Evidence Gate

on:
  workflow_dispatch:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/wwhn-128-inventory-decision-contract.yml'
      - 'Modules/Warehouse/app/Http/Controllers/Concerns/InteractsWithStockDocuments.php'
      - 'Modules/Warehouse/app/Http/Controllers/WarrantyController.php'
      - 'Modules/Warehouse/app/Http/Controllers/ReportController.php'
      - 'Modules/Warehouse/app/Models/InventorySerial.php'
      - 'Modules/Warehouse/app/Models/WarrantyCase.php'
      - 'Modules/Warehouse/app/Models/WarrantyEvent.php'
      - 'Modules/Warehouse/database/migrations/*inventory_balances*'
      - 'Modules/Warehouse/database/migrations/*stock_movements*'
      - 'database/migrations/*idempotency*'
      - 'app/Support/IdempotencyKeyGuard.php'
      - 'app/Support/IdempotencyStore.php'
      - 'docs/docs_task_jira/WWHN-128*'
      - 'docs/evidence/WWHN-128/**'
      - 'docs/api-contract/WWHN-180-posting-openapi.*'
      - 'docs/postman/WWHN-180 Posting *'
      - 'docs/testing/WWHN-180-posting-test-cases.json'
      - 'docs/evidence/WWHN-180/permission-catalog.json'
      - 'docs/evidence/WWHN-180/BE_FE_PERMISSION_MAPPING.json'
      - 'scripts/verify_wwhn128_closure.py'
      - 'tests/Feature/WarrantyStatusOnlyContractTest.php'
      - 'tests/Feature/WarrantyIdempotencyKeyContractTest.php'
      - 'tests/Feature/InventoryReconciliationSignedStatusTest.php'
      - 'tests/Feature/InventoryReconciliationIntegrityTest.php'
      - 'tests/Feature/Wwhn128EvidenceContractTest.php'
      - 'tests/Feature/Wwhn180IdempotencyAtomicityTest.php'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    branches: [m1]
    paths:
      - '.github/workflows/wwhn-128-inventory-decision-contract.yml'
      - 'Modules/Warehouse/app/Http/Controllers/Concerns/InteractsWithStockDocuments.php'
      - 'Modules/Warehouse/app/Http/Controllers/WarrantyController.php'
      - 'Modules/Warehouse/app/Http/Controllers/ReportController.php'
      - 'Modules/Warehouse/app/Models/InventorySerial.php'
      - 'Modules/Warehouse/app/Models/WarrantyCase.php'
      - 'Modules/Warehouse/app/Models/WarrantyEvent.php'
      - 'Modules/Warehouse/database/migrations/*inventory_balances*'
      - 'Modules/Warehouse/database/migrations/*stock_movements*'
      - 'database/migrations/*idempotency*'
      - 'app/Support/IdempotencyKeyGuard.php'
      - 'app/Support/IdempotencyStore.php'
      - 'docs/docs_task_jira/WWHN-128*'
      - 'docs/evidence/WWHN-128/**'
      - 'docs/api-contract/WWHN-180-posting-openapi.*'
      - 'docs/postman/WWHN-180 Posting *'
      - 'docs/testing/WWHN-180-posting-test-cases.json'
      - 'docs/evidence/WWHN-180/permission-catalog.json'
      - 'docs/evidence/WWHN-180/BE_FE_PERMISSION_MAPPING.json'
      - 'scripts/verify_wwhn128_closure.py'
      - 'tests/Feature/WarrantyStatusOnlyContractTest.php'
      - 'tests/Feature/WarrantyIdempotencyKeyContractTest.php'
      - 'tests/Feature/InventoryReconciliationSignedStatusTest.php'
      - 'tests/Feature/InventoryReconciliationIntegrityTest.php'
      - 'tests/Feature/Wwhn128EvidenceContractTest.php'
      - 'tests/Feature/Wwhn180IdempotencyAtomicityTest.php'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: wwhn-128-${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-sha-contract:
    name: exact-SHA contract, governance and DB evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/wms-wwhn128.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      AUDIT_WRITE_POLICY: outbox_required
      EVIDENCE_DIR: build/evidence/wwhn-128
      WWHN128_EVIDENCE_DIR: build/evidence/wwhn-128

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral CI secret
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="W128-JWT-$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          printf 'JWT_SECRET=%s\n' "$jwt_secret" >> "$GITHUB_ENV"

      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/wms-wwhn128.sqlite
          touch /tmp/wms-wwhn128.sqlite
          mkdir -p "$EVIDENCE_DIR"
          {
            echo 'APP_ENV=testing'
            echo 'APP_DEBUG=false'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=/tmp/wms-wwhn128.sqlite'
            echo 'CACHE_STORE=array'
            echo 'SESSION_DRIVER=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'AUDIT_WRITE_POLICY=outbox_required'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
          } >> .env

      - name: Static integrity and governance gate
        shell: bash
        run: |
          set -euo pipefail
          php_files=(
            Modules/Warehouse/app/Models/InventorySerial.php
            Modules/Warehouse/app/Http/Controllers/Concerns/InteractsWithStockDocuments.php
            Modules/Warehouse/app/Http/Controllers/WarrantyController.php
            Modules/Warehouse/app/Http/Controllers/ReportController.php
            app/Support/IdempotencyKeyGuard.php
            app/Support/IdempotencyStore.php
            tests/Feature/WarrantyStatusOnlyContractTest.php
            tests/Feature/WarrantyIdempotencyKeyContractTest.php
            tests/Feature/InventoryReconciliationSignedStatusTest.php
            tests/Feature/InventoryReconciliationIntegrityTest.php
            tests/Feature/Wwhn128EvidenceContractTest.php
            tests/Feature/Wwhn180IdempotencyAtomicityTest.php
          )
          for file in "${php_files[@]}"; do php -l "$file"; done
          git diff --check
          ./vendor/bin/pint --test "${php_files[@]}"
          python3 -m py_compile scripts/verify_wwhn128_closure.py
          python3 scripts/verify_wwhn128_closure.py | tee "$EVIDENCE_DIR/closure-verification.json"

      - name: Run WWHN-128 scoped regression and evidence suite
        shell: bash
        run: |
          set -euo pipefail
          ./vendor/bin/phpunit \
            --filter '/(WarrantyStatusOnlyContractTest|WarrantyIdempotencyKeyContractTest|InventoryReconciliationSignedStatusTest|InventoryReconciliationIntegrityTest|Wwhn128EvidenceContractTest|Wwhn180IdempotencyAtomicityTest)/' \
            --log-junit "$EVIDENCE_DIR/junit.xml" \
            2>&1 | tee "$EVIDENCE_DIR/phpunit.log"

      - name: Collect immutable exact-SHA evidence package
        shell: bash
        run: |
          set -euo pipefail
          php artisan route:list --json > "$EVIDENCE_DIR/route-list.json"
          git show --stat --oneline --decorate --no-renames "$GITHUB_SHA" > "$EVIDENCE_DIR/commit-stat.txt"
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$EVIDENCE_DIR/changed-files.txt"
          git ls-tree -r --full-tree "$GITHUB_SHA" | sha256sum | awk '{print $1}' > "$EVIDENCE_DIR/source-tree.sha256"

          cat > "$EVIDENCE_DIR/build-metadata.json" <<JSON
          {
            "ticket": "WWHN-128",
            "decision_id": "DEC-INV-001",
            "document_revision": "1.7-R7",
            "commit_sha": "${GITHUB_SHA}",
            "branch_or_ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "artifact_name": "wwhn-128-evidence-${GITHUB_SHA}",
            "database_engine": "sqlite",
            "database_evidence": ["db-before.json", "db-after.json", "schema-verification.json", "reconciliation-report.json"],
            "test_scope": "WWHN-128 focused regression; not repository-wide PHPUnit or PostgreSQL/UAT",
            "approval_policy": "CI success is technical evidence only; independent dispositions remain required"
          }
          JSON

          cp docs/docs_task_jira/WWHN-128.md "$EVIDENCE_DIR/WWHN-128.md"
          cp docs/docs_task_jira/WWHN-128-source-register.json "$EVIDENCE_DIR/WWHN-128-source-register.json"
          cp docs/evidence/WWHN-128/REVIEW_AND_APPROVAL_PROTOCOL.md "$EVIDENCE_DIR/REVIEW_AND_APPROVAL_PROTOCOL.md"
          cp docs/evidence/WWHN-128/INV_P1_P2_CLOSURE_REGISTER.json "$EVIDENCE_DIR/INV_P1_P2_CLOSURE_REGISTER.json"
          cp docs/evidence/WWHN-128/DOWNSTREAM_CONTRACT_GATE.json "$EVIDENCE_DIR/DOWNSTREAM_CONTRACT_GATE.json"

          php -r '
            $xml = simplexml_load_file(getenv("EVIDENCE_DIR")."/junit.xml");
            if ($xml === false) { throw new RuntimeException("Không đọc được JUnit XML"); }
            $a = $xml->attributes();
            $payload = [
              "ticket" => "WWHN-128",
              "tests" => (int) $a["tests"],
              "assertions" => (int) $a["assertions"],
              "errors" => (int) $a["errors"],
              "failures" => (int) $a["failures"],
              "skipped" => (int) $a["skipped"],
            ];
            $payload["status"] = ($payload["errors"] + $payload["failures"] === 0) ? "PASS" : "FAIL";
            file_put_contents(getenv("EVIDENCE_DIR")."/test-summary.json",
              json_encode($payload, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR)."\n");
          '

          cat > "$EVIDENCE_DIR/review-ledger.json" <<'JSON'
          {
            "ticket": "WWHN-128",
            "roles": {
              "BA": {"status": "PENDING_INDEPENDENT_DISPOSITION", "issue": "WWHN-129"},
              "BAS": {"status": "PENDING_INDEPENDENT_DISPOSITION", "issue": "WWHN-130"},
              "TECH_LEAD": {"status": "PENDING_INDEPENDENT_DISPOSITION", "issue": "WWHN-24"},
              "QA1": {"status": "PENDING_EXACT_SHA_ARTIFACT_REVIEW", "issue": "WWHN-24"},
              "PM_APPROVER": {"status": "PENDING_FORMAL_DECISION", "issue": "WWHN-24"}
            },
            "downstream": {
              "WWHN-31": "IN_PROGRESS",
              "WWHN-40": "IN_PROGRESS",
              "WWHN-180": "IN_PROGRESS"
            },
            "anti_impersonation": "BE1 and CI do not sign for independent reviewers"
          }
          JSON

          cat > "$EVIDENCE_DIR/artifact-manifest.json" <<JSON
          {
            "ticket": "WWHN-128",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "artifact_name": "wwhn-128-evidence-${GITHUB_SHA}",
            "required_files": [
              "build-metadata.json", "test-summary.json", "junit.xml", "phpunit.log",
              "db-before.json", "db-after.json", "schema-verification.json", "reconciliation-report.json",
              "route-list.json", "commit-stat.txt", "changed-files.txt", "source-tree.sha256",
              "WWHN-128.md", "WWHN-128-source-register.json", "REVIEW_AND_APPROVAL_PROTOCOL.md",
              "INV_P1_P2_CLOSURE_REGISTER.json", "DOWNSTREAM_CONTRACT_GATE.json",
              "closure-verification.json", "review-ledger.json", "artifact-manifest.json",
              "jira-handoff-comment.txt", "ci-summary.md", "SHA256SUMS", "SHA256SUMS.sha256"
            ]
          }
          JSON

          cat > "$EVIDENCE_DIR/jira-handoff-comment.txt" <<TEXT
          [BE1 R7 STRUCTURED HANDOFF — WWHN-128]
          Decision: DEC-INV-001 v1.7-R7
          Repository/branch: ${GITHUB_REPOSITORY} / m1
          Exact commit: ${GITHUB_SHA}
          Workflow run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}
          Artifact: wwhn-128-evidence-${GITHUB_SHA}
          Closure register: INV_P1_P2_CLOSURE_REGISTER.json
          Downstream gate: DOWNSTREAM_CONTRACT_GATE.json
          Canonical prior text: Jira comments 14742 and 14761; comment 14762 is blob-only and excluded.
          Formal state: NOT APPROVED / NOT BASELINED / NOT EFFECTIVE.
          TEXT

          cat > "$EVIDENCE_DIR/ci-summary.md" <<TEXT
          ## WWHN-128 exact-SHA evidence R7

          - Commit: \`${GITHUB_SHA}\`
          - Run/attempt: \`${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}\`
          - Database: \`sqlite\` isolated CI; not PostgreSQL/UAT
          - Governance verifier: \`scripts/verify_wwhn128_closure.py\`
          - Evidence: JUnit/raw log, DB before/after, schema, reconciliation, closure/downstream registers and dual checksums
          - Boundary: CI does not replace BA/BAS/Tech Lead/QA/FE/PM dispositions
          TEXT

          cd "$EVIDENCE_DIR"
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum SHA256SUMS > SHA256SUMS.sha256

      - name: Validate evidence, manifests and result policy
        shell: bash
        run: |
          set -euo pipefail
          cd "$EVIDENCE_DIR"
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS.sha256

          required_files=(
            build-metadata.json test-summary.json junit.xml phpunit.log
            db-before.json db-after.json schema-verification.json reconciliation-report.json
            route-list.json commit-stat.txt changed-files.txt source-tree.sha256
            WWHN-128.md WWHN-128-source-register.json REVIEW_AND_APPROVAL_PROTOCOL.md
            INV_P1_P2_CLOSURE_REGISTER.json DOWNSTREAM_CONTRACT_GATE.json
            closure-verification.json review-ledger.json artifact-manifest.json
            jira-handoff-comment.txt ci-summary.md SHA256SUMS SHA256SUMS.sha256
          )
          for file in "${required_files[@]}"; do
            [[ -s "$file" ]] || { echo "Missing required evidence file: $file" >&2; exit 1; }
          done

          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '
            .commit_sha == $sha and .run_id == $run
            and .document_revision == "1.7-R7"
            and .database_engine == "sqlite"
          ' build-metadata.json >/dev/null
          jq -e '.status == "PASS" and .errors == 0 and .failures == 0 and .tests >= 18' test-summary.json >/dev/null
          jq -e '.summary.status == "PASS" and .summary.failed == 0' schema-verification.json >/dev/null
          jq -e '.status == "PASS" and .summary.mismatch_count == 0 and .summary.rows_checked == 2' reconciliation-report.json >/dev/null
          jq -e '.status == "PASS" and .formal_closure == "NOT_CLAIMED" and .finding_count == 9' closure-verification.json >/dev/null
          jq -e '.claim_policy.approved == false and .claim_policy.formal_closure == "NOT_CLAIMED"' INV_P1_P2_CLOSURE_REGISTER.json >/dev/null
          jq -e '.gate_status == "FAIL_CLOSED_PENDING_INDEPENDENT_DISPOSITIONS"' DOWNSTREAM_CONTRACT_GATE.json >/dev/null
          jq -e '.roles.BA.status == "PENDING_INDEPENDENT_DISPOSITION" and .roles.PM_APPROVER.status == "PENDING_FORMAL_DECISION"' review-ledger.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" '.commit_sha == $sha and (.required_files | length >= 24)' artifact-manifest.json >/dev/null

      - name: Publish CI summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$EVIDENCE_DIR/ci-summary.md" ]]; then
            cat "$EVIDENCE_DIR/ci-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'WWHN-128 evidence package was not completed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable exact-SHA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-128-evidence-${{ github.sha }}
          path: build/evidence/wwhn-128
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-128-diagnostics-${{ github.sha }}
          path: build/evidence/wwhn-128
          if-no-files-found: warn
          retention-days: 30

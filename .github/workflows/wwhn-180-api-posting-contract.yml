name: WWHN-180 Scan Receipt Issue Evidence Gate

on:
  push:
    branches: [m1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wwhn-180-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts

      - name: Prepare deterministic environment
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/wms-wwhn180.sqlite
          touch /tmp/wms-wwhn180.sqlite
          {
            echo 'JWT_SECRET=ci-jwt-secret-wwhn180'
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=/tmp/wms-wwhn180.sqlite'
            echo 'CACHE_STORE=array'
            echo 'SESSION_DRIVER=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'AUDIT_WRITE_POLICY=outbox_required'
          } >> .env

      - name: Syntax and formatting gate
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Support/IdempotencyStore.php
          php -l tests/Feature/Wwhn180IdempotencyAtomicityTest.php
          git diff --check
          ./vendor/bin/pint --test app/Support/IdempotencyStore.php tests/Feature/Wwhn180IdempotencyAtomicityTest.php

      - name: Collect executable evidence
        env:
          EVIDENCE_DIR: build/evidence/api-data
          WWHN180_EMAIL: manager01@gmail.com
          WWHN180_PASSWORD: Cntt@1234
          WWHN180_NO_PERMISSION_EMAIL: test-no-permission@hoanam.com
          WWHN180_NO_PERMISSION_PASSWORD: Cntt@1234
        run: bash scripts/collect-wwhn180-evidence.sh

      - name: Validate OpenAPI and structured evidence
        shell: bash
        run: |
          set -euo pipefail
          DIR=build/evidence/api-data
          npx redocly lint "$DIR/wwhn180-openapi.yaml"
          node - <<'NODE'
          const fs = require('fs');
          const dir = 'build/evidence/api-data';
          const requiredJson = [
            'build-metadata.json',
            'g1-closure-matrix.json',
            'newman.result.json',
            'openapi.json',
            'permission-catalog.json',
            'reconciliation-report.json',
            'route-list.raw.json',
            'wwhn180-contract-verification.json',
            'wwhn180-db-delta.json',
            'wwhn180-source-register.json',
            'wwhn180-test-cases.json',
            'wwhn180.postman.collection.json',
            'wwhn180.postman.environment.json'
          ];
          for (const file of requiredJson) {
            const path = `${dir}/${file}`;
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`Missing evidence: ${file}`);
            JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          for (const file of ['wwhn180-contract-verification.json', 'wwhn180-db-delta.json', 'reconciliation-report.json']) {
            const result = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
            if (result.summary?.status !== 'PASS' || Number(result.summary?.failed ?? 0) !== 0) {
              throw new Error(`${file} is not PASS`);
            }
          }
          const newman = JSON.parse(fs.readFileSync(`${dir}/newman.result.json`, 'utf8'));
          if ((newman.run?.failures ?? []).length !== 0) throw new Error('Newman has failures');
          const metadata = JSON.parse(fs.readFileSync(`${dir}/build-metadata.json`, 'utf8'));
          if (metadata.commit_sha !== process.env.GITHUB_SHA) throw new Error('build-metadata commit_sha mismatch');
          NODE
          test -s "$DIR/phpunit.raw.log"
          test -s "$DIR/wwhn180-atomicity-phpunit.raw.log"
          test -s "$DIR/stock-document-canonical-phpunit.raw.log"
          test -s "$DIR/stock-document-concurrency-phpunit.raw.log"
          test -s "$DIR/reconciliation-integrity-phpunit.raw.log"
          test -s "$DIR/newman.raw.log"
          test -s "$DIR/db-before.json"
          test -s "$DIR/db-after.json"
          test -s "$DIR/SHA256SUMS"
          test -s "$DIR/SHA256SUMS.sha256"
          (cd "$DIR" && sha256sum --check SHA256SUMS && sha256sum --check SHA256SUMS.sha256)

      - name: Upload immutable WWHN-180 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-data-evidence-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: error
          retention-days: 30

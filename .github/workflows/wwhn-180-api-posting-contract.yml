name: WWHN-180 API Data Contract Evidence Gate
on:
  push:
    branches: [m1]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: wwhn-180-api-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'wwhn-180/evidence-gate', description: 'WWHN-180 evidence gate is running', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts
      - name: Prepare isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          password="W180-$(openssl rand -hex 24)"
          jwt="W180-JWT-$(openssl rand -hex 32)"
          echo "::add-mask::$password"; echo "::add-mask::$jwt"
          printf 'CI_DEMO_PASSWORD=%s\nWWHN180_PASSWORD=%s\nWWHN180_NO_PERMISSION_PASSWORD=%s\nJWT_SECRET=%s\n' "$password" "$password" "$password" "$jwt" >> "$GITHUB_ENV"
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/wms-wwhn180.sqlite; touch /tmp/wms-wwhn180.sqlite
          printf 'JWT_SECRET=%s\nDB_CONNECTION=sqlite\nDB_DATABASE=/tmp/wms-wwhn180.sqlite\nCACHE_STORE=array\nSESSION_DRIVER=array\nQUEUE_CONNECTION=sync\nAUDIT_WRITE_POLICY=outbox_required\n' "$jwt" >> .env
      - name: Static gates
        shell: bash
        run: |
          set -euo pipefail
          find app Modules tests config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          ./vendor/bin/pint --test app Modules tests config database routes
          npm run lint && npm test && npm run build
      - name: Collect exact-SHA evidence
        env:
          EVIDENCE_DIR: build/evidence/api-data
          WWHN180_EMAIL: manager01@gmail.com
          WWHN180_NO_PERMISSION_EMAIL: test-no-permission@hoanam.com
          DB_CONNECTION: sqlite
        run: bash scripts/collect-wwhn180-canonical-evidence.sh
      - name: Verify exact-SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          root=build/evidence/api-data
          npx redocly lint "$root/openapi.json" "$root/openapi.yaml" "$root/wwhn180-openapi.json" "$root/wwhn180-openapi.yaml"
          node - "$root" <<'NODE'
          const fs=require('fs'), root=process.argv[2], read=n=>JSON.parse(fs.readFileSync(`${root}/${n}`,'utf8'));
          const m=read('build-metadata.json'), c=read('canonical-handoff-verification.json'), h=read('credential-hygiene.json');
          if(m.commit_sha!==process.env.GITHUB_SHA||m.artifact_name!==`api-data-evidence-${process.env.GITHUB_SHA}`||m.approval_status!=='PENDING_INDEPENDENT_SIGN_OFF'||m.canonical_drift_status!=='PASS'||m.canonical_postman_request_count!==15) throw Error('metadata gate failed');
          if(c.status!=='PASS'||c.forbidden_request_count||c.forbidden_openapi_path_count||c.committed_secret_value_count) throw Error('canonical gate failed');
          if(read('wwhn180-contract-verification.json').summary?.status!=='PASS'||read('wwhn180-db-delta.json').summary?.status!=='PASS'||read('reconciliation-report.json').summary?.status!=='PASS'||(read('newman.result.json').run?.failures??[]).length) throw Error('runtime evidence failed');
          if(h.status!=='PASS'||h.residual_runtime_secret_count||h.residual_jwt_count) throw Error('credential gate failed');
          NODE
          required=(build-metadata.json source-tree.sha256 SHA256SUMS SHA256SUMS.sha256 canonical-handoff-verification.json immutable-handoff-manifest.json openapi.json openapi.yaml wwhn180-openapi.json wwhn180-openapi.yaml wwhn180.postman.collection.json wwhn180.postman.environment.json wwhn180.ci-harness.collection.json wwhn180.ci-harness.environment.json route-list.raw.json permission-catalog.json permission-catalog.static.json be-fe-permission-mapping.json credential-hygiene.json phpunit.raw.log newman.raw.log newman.result.json db-before.json db-after.json wwhn180-db-delta.json reconciliation-report.json g1-closure-matrix.json)
          for file in "${required[@]}"; do test -s "$root/$file"; done
          (cd "$root" && sha256sum --check SHA256SUMS && sha256sum --check SHA256SUMS.sha256)
      - name: Upload passing evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-data-evidence-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-data-diagnostics-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: passed?'success':'failure', context: 'wwhn-180/evidence-gate', description: passed?'WWHN-180 evidence gate passed':'WWHN-180 evidence gate failed', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

name: WWHN-180 API Data Contract Evidence Gate

on:
  push:
    branches: [m1]
  pull_request:
    branches: [m1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wwhn-180-api-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          set -euo pipefail
          password="W180-$(openssl rand -hex 24)"
          jwt_secret="W180-JWT-$(openssl rand -hex 32)"
          if [[ ${#password} -lt 32 || ${#jwt_secret} -lt 48 ]]; then
            echo '::error::Unable to generate sufficiently strong ephemeral CI credentials.'
            exit 1
          fi

          echo "::add-mask::$password"
          echo "::add-mask::$jwt_secret"
          {
            printf 'CI_DEMO_PASSWORD=%s\n' "$password"
            printf 'WWHN180_PASSWORD=%s\n' "$password"
            printf 'WWHN180_NO_PERMISSION_PASSWORD=%s\n' "$password"
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
          } >> "$GITHUB_ENV"

          echo 'Ephemeral credential generated for this workflow run only.'
          echo 'No repository secret or committed password is required by WWHN-180.'

      - name: Prepare deterministic environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          rm -f /tmp/wms-wwhn180.sqlite
          touch /tmp/wms-wwhn180.sqlite
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            echo 'DB_CONNECTION=sqlite'
            echo 'DB_DATABASE=/tmp/wms-wwhn180.sqlite'
            echo 'CACHE_STORE=array'
            echo 'SESSION_DRIVER=array'
            echo 'QUEUE_CONNECTION=sync'
            echo 'AUDIT_WRITE_POLICY=outbox_required'
          } >> .env

      - name: PHP syntax and formatting gate
        shell: bash
        run: |
          set -euo pipefail
          find app Modules tests config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          ./vendor/bin/pint --test app Modules tests config database routes

      - name: Frontend asset and baseline build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Collect executable exact-SHA evidence
        env:
          EVIDENCE_DIR: build/evidence/api-data
          WWHN180_EMAIL: manager01@gmail.com
          WWHN180_NO_PERMISSION_EMAIL: test-no-permission@hoanam.com
          DB_CONNECTION: sqlite
        run: bash scripts/collect-wwhn180-evidence.sh

      - name: Validate OpenAPI contracts
        run: |
          npx redocly lint build/evidence/api-data/openapi.json
          npx redocly lint build/evidence/api-data/openapi.yaml
          npx redocly lint build/evidence/api-data/wwhn180-openapi.yaml

      - name: Validate structured evidence and exact SHA binding
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const root = 'build/evidence/api-data';
          const jsonFiles = [
            'route-list.raw.json',
            'permission-catalog.json',
            'permission-catalog.static.json',
            'be-fe-permission-mapping.json',
            'credential-hygiene.json',
            'openapi.json',
            'wwhn180.postman.collection.json',
            'wwhn180.postman.environment.json',
            'wwhn180-source-register.json',
            'wwhn180-test-cases.json',
            'wwhn180-contract-verification.json',
            'newman.result.json',
            'db-before.json',
            'db-after.json',
            'wwhn180-db-delta.json',
            'reconciliation-report.json',
            'build-metadata.json',
            'g1-closure-matrix.json'
          ];
          for (const file of jsonFiles) {
            JSON.parse(fs.readFileSync(`${root}/${file}`, 'utf8'));
          }

          const metadata = JSON.parse(fs.readFileSync(`${root}/build-metadata.json`, 'utf8'));
          if (metadata.commit_sha !== process.env.GITHUB_SHA) {
            throw new Error(`Artifact SHA ${metadata.commit_sha} differs from workflow SHA ${process.env.GITHUB_SHA}`);
          }
          if (metadata.artifact_name !== `api-data-evidence-${process.env.GITHUB_SHA}`) {
            throw new Error(`Unexpected artifact name ${metadata.artifact_name}`);
          }
          if (metadata.document_status !== 'PROPOSED' || metadata.approval_status !== 'PENDING_INDEPENDENT_SIGN_OFF') {
            throw new Error('Evidence metadata contains an invalid approval claim');
          }
          if (metadata.credential_mode !== 'EPHEMERAL_PER_WORKFLOW_RUN') {
            throw new Error(`Unexpected credential mode ${metadata.credential_mode}`);
          }

          const contract = JSON.parse(fs.readFileSync(`${root}/wwhn180-contract-verification.json`, 'utf8'));
          if (contract.summary?.status !== 'PASS' || contract.summary?.failed !== 0) {
            throw new Error('WWHN-180 contract verification is not PASS');
          }
          const delta = JSON.parse(fs.readFileSync(`${root}/wwhn180-db-delta.json`, 'utf8'));
          if (delta.summary?.status !== 'PASS' || delta.summary?.failed !== 0) {
            throw new Error('WWHN-180 DB delta verification is not PASS');
          }
          const reconciliation = JSON.parse(fs.readFileSync(`${root}/reconciliation-report.json`, 'utf8'));
          if (reconciliation.summary?.status !== 'PASS' || reconciliation.summary?.failed !== 0) {
            throw new Error('Inventory reconciliation is not PASS');
          }
          const newman = JSON.parse(fs.readFileSync(`${root}/newman.result.json`, 'utf8'));
          if ((newman.run?.failures ?? []).length !== 0) {
            throw new Error(`Newman has ${newman.run.failures.length} failure(s)`);
          }
          const catalog = JSON.parse(fs.readFileSync(`${root}/permission-catalog.json`, 'utf8'));
          if (catalog.integrity?.status !== 'PASS') {
            throw new Error('Runtime permission catalog integrity is not PASS');
          }
          const staticCatalog = JSON.parse(fs.readFileSync(`${root}/permission-catalog.static.json`, 'utf8'));
          if (staticCatalog.integrity?.status !== 'PASS') {
            throw new Error('Static permission catalog integrity is not PASS');
          }
          const mapping = JSON.parse(fs.readFileSync(`${root}/be-fe-permission-mapping.json`, 'utf8'));
          if (
            mapping.integrity?.status !== 'PASS' ||
            mapping.integrity?.unmapped_permission_rows !== 0 ||
            mapping.integrity?.canonical_middleware_replaced_by_alias !== false ||
            mapping.frontend_observed_source?.exact_commit_sha !== '5cd10ec46021cecd24949075cb4eeefaa1fcc9b2'
          ) {
            throw new Error('BE/FE permission mapping is not internally consistent or exact-SHA bound');
          }
          const hygiene = JSON.parse(fs.readFileSync(`${root}/credential-hygiene.json`, 'utf8'));
          if (
            hygiene.status !== 'PASS' ||
            hygiene.residual_runtime_secret_count !== 0 ||
            hygiene.residual_jwt_count !== 0
          ) {
            throw new Error('Credential hygiene verification is not PASS');
          }
          const closure = JSON.parse(fs.readFileSync(`${root}/g1-closure-matrix.json`, 'utf8'));
          if (closure.final_decision !== 'BLOCKED_PENDING_INDEPENDENT_SIGN_OFF') {
            throw new Error('Closure matrix must remain blocked before BA/FE1/QA2 sign-off');
          }
          NODE

          required_files=(
            openapi.json openapi.yaml wwhn180-openapi.yaml
            route-list.raw.json permission-catalog.json permission-catalog.static.json be-fe-permission-mapping.json
            credential-hygiene.json
            phpunit.raw.log wwhn180-atomicity-phpunit.raw.log
            stock-document-canonical-phpunit.raw.log stock-document-concurrency-phpunit.raw.log
            wwhn180-permission-alias-phpunit.raw.log reconciliation-integrity-phpunit.raw.log
            newman.raw.log newman.result.json
            db-before.json db-after.json wwhn180-db-delta.json reconciliation-report.json
            build-metadata.json g1-closure-matrix.json jira-closure-comment.txt ci-summary.md
            SHA256SUMS SHA256SUMS.sha256
          )
          for file in "${required_files[@]}"; do
            test -s "build/evidence/api-data/$file"
          done
          (cd build/evidence/api-data && sha256sum --check SHA256SUMS && sha256sum --check SHA256SUMS.sha256)

      - name: Publish evidence summary
        if: success()
        run: cat build/evidence/api-data/ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable passing evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-data-evidence-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed-run diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-data-diagnostics-${{ github.sha }}
          path: build/evidence/api-data
          if-no-files-found: warn
          retention-days: 14

name: Hoa Nam ERD Pint Autoformat Once

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/pint-autoformat-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply project Pint rules
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/Support/HoaNamErdSchema.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineImportController.php
            Modules/Warehouse/app/Http/Controllers/CurrentBaselineWarrantyController.php
            Modules/Warehouse/database/migrations/2026_08_10_000665_backfill_legacy_container_physical_code_targets.php
            Modules/Warehouse/database/migrations/2026_08_10_000750_materialize_erd_1_0_physical_objects.php
            Modules/Warehouse/database/migrations/2026_08_10_000760_align_erd_1_0_fields_types_and_data.php
            Modules/Warehouse/database/migrations/2026_08_10_000765_keep_legacy_runtime_and_erd_physical_schema_in_sync.php
            Modules/Warehouse/database/migrations/2026_08_10_000766_backfill_structured_erd_payload_columns.php
            Modules/Warehouse/database/migrations/2026_08_10_000767_complete_import_batch_runtime_compatibility.php
            Modules/Warehouse/database/migrations/2026_08_10_0007675_prepare_defect_catalog_canonical_key.php
            Modules/Warehouse/database/migrations/2026_08_10_000768_sync_defect_catalog_runtime_to_erd.php
            Modules/Warehouse/database/migrations/2026_08_10_000769_remove_superseded_label_print_event_status_guard.php
            Modules/Warehouse/database/migrations/2026_08_10_0007695_prepare_all_canonical_erd_keys.php
            Modules/Warehouse/database/migrations/2026_08_10_0007697_backfill_iam_canonical_required_fields.php
            Modules/Warehouse/database/migrations/2026_08_10_0007698_backfill_warranty_canonical_required_fields.php
            Modules/Warehouse/database/migrations/2026_08_10_000770_enforce_erd_1_0_keys_relationships_and_constraints.php
            Modules/Warehouse/database/migrations/2026_08_10_000772_promote_documented_canonical_primary_keys.php
            Modules/Warehouse/database/migrations/2026_08_10_000773_sync_warranty_runtime_to_erd.php
            Modules/Warehouse/database/migrations/2026_08_10_000774_sync_iam_runtime_to_erd.php
            Modules/Warehouse/database/migrations/2026_08_10_000780_enforce_cross_table_erd_business_invariants.php
            Modules/Warehouse/database/migrations/2026_08_10_000781_enable_putaway_history_guard.php
            Modules/Warehouse/database/migrations/2026_08_10_000782_enforce_item_tracking_and_container_sku_rules.php
            Modules/Warehouse/database/migrations/2026_08_10_000783_enforce_documented_nonpartial_unique_indexes.php
            Modules/Warehouse/database/migrations/2026_08_10_000784_enforce_remaining_erd_cross_aggregate_rules.php
            Modules/Warehouse/routes/api.php
            tests/Feature/DocumentationBaselineContractTest.php
            tests/Feature/ErdPhysicalSchemaParityTest.php
            tests/Feature/ErdRuntimeMirrorParityTest.php
            tests/Feature/ErdBusinessInvariantParityTest.php
          )
          ./vendor/bin/pint "${files[@]}"
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Pint changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app Modules tests
          git commit -m 'style: apply Pint to ERD hardening files'
          git push origin HEAD:m1

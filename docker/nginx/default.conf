server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $php_upstream backend:9000;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compress JSON/API responses and web assets before sending them to FE.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Keep medium/large JSON responses in memory instead of spilling to a
        # temporary file before nginx forwards them to the browser.
        fastcgi_buffering on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ /\.ht {
        deny all;
    }
}

# Hoa Nam WMS nginx main config (k6 load-test remediation, 2026-08-26).
#
# This project previously relied on the nginx:alpine image's built-in
# nginx.conf, only supplying the server block via default.conf.template. That
# default caps events.worker_connections at 1024 and leaves worker_rlimit_nofile
# unset (OS default, often 1024) -- fine at low concurrency, but a needless
# ceiling once the php-fpm pool behind it (see docker/php/www.conf) can
# actually push more concurrent requests through. Everything below is
# otherwise identical to the stock image config; only worker_rlimit_nofile,
# worker_connections and multi_accept were added/changed.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  4096;
    multi_accept on;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WWHN-SEC-09: khong lo phien ban nginx trong header `Server` va trang loi
    # (truoc day chi profile perf co dong nay, profile trien khai thi khong).
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

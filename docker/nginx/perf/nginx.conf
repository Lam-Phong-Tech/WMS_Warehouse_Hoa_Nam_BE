# nginx main config của HỒ SƠ ĐO TẢI (chỉ nạp cùng docker-compose.perf.yml).
# Khác bản dev ở ba chỗ: số kết nối mỗi worker, giới hạn file descriptor, và
# tắt access log để không biến ổ đĩa thành nút cổ chai khi có hàng trăm req/s.
user  nginx;
# 07/09/2026: KHÔNG dùng `auto` (= 16 trên máy 16 vCPU).
#
# Lý do là ràng buộc với php-fpm, không phải tiết kiệm CPU: mỗi worker nginx giữ
# RIÊNG một pool kết nối keepalive tới upstream (chỉ thị `keepalive` bên dưới là
# PER WORKER). php-fpm KHÔNG có idle timeout cho kết nối FastCGI đang giữ — một
# child bám vào kết nối đó và không quay lại pool. Vì vậy trần kết nối giữ được
# phải nhỏ hơn tổng số child:
#
#     worker_processes × keepalive  ≤  (số child mỗi replica × số replica)
#     4 × 8 = 32  ≤  48 × 2 = 96          ✔ (bản cũ: 16 × 128 = 2.048 ✘)
#
# Triệu chứng của bản cũ: `listen queue` của php-fpm lên 574–771 trong khi CPU
# vẫn còn rảnh — request xếp hàng chờ child, mà child thì đang bị kết nối
# keepalive giữ. Đổi `worker_processes` phải đổi `keepalive` theo, và ngược lại.
worker_processes  4;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # 16384 x số worker: trần kết nối đồng thời. Mỗi request từ trình duyệt
    # chiếm 2 slot (1 phía client + 1 phía upstream php-fpm).
    worker_connections  16384;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    # Ghi access log đồng bộ cho mỗi request là một lượt ghi đĩa. Ở tải cao trên
    # bind mount Windows đây là chi phí thật. Bật lại (hoặc dùng buffer) khi cần
    # điều tra: access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Giữ kết nối với client lâu hơn: trình duyệt FE gọi nhiều API liên tiếp,
    # bắt tay TCP/TLS lại cho từng lần là lãng phí thuần tuý.
    keepalive_timeout  75;
    keepalive_requests 10000;

    server_tokens off;
    reset_timedout_connection on;

    client_body_timeout 30s;
    send_timeout 30s;

    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    include /etc/nginx/conf.d/*.conf;
}

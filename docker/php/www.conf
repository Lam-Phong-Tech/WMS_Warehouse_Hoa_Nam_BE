; Hoa Nam WMS PHP-FPM pool tuning (k6 load-test remediation, 2026-08-26).
;
; The base php:8.3-fpm-alpine image ships pm.max_children=5, which caps the
; whole container at 5 concurrent PHP requests no matter how light the route
; is. k6 step test on GET / (a route that does no DB work at all) showed p95
; plateauing near 5.2s from 25 VU all the way through 400 VU -- the classic
; signature of requests queueing behind a tiny, fixed-size FPM worker pool --
; then failing outright at 500 VU with fast (not slow) errors, i.e. the
; listen() backlog overflowing and the OS refusing new connections.
;
; Sizing basis: an 8 vCPU / 16GB RAM host running the full compose stack
; (postgres, valkey, minio, mailpit, nginx, and this php-fpm-based backend
; plus the queue/reverb/scheduler containers built from the same image, each
; a single long-running process, not part of this pool). Reserving roughly
; 6-7GB for postgres/valkey/minio/mailpit/nginx/those workers/OS+Docker
; Desktop overhead leaves about 9-10GB for this pool. A typical Laravel
; worker here holds roughly 30-50MB resident once opcache is warm, so
; pm.max_children=150 tops out around 6GB for this pool -- inside that
; budget with margin. Re-tune pm.max_children if the real deploy host has
; meaningfully different CPU/RAM (watch `docker stats` under load and adjust
; rather than guessing).
;
; IMPORTANT CEILING: this alone does not guarantee 1000 truly-simultaneous
; zero-think-time requests stay fast. With only 8 physical cores, work that
; is genuinely CPU-bound (not waiting on DB/disk I/O) is still serialized
; across those 8 cores regardless of worker count -- more workers here mainly
; turn "connection refused" into "queued and eventually served" rather than
; multiplying raw throughput past what 8 cores can execute. Getting a
; k6 script with no sleep() between requests to hold ~1000 VU at low p95 on
; this single host is unlikely without either (a) horizontal scaling (run N
; backend replicas behind nginx upstream / a bigger host), or (b) an
; async runtime (Laravel Octane) that doesn't need one OS process per
; in-flight request -- both are larger changes, do not attempt without
; dedicated regression testing across the whole app first. If real traffic
; has normal think-time between requests (people reading/clicking, not a
; hammer loop), the in-flight concurrency at any instant is far below the
; raw user count and this tuning is very likely enough on its own.
;
; Only pm.* is overridden here; listen/user/group and everything else still
; come from the image's own /usr/local/etc/php-fpm.d/www.conf (php-fpm merges
; directives per pool name across conf.d files -- last file loaded wins per
; directive, unspecified ones are inherited). This file is named to sort
; after www.conf so it applies on top, same trick already used by
; zz-wms-opcache.ini in this directory.
[www]
pm = dynamic
pm.max_children = 150
pm.start_servers = 30
pm.min_spare_servers = 20
pm.max_spare_servers = 60
pm.max_requests = 500
pm.process_idle_timeout = 10s

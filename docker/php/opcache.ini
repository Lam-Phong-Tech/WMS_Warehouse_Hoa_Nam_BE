; Hoa Nam WMS PHP runtime performance profile.
; Keep timestamp validation enabled so local development still picks up source changes.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
opcache.jit=off

; Laravel resolves many PHP paths on every request. A larger realpath cache is
; especially important when the project source is bind-mounted from Windows.
realpath_cache_size=4096K
realpath_cache_ttl=600

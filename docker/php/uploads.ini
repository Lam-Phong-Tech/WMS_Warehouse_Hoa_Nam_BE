; WAR-02: video đính kèm bảo hành tối đa 300MB, một video ACTIVE/hồ sơ.
; Các lớp phía trước phải mở tương ứng:
;   - nginx backend: client_max_body_size 320m (WMS_NGINX_MAX_BODY)
;   - nginx host/FE: client_max_body_size 320m + proxy_read_timeout đủ lớn
; post_max_size lớn hơn upload_max_filesize để chứa multipart overhead.
;
; File được nạp TRƯỚC zz-wms-opcache.ini để perf-entrypoint.sh vẫn có thể
; override memory_limit theo tài nguyên máy chạy perf.
upload_max_filesize = 300M
post_max_size = 320M
max_file_uploads = 20
memory_limit = 512M
max_input_time = 300
max_execution_time = 300

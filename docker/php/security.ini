; Hoa Nam WMS PHP runtime hardening — áp cho php-fpm, CLI và `php artisan serve`.
;
; WWHN-SEC-03, phòng thủ nhiều lớp: middleware SecurityHeaders gỡ X-Powered-By khỏi
; response đi hết pipeline Laravel, nhưng không che được lỗi xảy ra trước middleware
; (bootstrap, fatal) hay tệp PHP chạy ngoài Laravel. expose_php là PHP_INI_SYSTEM nên
; chỉ đặt được ở tầng ini, không bằng ini_set(). nginx giữ thêm một lớp:
; `fastcgi_hide_header X-Powered-By` trong docker/nginx/default.conf.template và
; docker/nginx/perf/default.conf.template. Bản build cũ trên production từng trả
; `X-Powered-By: PHP/8.3.33`.
expose_php = Off

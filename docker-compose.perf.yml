# ---------------------------------------------------------------------------
# HỒ SƠ CHỊU TẢI (perf overlay) — WMS Hoà Nam
#
# File này KHÔNG tự động được nạp. `docker compose up` như thường lệ vẫn chạy
# đúng stack dev cũ, không đổi một hành vi nào. Chỉ khi khai báo tường minh:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.perf.yml up -d
#
# thì các tinh chỉnh dưới đây mới có hiệu lực. (Nhắc: khi đã truyền -f thì
# docker-compose.override.yml KHÔNG còn được nạp ngầm, phải liệt kê tay như trên.)
#
# Nguyên tắc của toàn bộ overlay: KHÔNG sửa mã ứng dụng, KHÔNG đổi hành vi
# nghiệp vụ. Mọi thứ ở đây là tham số vận hành — kích thước pool, bộ nhớ, cache,
# giới hạn tài nguyên — và đều đọc từ biến môi trường để cùng một file chạy được
# trên máy dev 8GB lẫn server thật 64GB. Xem .env.perf.example cho preset.
# ---------------------------------------------------------------------------

services:
  nginx:
    # ĐÃ SỬA (trước đây là một lưu ý vận hành, nay là hành vi tự động):
    # khối `upstream` của hồ sơ perf dùng `zone` + tham số `resolve`, nên nginx
    # tự phân giải lại tên `backend` theo TTL của DNS Docker. Recreate riêng
    # container backend KHÔNG còn gây 502 và KHÔNG còn cần `restart nginx` thủ
    # công. Chi tiết và bằng chứng kiểm chứng: docker/nginx/perf/default.conf.template.
    volumes:
      # Ghi đè đúng hai file cấu hình (compose khớp theo đường dẫn trong
      # container); bind mount mã nguồn khai ở compose gốc giữ nguyên.
      - ./docker/nginx/perf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/perf/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - WMS_NGINX_EXTERNAL_PORT=${NGINX_DOCKER_PORT:-8080}
      # Danh sách backend cho khối `upstream`. `resolve` là phần bắt buộc để nginx
      # theo kịp IP mới khi container backend được recreate — bỏ nó đi là quay lại
      # đúng lỗi 502 cũ. Mở rộng ngang nhiều máy: nối thêm
      # "server host2:9000 resolve; server host3:9000 resolve;" vào biến này
      # (địa chỉ IP thuần cũng hợp lệ, có hay không có `resolve` đều được).
      # max_fails=0 (KHÔNG loại upstream) — ĐO ĐƯỢC 07/09/2026, mức 200 req/s:
      # nginx ghi 2.917 dòng "no live upstreams" và trả 502 cho 2.930 request,
      # trong khi CẢ HAI backend vẫn sống và vẫn trả 200 cho request khác.
      #
      # Cơ chế: `max_fails=3 fail_timeout=10s` là kiểm tra sức khoẻ THỤ ĐỘNG. Khi
      # quá tải, 3 request chậm quá hạn là đủ để nginx đánh dấu một backend "chết"
      # 10 giây. Với đúng HAI backend và không có dự phòng, việc loại một cái dồn
      # toàn bộ tải sang cái còn lại ⇒ cái đó cũng bị loại ⇒ "no live upstreams" ⇒
      # 502 cho MỌI request trong 10 giây, kể cả những request lẽ ra phục vụ được.
      # Chậm tạm thời bị KHUẾCH ĐẠI thành mất dịch vụ hoàn toàn.
      #
      # Với FastCGI, "upstream" ở đây không phải máy chủ độc lập có thể hỏng riêng
      # — chúng là toàn bộ năng lực của hệ thống. Quá tải thì đúng hành vi là XẾP
      # HÀNG (và để `fastcgi_next_upstream` xử lý lỗi từng request), không phải
      # cắt dịch vụ. Khi có nhiều máy thật + dự phòng thì bật lại `max_fails` là
      # hợp lý; lúc đó đặt qua biến môi trường này chứ không sửa file.
      - WMS_PHP_UPSTREAM_SERVERS=${WMS_PHP_UPSTREAM_SERVERS:-server backend:9000 resolve max_fails=0;}
      - WMS_NGINX_MAX_BODY=${WMS_NGINX_MAX_BODY:-64m}
      # Thư mục public mà php-fpm phục vụ (SCRIPT_FILENAME). Phải khớp
      # PERF_LOCAL_CODE/PERF_APP_DIR của backend: bản chép trong container là
      # /srv/app/public; quay về bind mount thì đặt /var/www/html/public.
      - WMS_PHP_DOCROOT=${WMS_PHP_DOCROOT:-/srv/app/public}
      - WMS_NGINX_FASTCGI_TIMEOUT=${WMS_NGINX_FASTCGI_TIMEOUT:-60}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  backend:
    depends_on:
      pgbouncer:
        condition: service_started
    # entrypoint riêng: sinh cấu hình php-fpm/opcache theo biến môi trường rồi
    # giao lại cho entrypoint gốc trong image. Gọi qua `sh` để không phụ thuộc
    # bit thực thi của file trên bind mount Windows.
    entrypoint: ["sh", "/var/www/html/docker/php/perf-entrypoint.sh"]
    # `-F` (foreground) là cách gọi php-fpm chuẩn cho container: giữ tiến trình ở
    # tiền cảnh làm PID chính và đẩy log ra stderr để Docker thu. Dưới lớp
    # entrypoint bọc thêm, bản `php-fpm` trần có thể tự tách nền rồi thoát khiến
    # container dừng; `-F` bảo đảm không xảy ra. Không đổi hành vi ứng dụng.
    command: ["php-fpm", "-F"]
    environment:
      # --- Chi phí mỗi request, không đổi hành vi nghiệp vụ ---
      # APP_DEBUG=true bắt Laravel thu thập toàn bộ truy vấn + stack trace cho
      # mọi request, kể cả request thành công. Đây là khoản tốn vô ích lớn nhất.
      - APP_DEBUG=false
      # Log mức debug ghi thẳng ra file trên bind mount Windows -> tranh chấp ổ
      # đĩa ở tải cao. Đẩy ra stderr để Docker thu, và chỉ ghi từ mức warning.
      - LOG_LEVEL=${PERF_LOG_LEVEL:-warning}
      - LOG_STACK=${PERF_LOG_STACK:-stderr}
      # phpredis (extension C) thay predis (thuần PHP). Đã cài sẵn trong image.
      - REDIS_CLIENT=${PERF_REDIS_CLIENT:-phpredis}
      # Valkey: giữ kết nối qua các request của cùng worker php-fpm (phpredis
      # pconnect) thay vì TCP connect + AUTH + SELECT mỗi request; và đặt trần
      # thời gian chờ để Valkey treo không ghim worker (xem config/database.php).
      - REDIS_PERSISTENT=${REDIS_PERSISTENT:-true}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-2}
      - REDIS_READ_TIMEOUT=${REDIS_READ_TIMEOUT:-2}
      # Chỉ container này hâm nóng cache config/route/event. bootstrap/cache nằm
      # trên bind mount dùng chung nên nhiều container cùng ghi sẽ đua nhau.
      - PERF_OPTIMIZE=${PERF_OPTIMIZE:-true}
      # Mã nguồn được chép vào filesystem của container lúc khởi động và php-fpm
      # phục vụ từ đó (xem docker/php/perf-entrypoint.sh, mục PERF_LOCAL_CODE).
      # ĐO 07/09/2026: bind mount Docker Desktop 65 req/s ⇒ bản chép 284 req/s ở
      # 40 người dùng đồng thời, cùng mã cùng DB. Phải đi cùng WMS_PHP_DOCROOT của
      # nginx bên dưới. Đặt PERF_LOCAL_CODE=false để quay về bind mount.
      - PERF_LOCAL_CODE=${PERF_LOCAL_CODE:-true}
      - PERF_APP_DIR=${PERF_APP_DIR:-/srv/app}
      # Ghi request >= ngưỡng (ms) kèm phân rã route/SQL/cache/lock — xem
      # App\Http\Middleware\SlowRequestLog và config/wms_perf.php. 0 = tắt.
      - SLOW_REQUEST_MS=${SLOW_REQUEST_MS:-500}
      # File export báo cáo: job nền (container queue) ghi, request HTTP (container
      # backend BẤT KỲ) tải về. Nhiều replica sau load balancer thì đĩa local của
      # từng container không còn là "cùng một chỗ" — hồ sơ chịu tải dùng đĩa chung
      # (MinIO/S3). Bucket do minio-init tạo; kiểm chứng 07/09/2026:
      #   docker compose exec backend php artisan tinker --execute="Storage::disk('s3')->put('healthcheck.txt','ok');"
      # Backend và queue PHẢI cùng giá trị (xem config/wms_export.php).
      # Postgres qua PgBouncer (xem service pgbouncer phía dưới).
      - DB_HOST=${WMS_DB_HOST:-pgbouncer}
      - DB_PORT=${WMS_DB_PORT:-5432}
      - REPORT_EXPORT_DISK=${REPORT_EXPORT_DISK:-s3}
      # Mọi file được ghi ở request này và đọc ở request khác phải nằm trên đĩa DÙNG
      # CHUNG khi có nhiều instance: CSV lỗi import, ảnh/video bảo hành, chứng từ đính
      # kèm. Bản ghi cũ vẫn lưu storage_disk của riêng nó nên đổi ở đây không hỏng file cũ.
      - IMPORT_ERROR_FILE_DISK=${IMPORT_ERROR_FILE_DISK:-s3}
      - DOCUMENT_ATTACHMENT_DISK=${DOCUMENT_ATTACHMENT_DISK:-s3}
      - WARRANTY_PHOTO_DISK=${WARRANTY_PHOTO_DISK:-s3}
      - WARRANTY_VIDEO_DISK=${WARRANTY_VIDEO_DISK:-s3}

      # --- Kích thước pool php-fpm (tính theo RAM thật, xem .env.perf.example) ---
      - PHP_FPM_PM=${PHP_FPM_PM:-dynamic}
      - PHP_FPM_MAX_CHILDREN=${PHP_FPM_MAX_CHILDREN:-48}
      - PHP_FPM_START_SERVERS=${PHP_FPM_START_SERVERS:-12}
      - PHP_FPM_MIN_SPARE=${PHP_FPM_MIN_SPARE:-12}
      - PHP_FPM_MAX_SPARE=${PHP_FPM_MAX_SPARE:-24}
      # 1000 → 5000 (07/09/2026): mỗi child php-fpm MỚI phải hỏi lại catalog cột của
      # từng bảng (BaseRepository::getTableColumns / nonNullableColumns memo theo tiến
      # trình) — pg_stat_statements ghi ~24.000 câu introspection / 150k request vì
      # child bị tái sinh sau mỗi 1000 request. 5000 vẫn là chốt chống rò rỉ bộ nhớ
      # thông dụng cho production.
      - PHP_FPM_MAX_REQUESTS=${PHP_FPM_MAX_REQUESTS:-5000}
      - PHP_FPM_BACKLOG=${PHP_FPM_BACKLOG:-8192}
      - PHP_FPM_SLOWLOG_TIMEOUT=${PHP_FPM_SLOWLOG_TIMEOUT:-3s}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}

      # --- opcache ---
      - OPCACHE_VALIDATE_TIMESTAMPS=${OPCACHE_VALIDATE_TIMESTAMPS:-0}
      - OPCACHE_MEMORY=${OPCACHE_MEMORY:-256}
      - OPCACHE_MAX_FILES=${OPCACHE_MAX_FILES:-30000}
      - OPCACHE_JIT=${OPCACHE_JIT:-tracing}
      - OPCACHE_JIT_BUFFER=${OPCACHE_JIT_BUFFER:-64M}

      # --- Cơ sở dữ liệu dùng khi đo tải ---
      # Mặc định vẫn là DB thật; đặt PERF_DB_DATABASE=wms_hoanam_perf để đo trên
      # bản sao có khối lượng dữ liệu lớn mà không đụng dữ liệu đang dùng.
      - DB_DATABASE=${PERF_DB_DATABASE:-wms_hoanam}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-10}"
          memory: ${BACKEND_MEM_LIMIT:-2600m}

  queue:
    entrypoint: ["sh", "/var/www/html/docker/php/perf-entrypoint.sh"]
    # Nhiều worker chạy song song thay vì một. Job của WMS (audit outbox,
    # reconcile tồn kho) dồn theo đợt sau mỗi lần đăng phiếu; một worker duy
    # nhất là hàng đợi nối tiếp và làm chuông thông báo trễ dần khi tải lên.
    command:
      - sh
      - -lc
      - php artisan queue:work --tries=3 --timeout=${QUEUE_WORKER_TIMEOUT:-90} --sleep=1 --max-jobs=${QUEUE_MAX_JOBS:-2000}
    deploy:
      replicas: ${QUEUE_REPLICAS:-2}
      resources:
        limits:
          memory: ${QUEUE_MEM_LIMIT:-300m}
    environment:
      - APP_DEBUG=false
      - LOG_LEVEL=${PERF_LOG_LEVEL:-warning}
      - LOG_STACK=${PERF_LOG_STACK:-stderr}
      - REDIS_CLIENT=${PERF_REDIS_CLIENT:-phpredis}
      # Valkey: giữ kết nối qua các request của cùng worker php-fpm (phpredis
      # pconnect) thay vì TCP connect + AUTH + SELECT mỗi request; và đặt trần
      # thời gian chờ để Valkey treo không ghim worker (xem config/database.php).
      - REDIS_PERSISTENT=${REDIS_PERSISTENT:-true}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-2}
      - REDIS_READ_TIMEOUT=${REDIS_READ_TIMEOUT:-2}
      # Không hâm nóng cache ở đây: backend đã làm, dùng chung bootstrap/cache.
      - PERF_OPTIMIZE=false
      # Postgres qua PgBouncer (xem service pgbouncer phía dưới).
      - DB_HOST=${WMS_DB_HOST:-pgbouncer}
      - DB_PORT=${WMS_DB_PORT:-5432}
      - REPORT_EXPORT_DISK=${REPORT_EXPORT_DISK:-s3}
      # Mọi file được ghi ở request này và đọc ở request khác phải nằm trên đĩa DÙNG
      # CHUNG khi có nhiều instance: CSV lỗi import, ảnh/video bảo hành, chứng từ đính
      # kèm. Bản ghi cũ vẫn lưu storage_disk của riêng nó nên đổi ở đây không hỏng file cũ.
      - IMPORT_ERROR_FILE_DISK=${IMPORT_ERROR_FILE_DISK:-s3}
      - DOCUMENT_ATTACHMENT_DISK=${DOCUMENT_ATTACHMENT_DISK:-s3}
      - WARRANTY_PHOTO_DISK=${WARRANTY_PHOTO_DISK:-s3}
      - WARRANTY_VIDEO_DISK=${WARRANTY_VIDEO_DISK:-s3}
      - PHP_FPM_MAX_CHILDREN=4
      - OPCACHE_VALIDATE_TIMESTAMPS=${OPCACHE_VALIDATE_TIMESTAMPS:-0}
      - OPCACHE_JIT=${OPCACHE_JIT:-tracing}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - DB_DATABASE=${PERF_DB_DATABASE:-wms_hoanam}

  scheduler:
    entrypoint: ["sh", "/var/www/html/docker/php/perf-entrypoint.sh"]
    environment:
      - APP_DEBUG=false
      - LOG_LEVEL=${PERF_LOG_LEVEL:-warning}
      - LOG_STACK=${PERF_LOG_STACK:-stderr}
      - REDIS_CLIENT=${PERF_REDIS_CLIENT:-phpredis}
      # Valkey: giữ kết nối qua các request của cùng worker php-fpm (phpredis
      # pconnect) thay vì TCP connect + AUTH + SELECT mỗi request; và đặt trần
      # thời gian chờ để Valkey treo không ghim worker (xem config/database.php).
      - REDIS_PERSISTENT=${REDIS_PERSISTENT:-true}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-2}
      - REDIS_READ_TIMEOUT=${REDIS_READ_TIMEOUT:-2}
      - PERF_OPTIMIZE=false
      # Postgres qua PgBouncer (xem service pgbouncer phía dưới).
      - DB_HOST=${WMS_DB_HOST:-pgbouncer}
      - DB_PORT=${WMS_DB_PORT:-5432}
      # Scheduler chạy các lệnh DỌN DẸP (PurgeExpiredReportExports,
      # PurgeExpiredImportErrorFiles) nên phải nhìn cùng đĩa với backend/queue.
      - REPORT_EXPORT_DISK=${REPORT_EXPORT_DISK:-s3}
      # Mọi file được ghi ở request này và đọc ở request khác phải nằm trên đĩa DÙNG
      # CHUNG khi có nhiều instance: CSV lỗi import, ảnh/video bảo hành, chứng từ đính
      # kèm. Bản ghi cũ vẫn lưu storage_disk của riêng nó nên đổi ở đây không hỏng file cũ.
      - IMPORT_ERROR_FILE_DISK=${IMPORT_ERROR_FILE_DISK:-s3}
      - DOCUMENT_ATTACHMENT_DISK=${DOCUMENT_ATTACHMENT_DISK:-s3}
      - WARRANTY_PHOTO_DISK=${WARRANTY_PHOTO_DISK:-s3}
      - WARRANTY_VIDEO_DISK=${WARRANTY_VIDEO_DISK:-s3}
      - OPCACHE_VALIDATE_TIMESTAMPS=${OPCACHE_VALIDATE_TIMESTAMPS:-0}
      - DB_DATABASE=${PERF_DB_DATABASE:-wms_hoanam}
    deploy:
      resources:
        limits:
          memory: ${SCHEDULER_MEM_LIMIT:-200m}

  reverb:
    entrypoint: ["sh", "/var/www/html/docker/php/perf-entrypoint.sh"]
    environment:
      - APP_DEBUG=false
      - LOG_LEVEL=${PERF_LOG_LEVEL:-warning}
      - LOG_STACK=${PERF_LOG_STACK:-stderr}
      - REDIS_CLIENT=${PERF_REDIS_CLIENT:-phpredis}
      # Valkey: giữ kết nối qua các request của cùng worker php-fpm (phpredis
      # pconnect) thay vì TCP connect + AUTH + SELECT mỗi request; và đặt trần
      # thời gian chờ để Valkey treo không ghim worker (xem config/database.php).
      - REDIS_PERSISTENT=${REDIS_PERSISTENT:-true}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-2}
      - REDIS_READ_TIMEOUT=${REDIS_READ_TIMEOUT:-2}
      - PERF_OPTIMIZE=false
      - OPCACHE_VALIDATE_TIMESTAMPS=${OPCACHE_VALIDATE_TIMESTAMPS:-0}
      # Mỗi người dùng đang mở app giữ MỘT WebSocket tới đây. 3000 người =
      # 3000 socket mở liên tục, vượt xa giới hạn file descriptor mặc định.
      - PHP_MEMORY_LIMIT=${REVERB_MEMORY_LIMIT:-384M}
      - DB_DATABASE=${PERF_DB_DATABASE:-wms_hoanam}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: ${REVERB_MEM_LIMIT:-512m}

  # ---------------------------------------------------------------------------
  # PgBouncer — gom kết nối Postgres (07/09/2026)
  #
  # ĐO ĐƯỢC ở 150 req/s (docs/perf/LOAD_TEST_2026-09-07.md §3): 4.790 request
  # chậm trên 28 route, và ở MỌI route thời gian "SQL" chiếm 80–90 % dù chỉ có
  # ~2 câu/request (auth/me: 646/696 ms cho vài câu PK lookup 0 ms theo
  # pg_stat_statements). Laravel tính cả việc MỞ KẾT NỐI vào câu đầu tiên; mỗi
  # request mở một kết nối mới (fork + SCRAM), Postgres ngốn 5,5 lõi cho việc đó
  # khi CPU VM đã 96 %. Pool giữ kết nối server sẵn, client (php) chỉ nối TCP tới
  # pgbouncer — không fork, không PBKDF2 phía server.
  #
  # Chế độ SESSION (không phải transaction): mỗi request PHP giữ nguyên MỘT kết
  # nối server suốt request ⇒ lockForUpdate/transaction/prepared statement/
  # search_path giữ đúng ngữ nghĩa; `DISCARD ALL` khi client ngắt dọn sạch
  # transaction rò rỉ nếu PHP chết giữa chừng — an toàn hơn PDO persistent.
  #
  # Ngân sách: DEFAULT_POOL_SIZE (kết nối server tối đa) + queue + scheduler +
  # reverb + 10 dự phòng ≤ PG_MAX_CONNECTIONS (120). Thêm replica KHÔNG tăng số
  # kết nối server — chỉ tăng client (MAX_CLIENT_CONN).
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${PERF_DB_DATABASE:-wms_hoanam}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=${PGBOUNCER_POOL_MODE:-session}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_POOL_SIZE:-100}
      - MAX_DB_CONNECTIONS=${PGBOUNCER_POOL_SIZE:-100}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      - SERVER_RESET_QUERY=DISCARD ALL
      - SERVER_IDLE_TIMEOUT=${PGBOUNCER_SERVER_IDLE_TIMEOUT:-600}
      - QUERY_WAIT_TIMEOUT=${PGBOUNCER_QUERY_WAIT_TIMEOUT:-60}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEM_LIMIT:-128m}
    networks:
      - wms

  postgres:
    # Ảnh postgres mặc định là cấu hình "chạy được ở mọi nơi", không phải cấu
    # hình chạy tải: max_connections=100 và shared_buffers=128MB. Với pool
    # php-fpm vài chục worker thì 100 kết nối là trần cứng — vượt qua là lỗi
    # "sorry, too many clients already" trả thẳng 500 về người dùng.
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-120}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      # SSD: chi phí đọc ngẫu nhiên gần bằng đọc tuần tự. Để mặc định 4.0 (giả
      # định đĩa cơ) khiến trình tối ưu né index và chọn quét toàn bảng.
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - default_statistics_target=${PG_STATS_TARGET:-100}
      # Ghi log mọi truy vấn chậm hơn ngưỡng — cơ sở để tìm câu SQL cần index
      # thay vì phỏng đoán.
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
    shm_size: ${PG_SHM_SIZE:-256mb}
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-1600m}

  valkey:
    # maxmemory + volatile-lru: khi chạm trần, CHỈ những khoá có hạn dùng (cache
    # ứng dụng, session) bị dọn. Khoá không đặt TTL — quan trọng nhất là hàng đợi
    # job — không bao giờ bị đuổi. Dùng allkeys-lru ở đây sẽ làm MẤT JOB.
    # Giữ nguyên chính sách lưu đĩa mặc định của ảnh: hàng đợi phải sống sót qua
    # một lần khởi động lại.
    command:
      - valkey-server
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
      - --tcp-backlog
      - "4096"
      - --timeout
      - "0"
    deploy:
      resources:
        limits:
          memory: ${VALKEY_MEM_LIMIT:-400m}

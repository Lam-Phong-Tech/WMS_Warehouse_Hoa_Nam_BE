  '/api/v1/inbound-documents/{id}/scans':
    post:
      tags:
        - '09. Stock In (Inbound)'
      summary: 'Quét hàng cho phiếu nhập (Annex C)'
      operationId: post_api_v1_inbound__documents_id_scans
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              example: {  }
              additionalProperties: true
      responses:
        200:
          description: 'Thành công'
        400:
          description: 'Yêu cầu không đúng định dạng'
        401:
          description: 'Chưa xác thực'
        403:
          description: 'Không có quyền truy cập'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        409:
          description: 'Xung đột trạng thái, nghiệp vụ, idempotency hoặc thao tác đồng thời'
        412:
          description: 'Điều kiện If-Match không đạt'
        422:
          description: 'Dữ liệu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ'
        428:
          description: 'Thiếu điều kiện If-Match bắt buộc'
        500:
          description: 'Lỗi hệ thống ngoài dự kiến; giao dịch đã được rollback'
      security:
        -
          bearerAuth: {  }
  '/api/v1/inbound-documents/{id}/unscan':
    post:
      tags:
        - '09. Stock In (Inbound)'
      summary: 'Gỡ một dòng đã quét khỏi phiếu DRAFT/SCANNING (stock-neutral)'
      description: 'ERD bảng 28: inbound_scan_entries.status ACTIVE -> REMOVED để sửa mã quét sai trước Post; scanned_qty của line giảm tương ứng. Bắt buộc If-Match. Không tạo/không đảo stock movement. Sau Post phải dùng Reversal thay vì gỡ.'
      operationId: stock_in_unscan
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: If-Match
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - inbound_scan_entry_id
              properties:
                inbound_scan_entry_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                  nullable: true
                  maxLength: 2000
              type: object
      responses:
        200:
          description: 'Đã gỡ dòng quét; stock_effect=NONE'
        401:
          description: 'Chưa xác thực'
        403:
          description: 'Không có permission inbound.scan'
        404:
          description: 'Không tìm thấy phiếu/dòng quét'
        409:
          description: 'Phiếu không còn DRAFT/SCANNING hoặc dòng quét không còn ACTIVE'
        412:
          description: 'If-Match không khớp version hiện tại'
        422:
          description: 'Payload không hợp lệ'
        428:
          description: 'Thiếu If-Match'
        400:
          description: 'Yêu cầu không đúng định dạng'
        500:
          description: 'Lỗi hệ thống ngoài dự kiến; giao dịch đã được rollback'
      security:
        -
          bearerAuth: {  }
components:
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer

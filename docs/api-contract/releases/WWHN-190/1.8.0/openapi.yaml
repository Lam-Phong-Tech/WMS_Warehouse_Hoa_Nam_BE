openapi: 3.0.3
info:
  title: WWHN-190 Hoa Nam Posting Contract (runtime-synchronised)
  version: 1.8.0
  description: >-
    Bản đồng bộ runtime của bề mặt Scan/Post/Reversal/Reconciliation cho một kho tổng Hoa Nam. Supersede WWHN-180
    posting OpenAPI v1.7.0 (giữ nguyên làm bản lịch sử, không sửa nội dung — DISP-STK-236 §3). Khác biệt chính so với
    v1.7.0: khai đủ header If-Match bắt buộc và 412 STALE_VERSION; sửa x-permission về đúng permission key runtime
    (inbound.post / outbound.post / inbound.scan / outbound.scan ...); đổi 409 IDEMPOTENCY_ERROR thành 409
    IDEMPOTENCY_CONFLICT theo SRS §8.2; bổ sung 404 và lifecycle trạng thái; gỡ
    /stocktake/sessions/{id}/apply-adjustment theo REQ-SRS-037 + DISP-STK-236.
servers:
  - url: http://127.0.0.1:8000
    description: Local/CI; thay bằng URL môi trường đã duyệt
security:
  - bearerAuth: []
tags:
  - name: Scan
  - name: Stock Posting
  - name: Reversal
  - name: Warranty
  - name: Reconciliation
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - success
        - message
        - error_code
        - error
        - meta
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        error_code:
          type: string
          description: Mã lỗi nghiệp vụ theo SRS §8.2.
        errors:
          description: Chi tiết field/business, có thể là object hoặc mảng rỗng.
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
            details:
              description: Bằng đúng giá trị `errors`.
        meta:
          type: object
          required:
            - request_id
            - timestamp
          properties:
            request_id:
              type: string
            timestamp:
              type: string
              format: date-time
paths:
  /api/v1/scan/classify:
    post:
      operationId: wwhn190ScanClassify
      tags:
        - Scan
      summary: Phân loại mã vật lý, không đổi tồn
      x-canonical-scope: HOA_NAM_G1
      x-stock-effect: NONE
      x-permission: scan.execute|scan.classify
      x-runtime-source: Modules/Warehouse/routes/api.php ScanController@classify
      x-requires-if-match: false
      x-requires-idempotency-key: false
      x-lifecycle:
        from: []
        to: []
        note: Read-only classification; không đổi trạng thái chứng từ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - raw_code
                - context
                - warehouse_id
              properties:
                raw_code:
                  type: string
                  minLength: 1
                  maxLength: 150
                context:
                  type: string
                  enum:
                    - INBOUND
                    - OUTBOUND
                    - INVENTORY
                    - TRACE
                    - WARRANTY_RECEIVE
                    - WARRANTY_TEMP_ONLY
                warehouse_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: >-
            Thành công. Với operation idempotent: lần gọi lại cùng key + cùng payload trả đúng body đã lưu, header
            Idempotent-Replay: true và data.replayed=true.
        '401':
          description: Chưa xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - UNAUTHENTICATED
        '403':
          description: Thiếu permission hoặc ngoài warehouse data scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - ACCESS_DENIED
            - WAREHOUSE_SCOPE_DENIED
        '404':
          description: Không tìm thấy tài nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - WAREHOUSE_NOT_FOUND
        '409':
          description: Xung đột trạng thái / idempotency / concurrency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - WAREHOUSE_INACTIVE
        '422':
          description: Lỗi validation hoặc business rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - VALIDATION_ERROR
  /api/v1/inbound-documents/{id}/scan:
    post:
      operationId: wwhn190InboundScan
      tags:
        - Scan
      summary: Quét dòng phiếu nhập; stock_effect=NONE, version+1
      x-canonical-scope: HOA_NAM_G1
      x-stock-effect: NONE
      x-permission: inbound.scan
      x-runtime-source: CurrentBaselineStockFlowController@inboundScan
      x-requires-if-match: true
      x-requires-idempotency-key: false
      x-lifecycle:
        from:
          - DRAFT
          - SCANNING
        to:
          - SCANNING
        note: Ngoài DRAFT/SCANNING => 409 STATE_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: If-Match
          in: header
          required: true
          description: >-
            Version chứng từ đang giữ (ETag của lần đọc/ghi trước). Bắt buộc; thiếu => 428 PRECONDITION_REQUIRED, sai
            định dạng => 422 INVALID_VERSION, lệch => 412 STALE_VERSION.
          schema:
            type: string
            pattern: ^(W/)?"?\d+"?$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - line_id
              description: Bắt buộc có `quantity` hoặc `qty` (required_without lẫn nhau).
              properties:
                line_id:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                qty:
                  type: integer
                  minimum: 1
                  description: Bí danh của `quantity`.
                code_value:
                  type: string
                  minLength: 1
                  maxLength: 150
                  nullable: true
                item_id:
                  type: string
                  format: uuid
                  nullable: true
                container_id:
                  type: string
                  format: uuid
                  nullable: true
                printer_config_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: >-
            Thành công. Với operation idempotent: lần gọi lại cùng key + cùng payload trả đúng body đã lưu, header
            Idempotent-Replay: true và data.replayed=true.
          headers:
            ETag:
              description: Version mới của chứng từ, dùng làm If-Match cho request kế tiếp.
              schema:
                type: string
        '401':
          description: Chưa xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - UNAUTHENTICATED
        '403':
          description: Thiếu permission hoặc ngoài warehouse data scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - ACCESS_DENIED
            - WAREHOUSE_SCOPE_DENIED
        '404':
          description: Không tìm thấy tài nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - RESOURCE_NOT_FOUND
            - DOCUMENT_LINE_NOT_FOUND
        '409':
          description: Xung đột trạng thái / idempotency / concurrency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - STATE_CONFLICT
            - DUPLICATE_ITEM_IN_DOCUMENT
            - ITEM_ALREADY_RECEIVING
        '412':
          description: If-Match lệch version hiện tại. Không đổi trạng thái, tồn, movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - STALE_VERSION
        '422':
          description: Lỗi validation hoặc business rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - INVALID_VERSION
            - VALIDATION_ERROR
            - SCAN_EXCEEDS_REQUIRED
            - SKU_NOT_ACTIVE
            - ITEM_REQUIRED
            - SERIAL_QUANTITY_MUST_BE_ONE
            - PHYSICAL_CODE_NOT_FOUND
            - PHYSICAL_CODE_UNASSIGNED
            - PHYSICAL_CODE_ITEM_MISMATCH
            - ITEM_SKU_MISMATCH
            - ITEM_NOT_RECEIVABLE
        '428':
          description: Thiếu header bắt buộc (If-Match hoặc Idempotency-Key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - PRECONDITION_REQUIRED
  /api/v1/inbound-documents/{id}/post-receipt:
    post:
      operationId: wwhn190PostReceipt
      tags:
        - Stock Posting
      summary: Post Receipt toàn phiếu, exactly-once
      x-canonical-scope: HOA_NAM_G1
      x-stock-effect: RECEIPT_IN
      x-permission: inbound.post
      x-runtime-source: CurrentBaselineStockFlowController@postReceipt -> CurrentBaselineStockService::postStockDocument
      x-requires-if-match: true
      x-requires-idempotency-key: true
      x-lifecycle:
        from:
          - SCANNING
        to:
          - POSTED
        note: >-
          DEC-FULL-POST-001: mọi dòng phải scanned_qty = qty_planned, nếu không => 422 FULL_POST_REQUIRED. Ngoài
          SCANNING => 409 STATE_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: If-Match
          in: header
          required: true
          description: >-
            Version chứng từ đang giữ (ETag của lần đọc/ghi trước). Bắt buộc; thiếu => 428 PRECONDITION_REQUIRED, sai
            định dạng => 422 INVALID_VERSION, lệch => 412 STALE_VERSION.
          schema:
            type: string
            pattern: ^(W/)?"?\d+"?$
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Khoá cho một hành động đổi tồn logic; trim; 8-100 ký tự. Thiếu => 428 PRECONDITION_REQUIRED; sai độ dài =>
            422 VALIDATION_ERROR.
          schema:
            type: string
            minLength: 8
            maxLength: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                Không có field bắt buộc. Body vẫn tham gia request hash của Idempotency-Key: gửi lại cùng key với body
                khác => 409 IDEMPOTENCY_CONFLICT.
              additionalProperties: true
      responses:
        '200':
          description: >-
            Thành công. Với operation idempotent: lần gọi lại cùng key + cùng payload trả đúng body đã lưu, header
            Idempotent-Replay: true và data.replayed=true.
          headers:
            ETag:
              description: Version mới của chứng từ, dùng làm If-Match cho request kế tiếp.
              schema:
                type: string
            Idempotent-Replay:
              description: '"true" khi đây là replay của một request thành công trước đó.'
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
        '401':
          description: Chưa xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - UNAUTHENTICATED
        '403':
          description: Thiếu permission hoặc ngoài warehouse data scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - ACCESS_DENIED
            - WAREHOUSE_SCOPE_DENIED
        '404':
          description: Không tìm thấy tài nguyên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - RESOURCE_NOT_FOUND
        '409':
          description: Xung đột trạng thái / idempotency / concurrency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - STATE_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - CONCURRENCY_CONFLICT
            - DUPLICATE_STOCK_EFFECT
        '412':
          description: If-Match lệch version hiện tại. Không đổi trạng thái, tồn, movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - STALE_VERSION
        '422':
          description: Lỗi validation hoặc business rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - INVALID_VERSION
            - VALIDATION_ERROR
            - FULL_POST_REQUIRED
            - DOCUMENT_HAS_NO_LINES
            - WAREHOUSE_REQUIRED
        '428':
          description: Thiếu header bắt buộc (If-Match hoặc Idempotency-Key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
            - PRECONDITION_REQUIRED

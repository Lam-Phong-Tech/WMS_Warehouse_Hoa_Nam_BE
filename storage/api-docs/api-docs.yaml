  /api/v1/auth/change-password:
    post:
      tags:
        - '01. Authentication'
      summary: 'Đổi mật khẩu tài khoản hiện tại (thu hồi toàn bộ refresh token)'
      operationId: auth_change_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                new_password_confirmation:
                  type: string
                  format: password
              type: object
      responses:
        200:
          description: 'Đổi mật khẩu thành công'
        401:
          description: 'Chưa xác thực'
        422:
          description: 'Mật khẩu hiện tại sai hoặc dữ liệu không hợp lệ'
        400:
          description: 'Yêu cầu không đúng định dạng'
        403:
          description: 'Không có quyền truy cập'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        409:
          description: 'Xung đột trạng thái, nghiệp vụ, idempotency hoặc thao tác đồng thời'

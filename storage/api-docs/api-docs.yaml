        - '01. Authentication'
      summary: 'Đăng nhập bằng email và password'
      operationId: auth_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@gmail.com
                password:
                  type: string
                  format: password
                  example: Cntt@1234
              type: object
      responses:
        200:
          description: 'Đăng nhập thành công'
        401:
          description: 'Sai định danh hoặc mật khẩu'
        403:
          description: 'Tài khoản bị khoá/ngừng hoạt động'
        422:
          description: 'Dữ liệu không hợp lệ'
        400:
          description: 'Yêu cầu không đúng định dạng'
        404:

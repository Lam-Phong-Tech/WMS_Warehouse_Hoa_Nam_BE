        - '01. Authentication'
      summary: 'Đăng xuất, thu hồi refresh token và huỷ access token hiện tại'
      operationId: auth_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  description: 'Tuỳ chọn với browser có HttpOnly refresh cookie.'
                  type: string
                  nullable: true
              type: object
      responses:
        200:
          description: 'Đăng xuất thành công'
        401:
          description: 'Chưa xác thực'
        422:
          description: 'refresh_token sai kiểu dữ liệu'
        400:
          description: 'Yêu cầu không đúng định dạng'
        403:

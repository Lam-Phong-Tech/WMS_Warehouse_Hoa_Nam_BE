      description: 'Validate toàn bộ file trước khi ghi. Có bất kỳ lỗi nào thì committed=false và không tạo/cập nhật SKU. Khi dry_run=true (WWHN-224), toàn bộ rule nghiệp vụ vẫn được áp dụng như import thật nhưng tuyệt đối không ghi SKU/audit nghiệp vụ; kết quả kiểm tra thử luôn được lưu vào Import báo cáo (import_reports) và trả về import_report_id để tra cứu lại.'
      operationId: sku_import_excel
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                update_existing:
                  type: boolean
                  default: false
                dry_run:
                  description: 'true = chỉ kiểm tra thử, không ghi dữ liệu (WWHN-224)'
                  type: boolean
                  default: false
              type: object
      responses:
        200:
          description: 'Import committed atomically, hoặc dry-run hợp lệ (committed=false, dry_run=true)'
        401:
          description: Unauthenticated
        403:
          description: 'Missing product.manage permission'
        409:
          description: 'Concurrent unique conflict; no partial write'
        422:
          description: 'File/row validation failed; no business side effect'
        400:
          description: 'Yêu cầu không đúng định dạng'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        412:
          description: 'Điều kiện If-Match không đạt'
        428:
          description: 'Thiếu điều kiện If-Match bắt buộc'
        500:
          description: 'Lỗi hệ thống ngoài dự kiến; giao dịch đã được rollback'
      security:
        -
          bearerAuth: []

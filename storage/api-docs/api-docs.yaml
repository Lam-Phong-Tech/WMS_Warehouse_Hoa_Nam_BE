openapi: 3.0.0
info:
  title: 'WMS_HoaNam API'
  description: 'OpenAPI route surface is generated from the real Laravel /api/v1 route list. Business semantics follow HN-BA-MASTER-DEVTEST-001 v1.0 and HN-WMS-ERD-DD-001 v1.0 (04/08/2026). MVP is full-post only, has no Stocktake scope, and uses inventory movements as the authoritative ledger. Envelope: {success, message, data, meta, links, error}.'
  version: 2.0.0
servers:
  -
    url: 'http://localhost:8080'
    description: 'Configured API server'
paths:
  /api/v1/agencies:
    get:
      tags:
        - '16. Agency'
      summary: 'Danh sách đại lý'
      operationId: get_api_v1_agencies
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            default: 15
        -
          name: keyword
          in: query
          schema:
            type: string
        -
          name: status
          in: query
          schema:
            type: string
      responses:
        200:
          description: 'Thành công'
        400:
          description: 'Yêu cầu không đúng định dạng'
        401:
          description: 'Chưa xác thực'
        403:
          description: 'Không có quyền truy cập'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        409:
          description: 'Xung đột trạng thái, nghiệp vụ, idempotency hoặc thao tác đồng thời'
        412:
          description: 'Điều kiện If-Match không đạt'
        422:
          description: 'Dữ liệu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ'
        428:
          description: 'Thiếu điều kiện If-Match bắt buộc'
        500:
          description: 'Lỗi hệ thống ngoài dự kiến; giao dịch đã được rollback'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - '16. Agency'
      summary: 'Tạo đại lý mới'
      operationId: post_api_v1_agencies
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              example: []
              additionalProperties: true
      responses:

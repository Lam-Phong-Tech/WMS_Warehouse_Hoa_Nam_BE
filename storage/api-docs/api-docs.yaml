  /api/v1/auth/refresh:
    post:
      tags:
        - '01. Authentication'
      summary: 'Xoay vòng refresh token từ JSON hoặc HttpOnly browser cookie'
      description: 'Browser có thể bỏ trống body sau F5; server dùng HttpOnly refresh cookie. Swagger/Postman/non-browser client vẫn có thể gửi refresh_token trong JSON body. Token cũ bị thu hồi và replay sẽ khóa toàn bộ phiên.'
      operationId: auth_refresh
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  description: 'Tuỳ chọn với browser có HttpOnly refresh cookie; bắt buộc nếu client không dùng cookie.'
                  type: string
                  nullable: true
              type: object
      responses:
        200:
          description: 'Làm mới token thành công'
        401:
          description: 'Refresh token không hợp lệ, hết hạn hoặc bị replay'
        422:
          description: 'Không có refresh token trong JSON body hoặc browser cookie'
        400:
          description: 'Yêu cầu không đúng định dạng'
        403:
          description: 'Không có quyền truy cập'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        409:
          description: 'Xung đột trạng thái, nghiệp vụ, idempotency hoặc thao tác đồng thời'
        412:
          description: 'Điều kiện If-Match không đạt'
        428:
          description: 'Thiếu điều kiện If-Match bắt buộc'
        500:
          description: 'Lỗi hệ thống ngoài dự kiến; giao dịch đã được rollback'
      security: []
  /api/v1/auth/switch-context:

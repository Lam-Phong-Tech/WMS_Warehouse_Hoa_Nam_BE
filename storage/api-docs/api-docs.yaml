        200:
          description: 'Danh sách audit log (actor_id/action/object_type/object_id/before_data/after_data/created_at)'
        401:
          description: 'Chưa xác thực'
        403:
          description: 'Không có quyền audit_log.view'
        400:
          description: 'Yêu cầu không đúng định dạng'
        404:

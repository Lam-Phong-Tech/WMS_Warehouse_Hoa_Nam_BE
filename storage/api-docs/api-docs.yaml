  /api/v1/inbound-documents:
    get:
      tags:
        - '09. Stock In (Inbound)'
      summary: 'Danh sách phiếu nhập kho (phân trang, tìm kiếm, lọc trạng thái)'
      description: "Phiếu nhập kho (doc_type=receipt).\n\nBaseline hiện hành chỉ có state machine DRAFT -> SCANNING -> POSTED/CANCELLED.\nKhông tồn tại approval workflow hoặc vòng đời nhận hàng một phần; chỉ dùng Full Post.\nRuntime write actions được route tới CurrentBaselineDocumentController /\nCurrentBaselineStockFlowController; các annotation dưới đây chỉ mô tả contract thật\nđể RouteSyncProcessor giữ schema chi tiết khi đồng bộ OpenAPI theo Laravel route list."
      operationId: stock_in_list
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            default: 15
        -
          name: keyword
          in: query
          schema:
            type: string
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - SCANNING
              - POSTED
              - CANCELLED
      responses:
        200:
          description: 'Danh sách phiếu nhập kho'
        401:
          description: 'Chưa xác thực'
        403:
          description: 'Không có permission inbound.view'
        400:
          description: 'Yêu cầu không đúng định dạng'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        409:
          description: 'Xung đột trạng thái, nghiệp vụ, idempotency hoặc thao tác đồng thời'
        412:
          description: 'Điều kiện If-Match không đạt'
        422:
          description: 'Dữ liệu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ'
        428:
          description: 'Thiếu điều kiện If-Match bắt buộc'
        500:
          description: 'Lỗi hệ thống ngoài dự kiến; giao dịch đã được rollback'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - '09. Stock In (Inbound)'
      summary: 'Tạo phiếu nhập kho DRAFT'
      description: 'Tạo chứng từ DRAFT và các dòng Expected. DRAFT chưa làm thay đổi tồn kho. Idempotency-Key là tuỳ chọn khi tạo.'
      operationId: stock_in_create
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - dst_warehouse_id
                - lines
              properties:
                doc_no:
                  type: string
                  nullable: true
                  maxLength: 80
                doc_date:
                  type: string
                  format: date
                  nullable: true
                dst_warehouse_id:
                  type: string
                  format: uuid
                source_name:
                  type: string
                  nullable: true
                  maxLength: 255
                note:
                  type: string
                  nullable: true
                  maxLength: 2000
                lines:
                  type: array
                  items:
                    required:
                      - product_id
                      - qty_planned
                    properties:
                      product_id:
                        type: string
                        format: uuid
                      import_batch_id:
                        type: string
                        format: uuid
                        nullable: true
                      qty_planned:
                        type: integer
                        example: 10
                        minimum: 1
                      note:
                        type: string
                        nullable: true
                        maxLength: 2000
                    type: object
                  minItems: 1
              type: object
      responses:
        201:
          description: 'Tạo phiếu nhập DRAFT thành công'
        401:
          description: 'Chưa xác thực'
        403:
          description: 'Không có permission inbound.create'
        409:
          description: 'Xung đột Idempotency-Key'
        422:
          description: 'Kho/SKU/dòng dữ liệu không hợp lệ'
        200:
          description: 'Thành công'
        400:
          description: 'Yêu cầu không đúng định dạng'
        404:
          description: 'Không tìm thấy tài nguyên hoặc nằm ngoài phạm vi dữ liệu'
        412:
          description: 'Điều kiện If-Match không đạt'
        428:

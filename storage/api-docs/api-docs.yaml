        - '01. Authentication'
      summary: 'Chuyển ngữ cảnh (warehouse scope) và cấp lại access token mới'
      operationId: auth_switch_context
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                context_type:
                  type: string
                  nullable: true
                  maxLength: 50
                context_id:
                  type: string
                  nullable: true
                  maxLength: 100
                scope_ref:
                  type: string
                  nullable: true
                  maxLength: 100

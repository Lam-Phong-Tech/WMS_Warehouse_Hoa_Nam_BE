services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_DOCKER_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - wms

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html:delegated
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - MAIL_HOST=mailpit
      - AWS_ENDPOINT=http://minio:9000
      - AWS_BUCKET=${AWS_BUCKET:-wms-hoanam}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wms

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - .:/var/www/html:delegated
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - MAIL_HOST=mailpit
      - AWS_ENDPOINT=http://minio:9000
      - AWS_BUCKET=${AWS_BUCKET:-wms-hoanam}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wms

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wms_hoanam}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_DOCKER_PORT:-5432}:5432"
    volumes:
      - wms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wms

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_DOCKER_PORT:-6379}:6379"
    volumes:
      - wms_valkey_data:/data
    networks:
      - wms

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_DOCKER_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_WEB_DOCKER_PORT:-8025}:8025" # Web UI
    networks:
      - wms

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_API_DOCKER_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_DOCKER_PORT:-9001}:9001" # Console
    volumes:
      - wms_minio_data:/data
    networks:
      - wms

networks:
  wms:
    driver: bridge

volumes:
  wms_postgres_data:
  wms_valkey_data:
  wms_minio_data:

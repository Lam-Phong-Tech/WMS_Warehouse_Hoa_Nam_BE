services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_DOCKER_PORT:-8080}:80"
    environment:
      # Fallback for $wms_forwarded_port in default.conf.template when the
      # client sends no X-Forwarded-Port (plain local access, no external TLS
      # terminator) — must match the host-mapped port above so self-referential
      # URLs Laravel generates (L5-Swagger docs.json, asset links) keep it.
      - WMS_NGINX_EXTERNAL_PORT=${NGINX_DOCKER_PORT:-8080}
    volumes:
      - .:/var/www/html:delegated
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wms

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html:delegated
      - wms_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-wms_hoanam}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SESSION_DRIVER=redis
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      # Cache config nằm trong filesystem CỦA CONTAINER, không phải bind mount
      # dùng chung: một `config:clear` từ container chạy test không xoá được cache
      # của container đang phục vụ nữa. Entrypoint dựng lại ở mỗi lần khởi động.
      # Đo được: bớt ~140 ms MỖI request trên stack dev (health p50 287 → 143 ms).
      # Xem chú thích dài trong docker/php/entrypoint.sh.
      # Sửa .env xong phải `docker compose restart backend`; đặt
      # WMS_CACHE_CONFIG=false khi đang cần sửa .env liên tục.
      - WMS_CACHE_CONFIG=${WMS_CACHE_CONFIG:-true}
      - APP_CONFIG_CACHE=/var/cache/wms/config.php
      - MAIL_HOST=mailpit
      # Mặc định là MinIO của stack dev. KHÔNG hard-code: giá trị trong container
      # ghi đè .env mà Laravel đọc (Dotenv không overwrite biến môi trường thật),
      # nên bản deploy đặt AWS_ENDPOINT=<R2 endpoint> trong .env sẽ bị kéo ngược về
      # MinIO nội bộ và media ghi nhầm chỗ.
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://minio:9000}
      - AWS_BUCKET=${AWS_BUCKET:-wms-hoanam}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # .env mặc định REVERB_HOST=localhost cho máy host chạy FE; trong mạng
      # docker container này phải trỏ tới service `reverb` theo tên container.
      - REVERB_HOST=reverb
      - REVERB_PORT=6001
      - REVERB_SCHEME=http
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wms

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # WWHN-295: worker timeout và queue retry_after phải đọc CÙNG một biến.
    # config/queue.php suy ra retry_after = QUEUE_WORKER_TIMEOUT + 30 nên job
    # chạy sát ngưỡng không bị queue phát lại cho worker thứ hai.
    command: ["sh", "-lc", "php artisan queue:work --tries=3 --timeout=${QUEUE_WORKER_TIMEOUT:-90}"]
    volumes:
      - .:/var/www/html:delegated
      - wms_vendor:/var/www/html/vendor
    environment:
      - AUTO_MIGRATE=false
      - QUEUE_WORKER_TIMEOUT=${QUEUE_WORKER_TIMEOUT:-90}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-wms_hoanam}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - MAIL_HOST=mailpit
      # Mặc định là MinIO của stack dev. KHÔNG hard-code: giá trị trong container
      # ghi đè .env mà Laravel đọc (Dotenv không overwrite biến môi trường thật),
      # nên bản deploy đặt AWS_ENDPOINT=<R2 endpoint> trong .env sẽ bị kéo ngược về
      # MinIO nội bộ và media ghi nhầm chỗ.
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://minio:9000}
      - AWS_BUCKET=${AWS_BUCKET:-wms-hoanam}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # Listener của Notification module broadcast NotificationPushed từ worker
      # này — phải trỏ tới service `reverb`, không phải REVERB_HOST=localhost
      # mặc định trong .env (dành cho FE chạy trên máy host).
      - REVERB_HOST=reverb
      - REVERB_PORT=6001
      - REVERB_SCHEME=http
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wms

  # Notification bell real-time: Reverb là WebSocket server first-party của
  # Laravel (BROADCAST_CONNECTION=reverb), FE (Echo) kết nối trực tiếp cổng này.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Cổng 8080 đã bị service `nginx` chiếm — dùng 6001 (mặc định phổ biến của
    # Reverb) để tránh đụng cổng trên host.
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    volumes:
      - .:/var/www/html:delegated
      - wms_vendor:/var/www/html/vendor
    environment:
      - AUTO_MIGRATE=false
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=6001
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-wms_hoanam}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    ports:
      - "6001:6001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wms

  # DEV219-P1-04R: bằng chứng hạ tầng thực sự gọi Schedule::command() trong
  # routes/console.php (inventory:reconcile, audit:reconcile). Không có process nào
  # gọi `schedule:run`/`schedule:work` thì các Schedule::command() ở đó chỉ là đăng ký,
  # không bao giờ tự chạy. `schedule:work` (Laravel 8+) tự lặp mỗi phút, tương đương
  # cron `* * * * * php artisan schedule:run` nhưng không cần cấu hình cron riêng trong
  # image.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html:delegated
      - wms_vendor:/var/www/html/vendor
    environment:
      - AUTO_MIGRATE=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-wms_hoanam}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - MAIL_HOST=mailpit
      # Mặc định là MinIO của stack dev. KHÔNG hard-code: giá trị trong container
      # ghi đè .env mà Laravel đọc (Dotenv không overwrite biến môi trường thật),
      # nên bản deploy đặt AWS_ENDPOINT=<R2 endpoint> trong .env sẽ bị kéo ngược về
      # MinIO nội bộ và media ghi nhầm chỗ.
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://minio:9000}
      - AWS_BUCKET=${AWS_BUCKET:-wms-hoanam}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wms

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wms_hoanam}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_DOCKER_PORT:-5432}:5432"
    volumes:
      - wms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wms

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Cùng chính sách bộ nhớ với docker-compose.perf.yml — CỐ Ý, để dev chạm đúng
    # ngữ nghĩa mà production sẽ chạm. Mặc định của ảnh là maxmemory=0 +
    # noeviction: Valkey lớn lên không giới hạn cho tới khi hết RAM máy, rồi MỌI
    # lệnh ghi bắt đầu lỗi — session hỏng, đẩy job vào hàng đợi hỏng. Với payload
    # báo cáo cỡ MB nhân số tổ hợp bộ lọc, đó không phải tình huống lý thuyết.
    #
    # volatile-lru: chạm trần thì CHỈ khoá có TTL (cache ứng dụng, session) bị
    # dọn. Hàng đợi job không đặt TTL nên không bao giờ bị đuổi — allkeys-lru ở
    # đây sẽ LÀM MẤT JOB.
    command:
      - valkey-server
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "${REDIS_DOCKER_PORT:-6379}:6379"
    volumes:
      - wms_valkey_data:/data
    networks:
      - wms

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_DOCKER_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_WEB_DOCKER_PORT:-8025}:8025" # Web UI
    networks:
      - wms

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_API_DOCKER_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_DOCKER_PORT:-9001}:9001" # Console
    volumes:
      - wms_minio_data:/data
    networks:
      - wms

  # Tạo sẵn bucket media của stack dev.
  #
  # Trước khi có service này, MinIO khởi động với /data RỖNG và chưa ai tạo
  # bucket, nên mọi lần ghi qua disk `s3` trả về false TRONG IM LẶNG (config
  # filesystems đặt 'throw' => false). Không màn nào báo lỗi vì ảnh sản phẩm App
  # PV là tính năng đầu tiên thực sự ghi lên disk này (phát hiện 06/09/2026).
  #
  # One-shot: chạy xong là thoát; `mb --ignore-existing` nên chạy lại vô hại.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      sh -lc "
      until mc alias set local http://minio:9000 '${AWS_ACCESS_KEY_ID:-minioadmin}' '${AWS_SECRET_ACCESS_KEY:-minioadmin}' >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/${AWS_BUCKET:-wms-hoanam};
      echo 'minio bucket ready: ${AWS_BUCKET:-wms-hoanam}';
      "
    restart: "no"
    networks:
      - wms

networks:
  wms:
    driver: bridge

volumes:
  wms_postgres_data:
  wms_valkey_data:
  wms_minio_data:
  wms_vendor:
